<style>
  /* ---- semantic theme tokens: every colour in the app resolves through these ---- */
  :root{
    --bg:        248 249 251;

    --surface2:  243 245 248;
    --line:      226 231 238;

  html.dark{
    --bg:         18  18  18;   /* matte charcoal, so cards lift off it */

  }
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ overscroll-behavior-y:none; }
  body{
    background: rgb(var(--bg));
    color: rgb(var(--fg));
    transition: background-color .28s ease, color .28s ease;
  }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

  /* ---- chunky tactile buttons: the press is the whole point ---- */
  .btn{
    position:relative; border-radius:16px; font-weight:800;
    border:2px solid rgb(var(--line-hard));
    box-shadow:0 4px 0 rgb(var(--ledge));
    transition: transform .06s ease, box-shadow .06s ease, background-color .18s ease, border-color .18s ease;
  }
  .btn:active:not(:disabled){ transform: translateY(4px); box-shadow:0 0 0 rgb(var(--ledge)); }
  .btn:disabled{ opacity:.45; }
  .btn-primary{
    background: rgb(var(--brand)); color: rgb(var(--brand-ink));

  .oddcell{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:10px; border:1px solid rgb(var(--line));
    background: rgb(var(--surface2));
    padding:6px 3px; min-height:48px; width:100%;
    transition: background .15s ease, border-color .15s ease, transform .08s ease;
  }
  .oddcell:active{ transform: scale(.96); }
  .oddcell.sel{ background: rgb(var(--brand) / .16); border-color: rgb(var(--brand)); }
  .oddcell.empty{ opacity:.3; }

  .btn-sel{
    background: rgb(var(--brand) / .14) !important;
    border-color: rgb(var(--brand)) !important;
    color: rgb(var(--brand));
  }
  .tap{ transition: transform .12s cubic-bezier(.2,.8,.3,1), opacity .18s ease; }
  /* holding a message opens the reactions, so iOS must not offer to copy it instead */
  [data-msg]{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  /* a headline's blurb gets two lines and no more, so every card is the same height */
  .line-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tap:active{ transform: scale(.97); }

  .card{
    background: rgb(var(--surface));
    border:2px solid rgb(var(--line));
    border-radius:20px;
    box-shadow:0 2px 0 rgb(var(--line));
  }

  .view{ animation: viewIn .28s cubic-bezier(.22,.9,.3,1); }
  @keyframes viewIn{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:none; } }

  @keyframes pulseDot{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.3; transform:scale(.75);} }
  .live-dot{ animation: pulseDot 1.4s ease-in-out infinite; }

  @keyframes coinPop{ 0%{ transform:scale(1);} 35%{ transform:scale(1.2);} 100%{ transform:scale(1);} }
  .coin-pop{ animation: coinPop .5s cubic-bezier(.3,1.4,.4,1); }

  @keyframes sheetUp{ from{ transform: translateY(102%);} to{ transform:none; } }
  @keyframes sheetDown{ from{ transform:none;} to{ transform: translateY(102%);} }
  .sheet-in{ animation: sheetUp .32s cubic-bezier(.22,.9,.3,1); }
  .sheet-out{ animation: sheetDown .24s cubic-bezier(.5,0,.75,0) forwards; }

  @keyframes barUp{ from{ opacity:0; transform: translateY(20px);} to{ opacity:1; transform:none;} }
  .bar-in{ animation: barUp .26s cubic-bezier(.22,.9,.3,1); }

  @keyframes toastIn{ from{ opacity:0; transform: translateY(-14px) scale(.96);} to{ opacity:1; transform:none;} }
  @keyframes toastOut{ to{ opacity:0; transform: translateY(-12px) scale(.97);} }
  .toast-in{ animation: toastIn .28s cubic-bezier(.22,.9,.3,1); }
  .toast-out{ animation: toastOut .26s ease forwards; }

  @keyframes confettiFall{ to{ transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); opacity:0; } }
  .confetti-bit{ position:fixed; top:-16px; width:9px; height:14px; border-radius:2px; z-index:90; animation: confettiFall linear forwards; }

  @keyframes flameWiggle{ 0%,100%{ transform: rotate(-4deg) scale(1);} 50%{ transform: rotate(4deg) scale(1.08);} }
  .flame{ animation: flameWiggle 1.8s ease-in-out infinite; display:inline-block; }

  .xpfill{ transition: width .6s cubic-bezier(.22,.9,.3,1); }

  /* team crest: coloured initials are the base, the real logo covers them only once it loads,
     so a blocked or offline image degrades instead of showing a broken icon */
  .crest{ position:relative; display:grid; place-items:center; border-radius:12px; overflow:hidden; }
  .crest-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .2s ease; }
  .crest-img.ok{ opacity:1; }
  .crest-img.instant{ transition:none; }   /* already cached — no fade on repaint */
  .crest:has(.crest-img.ok){ background:transparent !important; }
  .crest:has(.crest-img.ok) .crest-txt{ opacity:0; }

  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }

  .safe-b{ padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* The tab bar grows by the home-indicator inset on iPhone, so anything floating above
     it is positioned from the nav's measured height rather than a fixed guess. */
  .above-nav  { bottom: calc(var(--navh, 64px) + 10px); }
  .above-nav2 { bottom: calc(var(--navh, 64px) + 78px); }

  .safe-t{ padding-top: env(safe-area-inset-top, 0px); }

<script>
/* ================================================================
   SPANK BETTING
   Virtual currency only ("Spank Coins"). No real money, ever.

   Two kinds of games share one engine:
   Every game is real: matchups, scores, clocks and odds come from ESPN's public
   feed, covering a week of NFL, NBA, MLB and NHL.
================================================================= */
(() => {
'use strict';

/* ---------------- constants ---------------- */
/* ?demo loads a populated account on its own storage key, so the app shows well
   on command without touching a real one. */
const DEMO = (() => { try { return new URLSearchParams(location.search).has('demo'); } catch(e){ return false; } })();

const LS_KEY        = DEMO ? 'spankbet.demo.v3' : 'spankbet.state.v3';
const LS_LEGACY     = ['spankbet.state.v2','spankbet.state.v1'];
const START_BALANCE = 500;    // a small stake: you have to actually play it well
const WEEK_BACK     = 1;      // days of finished games kept on the board
const WEEK_AHEAD    = 5;      // days of upcoming games loaded
const MIN_BET       = 10;
const MAX_LEGS      = 8;
const CASHOUT_MARGIN= 0.92;
const MAX_PAYOUT    = 100000; // sportsbooks cap a ticket, and so must this: an 8-leg
                              // longshot compounds past what a number can hold
const XP_PER_LEVEL  = 100;

const XP = { bet:10, win:25, pick:15, pickWin:25, cashout:5, bonus:5 };

/* leagues we pull live, and the shape of each sport's clock */
/* `week` marks a league whose default scoreboard already spans its own week, so it
   is fetched once instead of a day at a time. `q` narrows a college feed to the top
   division — without it college football alone returns several hundred teams. */
const LIVE_LEAGUES = {
  NFL:   { path:'football/nfl',                     icon:'🏈', name:'NFL',   periods:4, periodMin:15, sigma:13.2, base:44,  week:true },
  NCAAF: { path:'football/college-football',        icon:'🎓', name:'NCAAF', periods:4, periodMin:15, sigma:16.5, base:52,  week:true, q:'groups=80', cap:25 },
  NBA:   { path:'basketball/nba',                   icon:'🏀', name:'NBA',   periods:4, periodMin:12, sigma:11.5, base:225 },
  NCAAB: { path:'basketball/mens-college-basketball', icon:'📣', name:'NCAAB', periods:2, periodMin:20, sigma:11,  base:145, q:'groups=50', cap:20 },
  MLB:   { path:'baseball/mlb',                     icon:'⚾️', name:'MLB',   periods:9, periodMin:0,  sigma:4.1,  base:8.5 },
  NHL:   { path:'hockey/nhl',                       icon:'🏒', name:'NHL',   periods:3, periodMin:20, sigma:2.6,  base:6.5 }
};

const leagueMeta = lg => LIVE_LEAGUES[lg] || { icon:'🏅', name:lg, periods:4, periodMin:15, base:50 };

const BADGES = [
  { id:'first',   icon:'🎟️', name:'First Ticket',   desc:'Place your first bet',              test:s => s.stats.bets >= 1 },
  { id:'winner',  icon:'✅', name:'Cashed',          desc:'Win a bet',                         test:s => s.stats.wins >= 1 },
  { id:'streak3', icon:'🔥', name:'Heater',          desc:'Win 3 bets in a row',               test:s => s.stats.bestStreak >= 3 },
  { id:'day7',    icon:'📅', name:'Seven Straight',  desc:'A 7-day app streak',                test:s => s.streak.best >= 7 },
  { id:'dog',     icon:'🐕', name:'Dog Whisperer',   desc:'Cash a +150 underdog or longer',    test:s => s.stats.dogWin },
  { id:'parlay',  icon:'🎰', name:'Parlay Hitter',   desc:'Win a 3+ leg parlay',               test:s => s.stats.parlayWins >= 1 },
  { id:'bail',    icon:'🏃', name:'Cash Out Carl',   desc:'Cash out of a live ticket',         test:s => s.stats.cashouts >= 1 },
  { id:'prop',    icon:'🎯', name:'Prop Sniper',     desc:'Win a player prop',                 test:s => s.stats.propWins >= 1 },
  { id:'real',    icon:'📡', name:'Real Deal',       desc:'Win a bet on a real game',          test:s => s.stats.liveWins >= 1 },
  { id:'pick5',   icon:'🗳️', name:'Pick Machine',    desc:'Nail 5 Daily Picks',                test:s => s.stats.pickWins >= 5 },
  { id:'high',    icon:'💎', name:'High Roller',     desc:'Risk 1,000 coins on one ticket',    test:s => s.stats.biggestStake >= 1000 },
  { id:'comeback',icon:'🩹', name:'Comeback Kid',    desc:'Claim a bailout after going broke', test:s => s.stats.bailouts >= 1 },
  { id:'volume',  icon:'📚', name:'Volume Shooter',  desc:'Place 10 bets',                     test:s => s.stats.bets >= 10 },
  { id:'sharp',   icon:'🧠', name:'Certified Sharp', desc:'60%+ win rate on 5+ settled bets',  test:s => (s.stats.wins+s.stats.losses) >= 5 && s.stats.wins/(s.stats.wins+s.stats.losses) >= .6 },
  { id:'whale',   icon:'🐳', name:'Whale',           desc:'Hold 10,000 coins',                 test:s => s.stats.peakBalance >= 10000 }
];

const PRIZES = [
  { id:'p_rookie', icon:'🌱', name:'Rookie Card',     cost:250,   desc:'Where everyone starts' },
  { id:'p_ice',    icon:'🧊', name:'Ice in the Veins', cost:750,  desc:'Unbothered under pressure' },
  { id:'p_shark',  icon:'🦈', name:'Card Shark',      cost:1500,  desc:'People stop taking your action' },
  { id:'p_crown',  icon:'👑', name:'Crown',           cost:3000,  desc:'For the leaderboard climber' },
  { id:'p_rocket', icon:'🚀', name:'Moonshot',        cost:5000,  desc:'Nothing but upside' },
  { id:'p_goat',   icon:'🐐', name:'GOAT',            cost:10000, desc:'Self explanatory' }
];

const AVATARS = ['🦍','🐉','🦅','🐺','🦊','🐸','🦈','🐲','👑','🔥','⚡️','💎','🎯','🃏','🚀','🥷','🤖','👽','🦁','🐍'];

const TIERS = [
  { name:'Bronze',   icon:'🥉', color:'#b45309', at:0     },
  { name:'Silver',   icon:'🥈', color:'#64748b', at:500   },
  { name:'Gold',     icon:'🥇', color:'#d9910d', at:1500  },
  { name:'Sapphire', icon:'💠', color:'#0ea5e9', at:3500  },
  { name:'Ruby',     icon:'♦️', color:'#e11d48', at:7000  },
  { name:'Diamond',  icon:'💎', color:'#8b5cf6', at:12000 }
];
/* Your rank is your own XP, not a placing against a field of invented rivals. */
const tierIndex = xp => { let i = 0; for (let k = 0; k < TIERS.length; k++) if (xp >= TIERS[k].at) i = k; return i; };
const myTier    = () => tierIndex(S.xp.total);

/* ---------------- utils ---------------- */
const $  = (s, r=document) => r.querySelector(s);
const el = (t, cls, html) => { const n=document.createElement(t); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2,10);
const fmt  = n => Math.round(n).toLocaleString('en-US');
const fmt1 = n => (Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:1, maximumFractionDigits:1});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const dayKey = (t=now()) => { const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function weekKey(t=now()){
  const d = new Date(t); const day = (d.getDay()+6)%7;           // Monday-based
  d.setDate(d.getDate()-day); d.setHours(0,0,0,0);

const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);

function timeAgo(t){
  const s = Math.max(1, (now()-t)/1000);
  if (s < 60) return Math.floor(s)+'s ago';
  if (s < 3600) return Math.floor(s/60)+'m ago';
  if (s < 86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function countdown(ms){
  if (ms <= 0) return 'Starting';
  const m = Math.floor(ms/60000), s = Math.floor(ms%60000/1000);
  if (m >= 1440) return Math.floor(m/1440)+'d '+Math.floor((m%1440)/60)+'h';
  if (m >= 60) return Math.floor(m/60)+'h '+(m%60)+'m';
  if (m >= 1)  return m+'m '+String(s).padStart(2,'0')+'s';
  return s+'s';
}

/* odds helpers */
const americanToMult = a => a > 0 ? 1 + a/100 : 1 + 100/Math.abs(a);
const cappedPayout = (stake, mult) => {
  const raw = Math.round(stake * mult);
  return Number.isFinite(raw) ? Math.min(MAX_PAYOUT, raw) : MAX_PAYOUT;
};
const impliedProb    = a => a > 0 ? 100/(a+100) : Math.abs(a)/(Math.abs(a)+100);
const fmtAmerican    = a => (a > 0 ? '+' : '') + Math.round(a);
function probToAmerican(p){
  p = clamp(p, .04, .96);
  return p >= .5 ? -Math.round((p/(1-p))*100/5)*5 : Math.round(((1-p)/p)*100/5)*5;
}
const multToAmerican = m => m >= 2 ? Math.round((m-1)*100) : -Math.round(100/(m-1));
const fmtLine = n => (n > 0 ? '+' : '') + (Math.round(n*2)/2);
const logistic = x => 1/(1+Math.exp(-x));
/* normal CDF, used to turn a real point spread into a win probability */
function normCdf(z){
  const t = 1/(1+.2316419*Math.abs(z));
  const d = .3989423*Math.exp(-z*z/2);
  const p = d*t*(.3193815 + t*(-.3565638 + t*(1.781478 + t*(-1.821256 + t*1.330274))));
  return z > 0 ? 1-p : p;
}
const spreadToProb = (spread, sigma) => normCdf(-spread/sigma);   // spread is from that team's view

/* inverse normal CDF (Acklam's approximation) — turns a win probability back into points */
function probit(p){
  p = clamp(p, 1e-4, 1 - 1e-4);
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.3577518672690,-30.66479806614716,2.506628277459239];
  const b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572];
  const c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
  const d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425;
  let q, r;
  if (p < pl){ q = Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if (p > 1-pl){ q = Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q = p - 0.5; r = q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q /
         (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

/* ================================================================
   LIVE SPORTS  —  ESPN public feed, no key required
================================================================= */
/* site.web.api is the host ESPN's own web front end uses: it answers browser requests
   with access-control-allow-origin:*, while site.api returns 403 to anything sending a
   browser User-Agent. Same payloads, but this one is reachable from a hosted page. */
const ESPN = 'https://site.web.api.espn.com/apis/site/v2/sports/';
let LIVE = [];                   // normalised real games, memory only
let liveState = { at:0, loading:false, error:null, tried:false, fails:0 };
let weekState = { at:0, loading:false, done:false };

async function getJSON(url, ms=9000){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

/* ESPN publishes a newsroom per league. Stories and video clips come back in the
   same shape, so both land on the home screen and the clips get a play marker. */
async function refreshNews(force){
  if (newsState.loading) return false;
  if (!force && now() - newsState.at < 30*60*1000) return false;
  newsState.loading = true;
  try {
    const leagues = Object.keys(LIVE_LEAGUES);
    const lists = await Promise.all(leagues.map(lg =>
      getJSON(ESPN + LIVE_LEAGUES[lg].path + '/news', 8000)
        .then(d => (d.articles || []).map(x => normalizeNews(lg, x)).filter(Boolean))
        .catch(() => [])));

    const seen = new Set();
    const items = lists.flat()
      .filter(x => { if (seen.has(x.id)) return false; seen.add(x.id); return true; })
      .sort((a, b) => b.at - a.at)
      .slice(0, 14);

    if (items.length){
      newsState.items = items;
      S.news = items;                      // so it is on screen instantly next open
      save();
    }
    newsState.at = now();
  } catch(e){ /* the board matters more than the newsroom */ }
  finally { newsState.loading = false; }
  return true;
}

function normalizeNews(lg, x){
  const href = ((x.links || {}).web || {}).href || ((x.links || {}).mobile || {}).href || '';
  const head = x.headline || x.title || '';
  if (!href || !head) return null;
  const img = ((x.images || [])[0] || {}).url || '';
  return {
    id: String(x.id || href),
    league: lg,
    head,
    blurb: (x.description || '').slice(0, 160),
    href,
    img,
    video: x.type === 'Media' || /\/video\//.test(href),
    at: Date.parse(x.published || x.lastModified || '') || now()
  };
}

function normalizeEspn(lg, ev){
  const L = LIVE_LEAGUES[lg];
  const c = (ev.competitions || [])[0];
  if (!c) return null;
  const comp = c.competitors || [];
  const home = comp.find(x => x.homeAway === 'home');
  const away = comp.find(x => x.homeAway === 'away');
  if (!home || !away) return null;

  const team = t => ({
    name: t.team.shortDisplayName || t.team.name || t.team.displayName,
    abbr: t.team.abbreviation || (t.team.shortDisplayName||'').slice(0,3).toUpperCase(),
    color: t.team.color ? '#'+t.team.color : '#64748b',
    logo: t.team.logo || null,
    rec: ((t.records || [])[0] || {}).summary || '',
    rank: ((t.curatedRank || {}).current) || 99          // 1-25 in the college polls
  });

  const st = c.status || {};
  const state = (st.type || {}).state || 'pre';
  const o = (c.odds || [])[0] || null;

  const g = {
    id: 'live:' + ev.id,
    src: 'live',
    eventId: String(ev.id),
    path: L.path,
    league: lg,
    home: team(home), away: team(away),
    startsAt: Date.parse(ev.date) || now(),
    state,                                        // pre | in | post
    period: st.period || 0,
    displayClock: st.displayClock || '',
    clockText: (st.type || {}).shortDetail || '',
    score: { home: Number(home.score) || 0, away: Number(away.score) || 0 },
    spread: null, total: null, ml: null, mlReal: false, mlSource: null,
    half: null, first: null, method: null, props: [],
    updatedAt: now()
  };
  g.rank = Math.min(g.home.rank, g.away.rank);       // the best-ranked side, for picking a slate

  if (o){
    if (typeof o.spread === 'number' && Math.abs(o.spread) > 0){
      g.spread = { home:o.spread, away:-o.spread, odds:-110 };   // ESPN's spread is the home line
    }
    if (typeof o.overUnder === 'number') g.total = { line:o.overUnder, odds:-110 };
    const hm = (o.homeTeamOdds || {}).moneyLine, am = (o.awayTeamOdds || {}).moneyLine;
    if (typeof hm === 'number' && typeof am === 'number'){
      g.ml = { home:hm, away:am }; g.mlReal = true; g.mlSource = 'book';
    }
  }
  if (!g.ml && g.spread){
    const pHome = spreadToProb(g.spread.home, L.sigma);
    g.ml = { home: probToAmerican(pHome + .022), away: probToAmerican(1 - pHome + .022) };
    g.mlSource = 'spread';                    // still anchored to a real published spread
  }
  if (!g.ml){
    // ESPN posts no line at all for most of the week's board. Rather than invent a
    // number or leave the game unbettable, price it off both teams' real records
    // and label it an estimate.
    g.ml = recordLine(g);
    g.mlSource = 'model';
  }

  // A market the feed omits leaves a dead column on the card, so derive the missing
  // ones from the moneyline this game already has. Anything derived is labelled.
  if (!g.spread){
    const pHome = noVigHome(g.ml);
    const raw = -probit(pHome) * L.sigma;
    let line = Math.round(raw * 2) / 2;
    if (g.league === 'MLB' || g.league === 'NHL') line = line >= 0 ? 1.5 : -1.5;  // runline / puckline
    if (line === 0) line = pHome >= .5 ? -.5 : .5;
    g.spread = { home: line, away: -line, odds:-110, derived:true };
  }
  if (!g.total){
    g.total = { line: Math.round(L.base * 2) / 2, odds:-110, derived:true };
  }
  return g;
}

/* strips the bookmaker's margin so the two sides sum to 1 */
function noVigHome(ml){
  const h = impliedProb(ml.home), a = impliedProb(ml.away);
  return (h + a) > 0 ? clamp(h / (h + a), .05, .95) : .5;
}

/* a crude but honest line from the two teams' real win rates */
function recordLine(g){
  const rate = rec => {
    const n = String(rec || '').split('-').map(Number);
    const w = n[0] || 0, l = n[1] || 0;
    return (w + l) > 0 ? w / (w + l) : .5;
  };
  const edge = rate(g.home.rec) - rate(g.away.rec);
  const pHome = clamp(.5 + edge * .55 + .035, .25, .75);       // .035 is home advantage
  return { home: probToAmerican(pHome + .022), away: probToAmerican(1 - pHome + .022) };
}

function dayStamp(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}

/* ESPN serves one day at a time — date ranges are rejected — so a week is a day per call.
   NFL is the exception: its default scoreboard already covers the whole week's slate. */
async function fetchLeagueDay(lg, stamp){
  const L = LIVE_LEAGUES[lg];
  const q = [stamp ? 'dates=' + stamp : '', L.q || ''].filter(Boolean).join('&');
  const url = ESPN + L.path + '/scoreboard' + (q ? '?' + q : '');
  const d = await getJSON(url);
  const games = (d.events || []).map(ev => normalizeEspn(lg, ev)).filter(Boolean);
  return L.cap ? bestOfDay(games, L.cap) : games;
}

/* A college division runs to hundreds of teams and one Saturday can carry sixty
   games. Keep what people actually want — ranked matchups first, then whatever
   starts soonest — capped per day, so every day still gets its share. */
function bestOfDay(games, cap){
  const days = new Map();
  for (const g of games){
    const k = dayKey(g.startsAt);
    if (!days.has(k)) days.set(k, []);
    days.get(k).push(g);
  }

  /* A game nobody can lose is no fun to bet, and early-season college is full of
     them, so a contest goes ahead of a walkover. Within each bucket the polls
     decide, then kickoff time. The last few slots still go to the big names even
     if they are playing a cupcake — you can still take the spread or the total. */
  const contest = g => { const p = noVigHome(g.ml); return Math.max(p, 1 - p) < MAX_CONFIDENCE; };
  const order = (a, b) => (a.rank - b.rank) || (a.startsAt - b.startsAt);

  const out = [];
  for (const day of days.values()){
    const close = day.filter(contest).sort(order);
    const rest  = day.filter(g => !contest(g)).sort(order);
    const keep  = close.slice(0, Math.max(0, cap - 5));
    keep.push(...rest.slice(0, cap - keep.length));
    if (keep.length < cap) keep.push(...close.slice(keep.length));
    out.push(...keep.slice(0, cap));
  }
  return out;
}

function mergeGames(list){
  const byId = new Map(LIVE.map(g => [g.id, g]));
  for (const g of list){
    const old = byId.get(g.id);
    if (old && old.mlReal && !g.mlReal){ g.ml = old.ml; g.mlReal = true; g.mlSource = 'book'; }
    byId.set(g.id, g);
  }
  LIVE = [...byId.values()].sort((a,b) => a.startsAt - b.startsAt);
  for (const g of LIVE) if (betDependsOn(g.id)) S.liveCache[g.id] = slimGame(g);
}

/* today's slate, refreshed often — this is what has to stay current */
async function refreshLive(force){
  if (liveState.loading) return false;
  const anyLive = LIVE.some(g => g.state === 'in');
  const maxAge = liveState.fails ? Math.min(60000 * Math.pow(2, liveState.fails - 1), 300000)
                                 : (anyLive ? 25000 : 120000);
  if (!force && now() - liveState.at < maxAge) return false;

  liveState.loading = true;
  try {
    const today = dayStamp(0);
    const lists = await Promise.all(Object.keys(LIVE_LEAGUES).map(lg =>
      fetchLeagueDay(lg, LIVE_LEAGUES[lg].week ? null : today).catch(() => null)));
    if (!lists.some(Boolean)) throw new Error('all leagues failed');
    mergeGames(lists.filter(Boolean).flat());
    liveState.error = null;
    liveState.fails = 0;
  } catch(e){
    liveState.error = e && e.message ? e.message : 'offline';
    liveState.fails = Math.min(liveState.fails + 1, 5);
  } finally {
    liveState.loading = false;
    liveState.at = now();
    liveState.tried = true;
  }
  return true;
}

/* the rest of the week, filled in behind today's slate so the board is usable immediately */
async function fillWeek(force){
  if (weekState.loading) return false;
  if (!force && now() - weekState.at < 10*60*1000) return false;
  weekState.loading = true;
  try {
    const days = [];
    for (let d = -WEEK_BACK; d <= WEEK_AHEAD; d++) if (d !== 0) days.push(dayStamp(d));
    const leagues = Object.keys(LIVE_LEAGUES).filter(lg => !LIVE_LEAGUES[lg].week);

    for (const stamp of days){
      const lists = await Promise.all(leagues.map(lg => fetchLeagueDay(lg, stamp).catch(() => null)));
      const got = lists.filter(Boolean).flat();
      if (got.length){ mergeGames(got); afterLive(); }
    }
    weekState.at = now();
    weekState.done = true;
  } catch(e){ /* partial weeks are fine — whatever arrived is on the board */ }
  finally { weekState.loading = false; }
  return true;
}

const slimGame = g => ({ id:g.id, src:'live', eventId:g.eventId, path:g.path, league:g.league,
  home:g.home, away:g.away, startsAt:g.startsAt, state:g.state, period:g.period,
  displayClock:g.displayClock, clockText:g.clockText, score:g.score,
  spread:g.spread, total:g.total, ml:g.ml, mlReal:g.mlReal,
  half:null, first:null, method:null, props:[], updatedAt:now() });

const betDependsOn = gameId => S.bets.some(b => b.status === 'active' && b.legs.some(l => l.gameId === gameId));

/* pulls a real sportsbook moneyline for one game (ESPN only publishes it per-event) */
async function upgradeOdds(g){
  if (!g || g.src !== 'live' || g.mlReal || oddsInFlight.has(g.id)) return;
  if (g.state === 'post') return;
  oddsInFlight.add(g.id);
  try {
    const d = await getJSON(ESPN + g.path + '/summary?event=' + g.eventId, 8000);
    const pc = (d.pickcenter || [])[0];
    const hm = pc && (pc.homeTeamOdds || {}).moneyLine;
    const am = pc && (pc.awayTeamOdds || {}).moneyLine;
    if (typeof hm === 'number' && typeof am === 'number'){
      g.ml = { home:hm, away:am };
      g.mlReal = true;
      g.mlSource = 'book';
      if (pc.overUnder && !g.total) g.total = { line:pc.overUnder, odds:-110 };
      if (betDependsOn(g.id)) S.liveCache[g.id] = slimGame(g);
      renderMain();
    }
  } catch(e){ /* keep the derived line */ }
  finally { oddsInFlight.delete(g.id); }
}

/* a real game a ticket is riding on may have dropped off today's board — settle it by event id */
async function settleStaleLive(){
  const pending = new Set();
  for (const b of S.bets){
    if (b.status !== 'active') continue;
    for (const l of b.legs){
      if (l.src !== 'live' || (l.status && l.status !== 'open')) continue;
      if (LIVE.some(g => g.id === l.gameId)) continue;
      pending.add(l.gameId);
    }
  }
  if (!pending.size) return false;
  let changed = false;
  for (const id of [...pending].slice(0, 6)){
    const snap = S.liveCache[id];
    if (!snap || oddsInFlight.has('settle:'+id)) continue;
    oddsInFlight.add('settle:'+id);
    try {
      const d = await getJSON(ESPN + snap.path + '/summary?event=' + snap.eventId, 8000);
      const c = ((d.header || {}).competitions || [])[0];
      if (!c) continue;
      const st = ((c.status || {}).type || {});
      const comp = c.competitors || [];
      const h = comp.find(x => x.homeAway === 'home'), a = comp.find(x => x.homeAway === 'away');
      if (!h || !a) continue;
      snap.state = st.state || snap.state;
      snap.clockText = st.shortDetail || snap.clockText;
      snap.period = (c.status || {}).period || snap.period;
      snap.displayClock = (c.status || {}).displayClock || snap.displayClock;
      snap.score = { home:Number(h.score)||0, away:Number(a.score)||0 };
      S.liveCache[id] = snap;
      changed = true;
    } catch(e){ /* try again next pass */ }
    finally { oddsInFlight.delete('settle:'+id); }
  }
  if (changed) save();
  return changed;
}

/* every game the app knows about: today's board plus any game a live ticket rides on */
function allGames(){
  const out = LIVE.slice();
  const have = new Set(out.map(g => g.id));
  for (const id of Object.keys(S.liveCache)){
    if (!have.has(id) && betDependsOn(id)) out.push(S.liveCache[id]);
  }
  return out;
}
const gameById = id => allGames().find(g => g.id === id) || null;

/* ================================================================
   UNIFIED GAME VIEW  —  the rest of the app never asks which kind it is
================================================================= */
function gProgress(g){
  if (!g) return 0;
  if (g.state === 'pre') return 0;
  if (g.state === 'post') return 1;
  const L = leagueMeta(g.league);
  const per = clamp(g.period || 1, 1, L.periods);
  if (g.league === 'MLB') return clamp((per - .5) / 9, .02, .98);
  const parts = String(g.displayClock || '').split(':');
  const left = parts.length === 2 ? (Number(parts[0]) + Number(parts[1])/60) : L.periodMin/2;
  const within = L.periodMin ? clamp(1 - left/L.periodMin, 0, 1) : .5;
  return clamp(((per - 1) + within) / L.periods, .02, .98);
}
const gIsLive  = g => !!g && g.state === 'in';
const gIsFinal = g => !!g && g.state === 'post';
const gIsPre   = g => !!g && g.state === 'pre';
const gScore = g => g.score;
const gFinalScore = g => g.score;

const gClock = g => g.clockText || (g.state === 'post' ? 'Final' : '');

/* month and day, never a year */
function gDayLabel(t){
  const d = new Date(t), today = new Date();
  const tmr = new Date(today); tmr.setDate(tmr.getDate()+1);
  const yst = new Date(today); yst.setDate(yst.getDate()-1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === tmr.toDateString())   return 'Tomorrow';
  if (d.toDateString() === yst.toDateString())   return 'Yesterday';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function gWhen(g){
  if (gIsLive(g)) return gClock(g);
  if (gIsFinal(g)) return 'Final';
  const ms = g.startsAt - now();
  if (ms > 0 && ms < 60*60*1000) return countdown(ms);
  const day = gDayLabel(g.startsAt);
  return (day === 'Today' ? '' : day + ' ') + clockTime(g.startsAt);
}
const isToday = t => new Date(t).toDateString() === new Date().toDateString();

/* ---------------- markets ---------------- */
function marketRows(g){
  const rows = [];
  rows.push({ group:'Winner', row:[
    { key:'ml:away', type:'ml', side:'away', label:g.away.abbr, sub:'Moneyline', odds:g.ml.away },
    { key:'ml:home', type:'ml', side:'home', label:g.home.abbr, sub:'Moneyline', odds:g.ml.home }
  ]});
  if (g.spread) rows.push({ group:'Spread', row:[
    { key:'spread:away', type:'spread', side:'away', label:g.away.abbr+' '+fmtLine(g.spread.away), sub:'Spread', odds:g.spread.odds, line:g.spread.away },
    { key:'spread:home', type:'spread', side:'home', label:g.home.abbr+' '+fmtLine(g.spread.home), sub:'Spread', odds:g.spread.odds, line:g.spread.home }
  ]});
  if (g.total) rows.push({ group:'Total Points', row:[
    { key:'total:over',  type:'total', side:'over',  label:'Over '+g.total.line,  sub:'Total', odds:g.total.odds, line:g.total.line },
    { key:'total:under', type:'total', side:'under', label:'Under '+g.total.line, sub:'Total', odds:g.total.odds, line:g.total.line }
  ]});

  const out = [];
  for (const r of rows){
    const priced = priceRow(g, r.row);
    if (priced) out.push(Object.assign({}, r, { row: priced }));
  }
  return out;
}

/* Once a game is under way the opening price is stale: re-price from the live win
   probability, and pull a market off the board once it is effectively decided. */
const LIVE_VIG = .026;
/* Markets close well before a result is certain. Without this a decided game still
   offered its favourite at -2400, which let you park coins on a near-lock over and
   over and never feel the daily limit. */
const MAX_CONFIDENCE = .80;

/* How sure this side already is. Live, that comes from the score and the clock.
   Before kickoff it is just the price: a spread or a total is a coin flip by
   construction, but a moneyline can be anything, and college brings a lot of
   mismatches a real book will happily price at -1500. */
function sureness(g, m){
  if (gIsLive(g)) return legWinProb(m, g);
  if (m.type !== 'ml' || !g.ml) return .5;
  const pHome = noVigHome(g.ml);
  return m.side === 'home' ? pHome : 1 - pHome;
}

function livePrice(g, m){
  const held = S.slip.legs.find(l => l.gameId === g.id && l.key === m.key);
  if (held) return held.odds;                 // a price in your slip never moves or vanishes
  const prob = sureness(g, m);
  if (prob >= MAX_CONFIDENCE || prob <= 1 - MAX_CONFIDENCE) return null;
  return gIsLive(g) ? probToAmerican(prob + LIVE_VIG) : m.odds;
}
function priceRow(g, row){
  const inSlip = row.some(m => hasLeg(g.id, m.key));
  const out = [];
  for (const m of row){
    const odds = livePrice(g, m);
    if (odds === null && !inSlip) return null;      // closed, and nothing of yours rides on it
    out.push(Object.assign({}, m, { odds: odds === null ? m.odds : odds }));
  }
  return out;
}
function findMarket(g, key){
  for (const r of marketRows(g)){
    const hit = r.row.find(m => m.key === key);
    if (hit) return hit;
  }
  return null;
}
const winnerMarkets = g => (marketRows(g).find(r => r.group === 'Winner') || { row:[] }).row;

/* ---------------- bet slip ---------------- */
const legCount = () => S.slip.legs.length;
const hasLeg = (gameId, key) => S.slip.legs.some(l => l.gameId === gameId && l.key === key);
const slipMult = () => S.slip.legs.reduce((m, l) => m * americanToMult(l.odds), 1);

function toggleLeg(gameId, key){
  if (isBroke()) return toast("You're out for today — back at midnight.", 'bad');
  const g = gameById(gameId);
  if (!g) return;
  if (gIsFinal(g)) return toast('That game is already final.', 'bad');

  const legs = S.slip.legs;
  const at = legs.findIndex(l => l.gameId === gameId && l.key === key);
  if (at >= 0){ legs.splice(at, 1); save(); renderAll(); return; }
  if (legs.length >= MAX_LEGS) return toast('Max ' + MAX_LEGS + ' legs.', 'bad');

  const m = findMarket(g, key);
  if (!m) return;

  const sameGame = legs.findIndex(l => l.gameId === gameId);
  const replaced = sameGame >= 0;
  if (replaced) legs.splice(sameGame, 1);

  legs.push({
    gameId, key, src:g.src, league:g.league,
    matchup:g.away.abbr+' @ '+g.home.abbr, matchupFull:g.away.name+' vs '+g.home.name,
    type:m.type, side:m.side, line: m.line != null ? m.line : null, propId:m.propId || null,
    label:m.label, sub:m.sub, odds:m.odds, status:'open'
  });
  if (g.src === 'live') S.liveCache[g.id] = slimGame(g);
  save();
  if (replaced) toast('Swapped your pick on ' + g.away.abbr + ' @ ' + g.home.abbr, 'gold', 2000);
  renderAll();
}

function clearSlip(){ S.slip.legs = []; save(); closeSheet(); renderAll(); }

function placeBet(){
  const legs = S.slip.legs;
  if (!legs.length) return;

  for (const l of legs){
    const g = gameById(l.gameId);
    if (!g || gIsFinal(g)){
      S.slip.legs = legs.filter(x => x.gameId !== l.gameId);
      save(); renderAll(); if (legCount()) renderSheet(); else closeSheet();
      return toast('A leg went final and left your slip.', 'bad');
    }
  }

  const stake = Math.floor(S.slip.stake);
  if (!Number.isFinite(stake) || stake < MIN_BET) return toast('Minimum bet is ' + MIN_BET + ' coins.', 'bad');
  if (stake > S.balance) return toast("You don't have enough coins.", 'bad');

  const mult = slipMult();
  const bet = {
    id: uid(),
    legs: legs.map(l => Object.assign({}, l, { status:'open' })),
    stake, odds: multToAmerican(mult), mult,
    payout: cappedPayout(stake, mult), toWin: cappedPayout(stake, mult) - stake,
    status:'active', placedAt:now(), settledAt:null, cashValue:null
  };

  for (const l of bet.legs){
    const g = gameById(l.gameId);
    if (g && g.src === 'live') S.liveCache[g.id] = slimGame(g);
  }

  S.balance -= stake;
  S.bets.unshift(bet);
  S.stats.bets++;
  S.stats.wagered += stake;
  S.stats.biggestStake = Math.max(S.stats.biggestStake, stake);
  S.slip = { legs: [], stake: clamp(Math.floor(S.balance/10), MIN_BET, 100) };
  awardXp(XP.bet, 'Bet placed');
  pushHistory(); checkBadges(); save();

  closeSheet();
  const what = bet.legs.length > 1 ? bet.legs.length + '-leg parlay' : bet.legs[0].label;
  toast('Bet placed · ' + fmt(stake) + ' 🪙 on ' + what, 'good');
  syncPush('bets', { uid: myUid(), name:S.profile.name, realName:S.profile.realName || '',
    avatar:S.profile.avatar, label:what,
    matchup: bet.legs[0].matchup, odds: bet.odds, stake, t: now() });
  syncHeartbeat();
  if (stake >= 750 || bet.legs.length >= 4){
    addFeed({ user:S.profile.name, avatar:S.profile.avatar, me:true, kind:'bet',
      text:'just put ' + fmt(stake) + ' coins on ' +
        (bet.legs.length > 1 ? 'a ' + bet.legs.length + '-leg parlay at ' + fmtAmerican(bet.odds)
                             : bet.legs[0].label + ' (' + bet.legs[0].matchup + ')') + '.' });
  }
  renderAll();
}

/* ---------------- grading ---------------- */
function gradeLeg(leg, g){
  const F = gFinalScore(g);
  if (leg.type === 'ml'){
    if (F.home === F.away) return 'push';
    return leg.side === (F.home > F.away ? 'home' : 'away') ? 'won' : 'lost';
  }
  if (leg.type === 'spread'){
    const mine  = leg.side === 'home' ? F.home : F.away;
    const other = leg.side === 'home' ? F.away : F.home;
    const adj = mine + leg.line;
    if (adj === other) return 'push';
    return adj > other ? 'won' : 'lost';
  }
  if (leg.type === 'total'){
    const tot = F.home + F.away;
    if (tot === leg.line) return 'push';
    return (leg.side === 'over' ? tot > leg.line : tot < leg.line) ? 'won' : 'lost';
  }
  return 'lost';
}

function settleBets(){
  let changed = false;

  for (const b of S.bets){
    if (b.status !== 'active') continue;
    let anyLost = false, allDone = true;

    for (const leg of b.legs){
      if (leg.status && leg.status !== 'open'){ if (leg.status === 'lost') anyLost = true; continue; }
      const g = gameById(leg.gameId);
      if (!g){
        if (leg.src === 'live'){ allDone = false; continue; }   // real game: wait for the result to arrive
        leg.status = 'push'; changed = true; continue;          // sim game gone: void the leg
      }
      if (!gIsFinal(g)){ allDone = false; continue; }
      leg.status = gradeLeg(leg, g);
      const fs = gFinalScore(g);
      leg.finalHome = fs.home; leg.finalAway = fs.away;
      if (leg.status === 'lost') anyLost = true;
      changed = true;
    }

    if (anyLost){
      b.status = 'lost'; b.settledAt = now();
      S.stats.losses++; S.stats.profit -= b.stake; S.stats.streak = 0;
      const dead = b.legs.find(l => l.status === 'lost');
      toast('Lost · ' + (b.legs.length > 1 ? 'parlay died on ' + dead.label : dead.label), 'bad', 3600);
      notify('Bet lost', (b.legs.length > 1 ? b.legs.length + '-leg parlay' : dead.label) + ' — ' + fmt(b.stake) + ' coins');
      changed = true;
    } else if (allDone){
      const live = b.legs.filter(l => l.status === 'won');
      b.settledAt = now();
      if (!live.length){
        b.status = 'push'; S.balance += b.stake; S.stats.pushes++;
        toast('Push · ' + fmt(b.stake) + ' 🪙 refunded', 'gold');
      } else {
        const mult = live.reduce((m, l) => m * americanToMult(l.odds), 1);
        const payout = cappedPayout(b.stake, mult);
        b.status = 'won'; b.payout = payout; b.toWin = payout - b.stake;
        S.balance += payout;
        S.stats.wins++; S.stats.returned += payout; S.stats.profit += b.toWin;
        S.stats.streak = Math.max(0, S.stats.streak) + 1;
        S.stats.bestStreak = Math.max(S.stats.bestStreak, S.stats.streak);
        S.stats.biggestWin = Math.max(S.stats.biggestWin, b.toWin);
        if (b.legs.some(l => l.odds >= 150)) S.stats.dogWin = true;
        if (b.legs.length >= 3) S.stats.parlayWins++;
        if (b.legs.some(l => l.type === 'prop')) S.stats.propWins++;
        if (b.legs.some(l => l.src === 'live')) S.stats.liveWins++;
        awardXp(XP.win, 'Bet won');
        toast('Winner! +' + fmt(payout) + ' 🪙', 'good', 4200);
        notify('You won ' + fmt(payout) + ' coins 🎉', b.legs.length > 1 ? b.legs.length + '-leg parlay cashed' : b.legs[0].label + ' cashed');
        confetti();
        if (b.toWin >= 400 || b.legs.length >= 3){
          const brag = 'cashed ' + (b.legs.length > 1 ? 'a ' + b.legs.length + '-leg parlay' : b.legs[0].label) + ' for ' + fmt(payout) + ' coins.';
          if (!sayToRoom(brag, { tone:'win', amount:payout }))
            addFeed({ user:S.profile.name, avatar:S.profile.avatar, me:true, kind:'win', amount:payout, text:brag });
        }
      }
      changed = true;
    }
    S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
  }

  if (changed){ pushHistory(); checkBadges(); save(); }
  return changed;
}

/* ---------------- live cash-out ---------------- */
function legWinProb(leg, g){
  if (!g) return 0;
  if (leg.status === 'won') return 1;
  if (leg.status === 'lost') return 0;

  const L = leagueMeta(g.league);
  const p = gProgress(g);
  const prior = impliedProb(leg.odds);
  if (p <= 0) return prior;
  if (gIsFinal(g)) return gradeLeg(leg, g) === 'lost' ? 0 : 1;

  const r = clamp(1 - p, 0, 1);
  const scale = Math.max(1, g.total ? g.total.line : L.base);
  const sigma = Math.max(.9, scale * .22 * Math.sqrt(r));
  const s = gScore(g);

  if (leg.type === 'ml' || leg.type === 'spread'){
    const mine  = leg.side === 'home' ? s.home : s.away;
    const other = leg.side === 'home' ? s.away : s.home;
    const edge  = mine - other + (leg.line || 0);
    return clamp(logistic(edge / (sigma * .62)), .01, .99);
  }
  if (leg.type === 'total'){
    const projected = s.home + s.away + scale * r;
    const edge = (projected - leg.line) * (leg.side === 'over' ? 1 : -1);
    return clamp(logistic(edge / (sigma * .62)), .01, .99);
  }
  return prior;
}

function cashOutValue(b){
  if (b.status !== 'active') return 0;
  let p = 1;
  for (const leg of b.legs){
    const g = gameById(leg.gameId);
    if (!g) return 0;                       // can't price what we can't see
    p *= legWinProb(leg, g);
  }
  return Math.max(0, Math.floor(b.payout * p * CASHOUT_MARGIN));
}

function cashOut(betId){
  const b = S.bets.find(x => x.id === betId);
  if (!b || b.status !== 'active') return;
  const value = cashOutValue(b);
  if (value < 1) return toast('This ticket is worth nothing right now.', 'bad');

  confirmModal('Cash out ' + fmt(value) + ' 🪙?',
    'Ends the bet now for ' + (value >= b.stake ? 'a ' + fmt(value - b.stake) + ' coin profit' : 'a ' + fmt(b.stake - value) + ' coin loss') +
    ', however it would have landed. The price keeps moving until you confirm.',
    'Cash out', () => {
      if (b.status !== 'active') return;
      const v = cashOutValue(b);
      b.status = 'cashed'; b.cashValue = v; b.settledAt = now();
      S.balance += v;
      S.stats.cashouts++; S.stats.returned += v; S.stats.profit += (v - b.stake);
      S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
      awardXp(XP.cashout, 'Cashed out');
      pushHistory(); checkBadges(); save();
      toast('Cashed out for ' + fmt(v) + ' 🪙', v >= b.stake ? 'good' : 'gold');
      renderAll();
    }, 'btn-primary');
}

/* ================================================================
   PLAYING TOGETHER
   A Firebase Realtime Database speaks plain REST, so a static page can use it
   with nothing but fetch and EventSource — no SDK, no build step. Everyone who
   enters the same room code sees the same chat, bets and leaderboard.
================================================================= */
const sync = { es:null, hb:null, connected:false, room:null,
               players:{}, chat:{}, bets:{}, meta:{}, reacts:{}, lastErr:null };

/* The main room. Open the link and you are in it with everyone else who did —
   no code to type, no sign-up. A private code just swaps you onto your own room. */
const LOBBY = 'MAIN';
let SERVER = '';

/* The address lives in config.json beside index.html, so it can change without
   touching the app. Opening the file straight off disk simply finds nothing. */
function loadConfig(){
  if (location.protocol === 'file:') return Promise.resolve();   // nothing to fetch off a disk
  return fetch('config.json', { cache:'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(c => { if (c && typeof c.server === 'string') SERVER = c.server.trim().replace(/\/+$/, ''); })
    .catch(() => {});
}

const syncUrl  = () => ((S.sync && S.sync.url) || SERVER || '').replace(/\/+$/, '');
const syncRoom = () => (S.sync && S.sync.room) || (syncUrl() ? LOBBY : '');
const inLobby  = () => syncRoom() === LOBBY;
const syncOn   = () => !!(syncUrl() && syncRoom());
const roomPath = suffix => syncUrl() + '/rooms/' + encodeURIComponent(syncRoom()) + (suffix || '') + '.json';

function myUid(){
  if (!S.sync.uid) { S.sync.uid = 'u' + uid() + uid(); save(); }
  return S.sync.uid;
}

function syncDisconnect(){
  if (sync.es){ try { sync.es.close(); } catch(e){} sync.es = null; }
  clearInterval(sync.hb); sync.hb = null;
  sync.connected = false;
  sync.players = {}; sync.chat = {}; sync.bets = {}; sync.meta = {}; sync.reacts = {};
}

function syncConnect(){
  syncDisconnect();
  if (!syncOn()) return;
  sync.room = syncRoom();
  try {
    const es = new EventSource(roomPath());
    sync.es = es;
    const take = e => { try { applySync(JSON.parse(e.data)); } catch(err){} };
    es.addEventListener('put', take);
    es.addEventListener('patch', take);
    es.onopen = () => { sync.connected = true; sync.lastErr = null; renderMain(); };
    es.onerror = () => { sync.connected = false; sync.lastErr = 'lost connection'; renderMain(); };
  } catch(e){ sync.lastErr = 'could not connect'; }
  syncHeartbeat();
  sync.hb = setInterval(syncHeartbeat, 20000);
}

/* Firebase streams {path, data}: "/" replaces the room, anything else sets a branch */
function applySync(msg){
  if (!msg || typeof msg !== 'object') return;
  const parts = String(msg.path || '/').split('/').filter(Boolean);
  if (!parts.length){
    const d = msg.data || {};
    sync.players = d.players || {};
    sync.chat    = d.chat || {};
    sync.bets    = d.bets || {};
    sync.reacts  = d.reacts || {};
    sync.meta    = d.meta || sync.meta || {};    // a name we just set outruns the snapshot
    if (sync.meta && sync.meta.name) rememberChat(syncRoom(), sync.meta.name);
  } else {
    const [branch, key] = parts;
    if (branch === 'reacts'){
      /* reacts/<messageId>/<uid>, so this one arrives two levels deep */
      const [, msgId, who] = parts;
      if (msgId == null) sync.reacts = msg.data || {};
      else if (who == null){
        sync.reacts = Object.assign({}, sync.reacts);
        if (msg.data == null) delete sync.reacts[msgId]; else sync.reacts[msgId] = msg.data;
      } else {
        const one = Object.assign({}, sync.reacts[msgId]);
        if (msg.data == null) delete one[who]; else one[who] = msg.data;
        sync.reacts = Object.assign({}, sync.reacts, { [msgId]: one });
      }
      renderMain();
      return;
    }
    if (branch === 'meta'){
      if (key == null) sync.meta = msg.data || {};
      else sync.meta = Object.assign({}, sync.meta, { [key]: msg.data });
      if (sync.meta && sync.meta.name) rememberChat(syncRoom(), sync.meta.name);
      renderMain();
      return;
    }
    const bucket = branch === 'players' ? sync.players : branch === 'chat' ? sync.chat : branch === 'bets' ? sync.bets : null;
    if (!bucket) return;
    if (key == null) {
      if (branch === 'players') sync.players = msg.data || {};
      if (branch === 'chat')    sync.chat    = msg.data || {};
      if (branch === 'bets')    sync.bets    = msg.data || {};
    } else if (msg.data == null) delete bucket[key];
    else bucket[key] = msg.data;
  }
  renderMain();
}

function syncPush(branch, body){
  if (!syncOn()) return Promise.resolve(false);
  return fetch(roomPath('/' + branch), { method:'POST', body: JSON.stringify(body) })
    .then(r => !!r && r.ok).catch(() => false);
}

/* presence: who is in the room, and what they are holding */
function syncHeartbeat(){
  if (!syncOn()) return;
  const d = derived();
  fetch(roomPath('/players/' + myUid()), {
    method:'PUT',
    body: JSON.stringify({
      name: S.profile.name, realName: S.profile.realName || '',
      avatar: S.profile.avatar, coins: Math.round(S.balance + d.atRisk),
      xp: S.xp.total, weekXp: S.xp.weekXp, streak: S.streak.count, seen: now()
    })
  }).catch(() => {});
}

const PRESENCE_MS = 2*60*1000;    // a heartbeat lands every 20s, so this is generous
const GHOST_MS    = 45*1000;      // past this, a second record for one name is a leftover
const MEMBER_MS   = 30*24*60*60*1000;   // a month away and the board lets you go
const isOnline    = p => now() - (p.seen || 0) < PRESENCE_MS;

/* Everyone in this chat, awake or not. Leaving deletes your row, so what is left
   is the people who belong here — the board should show them at 3am too. */
function roomMembers(){
  const all = Object.entries(sync.players)
    .map(([id, p]) => Object.assign({ id }, p))
    .filter(p => p && p.name && now() - (p.seen || 0) < MEMBER_MS)
    .sort((a, b) => (b.seen || 0) - (a.seen || 0));    // freshest record of a person wins

  /* One row per person. A reinstall leaves an old record behind under the same
     name, and that is the same human, so the newer record stands in for both. */
  const rows = new Map();
  for (const p of all){
    const key = (String(p.name) + '|' + String(p.realName || '')).toLowerCase();
    if (!rows.has(key)) rows.set(key, p);
  }
  return [...rows.values()].slice(0, 50);
}

function roomPlayers(){
  const here = Object.entries(sync.players)
    .map(([id, p]) => Object.assign({ id }, p))
    .filter(p => p && p.name && now() - (p.seen || 0) < PRESENCE_MS)
    .sort((a, b) => (b.seen || 0) - (a.seen || 0));    // freshest first

  /* One row per person. A new phone or a cleared browser leaves an old record
     behind, so a name that is still beating wins and the stale twin is dropped —
     but two friends who really are both online keep their own rows. */
  const rows = new Map();
  for (const p of here){
    const name = String(p.name).toLowerCase();
    if (!rows.has(name)) { rows.set(name, p); continue; }
    if (now() - (p.seen || 0) > GHOST_MS) continue;
    rows.set(name + '#' + p.id, p);
  }
  return [...rows.values()].sort((a, b) => (b.coins || 0) - (a.coins || 0));
}

const roomChat = () => Object.entries(sync.chat)
  .map(([id, m]) => Object.assign({ id }, m))
  .filter(m => m && m.text)
  .sort((a, b) => (a.t || 0) - (b.t || 0))
  .slice(-120);

const roomBets = () => Object.entries(sync.bets)
  .map(([id, x]) => Object.assign({ id }, x))
  .filter(x => x && x.label)
  .sort((a, b) => (b.t || 0) - (a.t || 0))
  .slice(0, 30);

/* What this chat is called. Whoever makes it names it; everyone else reads the
   name off the room, so a link lands you in "Sunday Crew", not in "K7M2P". */
const chatName = () => (sync.meta && sync.meta.name) || nameFor(syncRoom());

/* Chats you belong to. Someone can be handed three different links; all three
   stay, and the one you are reading is simply the active one. */
const myChats  = () => (S.sync && Array.isArray(S.sync.rooms)) ? S.sync.rooms : [];
const nameFor  = code => (myChats().find(c => c.code === code) || {}).name || '';

function rememberChat(code, name){
  if (!code || code === LOBBY) return;
  const list = myChats().slice();
  const at = list.findIndex(c => c.code === code);
  if (at < 0) list.push({ code, name: name || '' });
  else if (name) list[at] = { code, name };
  else return;
  S.sync.rooms = list.slice(-12);
  save();
}

function forgetChat(code){
  S.sync.rooms = myChats().filter(c => c.code !== code);
  save();
}

/* move to another chat you are already in */
function switchChat(code){
  if ((code || '') === (S.sync.room || '')) return;
  if (syncOn()) fetch(roomPath('/players/' + myUid()), { method:'DELETE' }).catch(() => {});
  S.sync.room = code || '';
  save();
  syncConnect();
  renderAll();
}

/* the address to send someone so they land in here */
function appLink(code){
  const l = location;
  const base = (l.protocol === 'file:')
    ? 'https://davehollings04-cyber.github.io/Bob/'
    : (l.origin + l.pathname).replace(/index\.html$/, '');
  return base + (code && code !== LOBBY ? '#c=' + code : '');
}

/* a code out of a link, a pasted URL, or someone typing it in */
function readCode(text){
  const m = /(?:#|\?|&)c=([A-Za-z0-9]{3,12})/.exec(String(text || ''));
  const raw = m ? m[1] : String(text || '');
  return raw.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
}

/* make a chat: name it, and the code is ours to generate */
function createChat(name){
  const code = newRoomCode();
  if (syncOn()) fetch(roomPath('/players/' + myUid()), { method:'DELETE' }).catch(() => {});
  S.sync.room = code; myUid(); rememberChat(code, name); save();
  syncConnect();                                    // this clears the old room's state
  sync.meta = { name, by: S.profile.name, t: now() };
  fetch(roomPath('/meta'), { method:'PUT', body: JSON.stringify(sync.meta) }).catch(() => {});
  return code;
}

function joinChat(code){
  if (syncOn()) fetch(roomPath('/players/' + myUid()), { method:'DELETE' }).catch(() => {});
  S.sync.room = code; myUid(); rememberChat(code, ''); save();
  syncConnect();
}

const newRoomCode = () => {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 5; i++) out += a[Math.floor(Math.random() * a.length)];
  return out;
};

/* who am I, without writing to storage */
const myUidQuiet = () => (S.sync && S.sync.uid) || '';
const inRoom = () => syncOn() && sync.connected;
/* what to call the room you are in, on screen */
const roomTitle = () => inLobby() ? 'Everyone playing' : (chatName() || 'Chat ' + syncRoom());
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const roomShort = () => inLobby() ? 'everyone' : (chatName() || 'chat ' + syncRoom());

/* chat and bets, woven into one stream so the room reads like a group thread */
function roomTimeline(){
  const me = myUidQuiet();
  const out = [];
  for (const m of roomChat()) out.push({ type:'chat', t: m.t || 0, m: {
    id: m.id, user: m.name || 'Someone', realName: m.realName || '',
    avatar: m.avatar || '🙂', me: m.uid === me,
    text: m.text, kind: m.tone || 'post', amount: m.amount || 0, t: m.t || 0 } });
  for (const b of roomBets()) out.push({ type:'bet', t: b.t || 0, b:
    Object.assign({ me: b.uid === me }, b) });
  return out.sort((a, b) => a.t - b.t).slice(-140);
}

/* say something to the room (or to the local feed when playing solo) */
function sayToRoom(text, extra){
  if (!syncOn()) return false;
  const body = Object.assign({ uid: myUid(), name: S.profile.name,
                               realName: S.profile.realName || '', avatar: S.profile.avatar,
                               text, t: now() }, extra || {});
  syncPush('chat', body).then(ok => {
    if (ok) return;
    /* the room would not take it — keep the message here rather than lose it */
    addFeed({ user:S.profile.name, avatar:S.profile.avatar, me:true, text,
              kind: (extra && extra.tone) || 'post', amount: (extra && extra.amount) || 0 });
    toast('Could not reach the room — kept that here', 'bad');
    renderMain();
  });
  syncHeartbeat();
  return true;
}

/* ================================================================
   STREAK · XP · WEEKLY LEAGUE · DAILY PICK
================================================================= */
const level    = () => Math.floor(S.xp.total / XP_PER_LEVEL) + 1;
const levelPct = () => (S.xp.total % XP_PER_LEVEL) / XP_PER_LEVEL * 100;

function touchDay(){
  const today = dayKey();
  if (S.xp.day !== today){ S.xp.day = today; S.xp.today = 0; }
  if (S.xp.week !== weekKey()) rolloverWeek();

  if (S.streak.lastDay === today) return false;
  const gap = S.streak.lastDay ? daysBetween(S.streak.lastDay, today) : null;
  S.streak.count = (gap === 1) ? S.streak.count + 1 : 1;
  S.streak.best = Math.max(S.streak.best || 0, S.streak.count);
  S.streak.lastDay = today;
  if (S.streak.count > 1) setTimeout(() => toast(S.streak.count + ' day streak! 🔥', 'gold', 3500), 400);
  return true;
}

function awardXp(n, why){
  touchDay();
  S.xp.total += n;
  S.xp.today += n;
  S.xp.weekXp += n;
  const before = Math.floor((S.xp.total - n) / XP_PER_LEVEL);
  if (Math.floor(S.xp.total / XP_PER_LEVEL) > before){
    setTimeout(() => { toast('Level ' + level() + '! 🎉', 'gold', 3500); confetti(); }, 700);
  }
  const wasTier = tierIndex(S.xp.total - n);
  if (myTier() > wasTier){
    const t = TIERS[myTier()];
    setTimeout(() => { toast(t.name + ' ' + t.icon, 'gold', 4500); confetti(); }, 1100);
  }
  save();
  renderHeader();
  return n;
}

/* the streak only breaks when a day is actually missed, checked on open */
function checkStreakBreak(){
  const today = dayKey();
  if (!S.streak.lastDay || S.streak.lastDay === today) return;
  if (daysBetween(S.streak.lastDay, today) > 1 && S.streak.count > 0){
    const lost = S.streak.count;
    S.streak.count = 0;
    save();
    if (lost >= 2) setTimeout(() => toast('Your ' + lost + ' day streak ended. Start a new one today.', 'bad', 4000), 900);
  }
}

function rolloverWeek(){
  S.league.week = weekKey();
  S.xp.week = weekKey();
  S.xp.weekXp = 0;
  const t = TIERS[myTier()];
  setTimeout(() => toast('New week. Everyone back to zero XP. ' + t.icon, 'gold', 4000), 800);
  save();
}

/* The board is whoever is actually playing. Nobody is invented to fill it out. */
/* "3h ago" reads wrong for a leaderboard row, so this says it plainly */
function lastSeen(t){
  if (!t) return 'not seen yet';
  const mins = Math.floor((now() - t) / 60000);
  if (mins < 60) return 'last on ' + Math.max(1, mins) + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return 'last on ' + hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return 'last on ' + days + (days === 1 ? ' day ago' : ' days ago');
}

function leagueRows(){
  const mine = { name:S.profile.name, realName:S.profile.realName || '', avatar:S.profile.avatar,
                 me:true, xp:S.xp.weekXp, coins:Math.round(S.balance), online:true, seen:now() };
  if (!inRoom()) return [mine];

  const me = myUidQuiet();
  const rows = roomMembers().map(p => ({
    name: p.name, realName: p.realName || '', avatar: p.avatar || '🙂',
    me: p.id === me,
    xp: Number.isFinite(p.weekXp) ? p.weekXp : 0,     // the board ranks on this week
    coins: p.coins || 0, online: isOnline(p), seen: p.seen || 0 }));
  const i = rows.findIndex(r => r.me);
  if (i < 0) rows.push(mine);
  else rows[i] = Object.assign(rows[i], mine);        // your own row is always your live numbers
  rows.sort((a, b) => (b.xp - a.xp) || (b.coins - a.coins));
  return rows;
}

/* ---------------- Daily Pick: one tap, no coins at risk ---------------- */
/* the pick is always a game happening today */
function featuredGame(){
  const today = allGames().filter(g => isToday(g.startsAt) && !gIsFinal(g));
  const pre = today.filter(gIsPre).sort((a,b) => a.startsAt - b.startsAt);
  if (pre.length) return pre[0];
  const live = today.filter(gIsLive).sort((a,b) => a.startsAt - b.startsAt);
  return live[0] || null;
}

function ensurePick(){
  const today = dayKey();
  if (S.pick && S.pick.day === today){
    if (S.pick.side && S.pick.status === 'open') settlePick();
    return S.pick;
  }
  // wait for the live feed before choosing, so the pick is a real game when one exists
  if (!liveState.tried) return null;
  const g = featuredGame();
  if (!g) return null;
  S.pick = { day:today, gameId:g.id, side:null, status:'open',
             matchup:g.away.abbr + ' @ ' + g.home.abbr, src:g.src };
  if (g.src === 'live') S.liveCache[g.id] = slimGame(g);
  save();
  return S.pick;
}

function makePick(side){
  const p = S.pick;
  if (!p || p.side) return;
  const g = gameById(p.gameId);
  if (!g || gIsFinal(g)) return toast('That game already finished.', 'bad');
  p.side = side;
  S.stats.picks++;
  awardXp(XP.pick, 'Daily Pick');
  save();
  toast('Pick locked — ' + (side === 'home' ? g.home.name : g.away.name), 'good');
  renderAll();
}

function settlePick(){
  const p = S.pick;
  if (!p || !p.side || p.status !== 'open') return false;
  const g = gameById(p.gameId);
  if (!g || !gIsFinal(g)) return false;
  const F = gFinalScore(g);
  if (F.home === F.away){ p.status = 'push'; save(); return true; }
  const winner = F.home > F.away ? 'home' : 'away';
  if (p.side === winner){
    p.status = 'won';
    S.balance += 250;
    S.stats.pickWins++;
    awardXp(XP.pickWin, 'Daily Pick won');
    toast('Daily Pick hit! +250 🪙', 'good', 4000);
    notify('Daily Pick hit 🎯', 'You called ' + p.matchup + ' right. +250 coins');
    confetti();
  } else {
    p.status = 'lost';
    toast('Daily Pick missed. Back tomorrow.', 'bad');
  }
  pushHistory(); checkBadges(); save();
  return true;
}

/* ---------------- balance ---------------- */
const hasActiveBets = () => S.bets.some(b => b.status === 'active');
/* out of coins with nothing still running: done until tomorrow */
const isBroke = () => S.balance < MIN_BET && !hasActiveBets();

function msToMidnight(){
  const d = new Date();
  d.setHours(24, 0, 0, 0);
  return d.getTime() - now();
}

/* a new calendar day puts you back in with a fresh small stake */
function dailyReset(){
  const today = dayKey();
  if (S.day === today) return false;
  const wasBroke = isBroke();
  S.day = today;
  if (S.balance < START_BALANCE && !hasActiveBets()){
    S.balance = START_BALANCE;
    S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
    pushHistory();
    if (wasBroke) setTimeout(() => toast('New day — ' + fmt(START_BALANCE) + ' 🪙 to play with', 'gold', 4500), 600);
  }
  save();
  return true;
}

function buyPrize(id){
  const prize = PRIZES.find(x => x.id === id);
  if (!prize || S.shop.owned.includes(id)) return;
  if (S.balance < prize.cost) return toast('Need ' + fmt(prize.cost - S.balance) + ' more coins.', 'bad');
  confirmModal('Buy ' + prize.name + '?', 'Costs ' + fmt(prize.cost) + ' coins. It stays on your profile for good.',
    'Buy it', () => {
      S.balance -= prize.cost;
      S.shop.owned.push(id);
      pushHistory(); save();
      toast(prize.icon + ' ' + prize.name + ' unlocked!', 'good');
      confetti();
      renderAll();
    }, 'btn-primary');
}

/* ---------------- derived ---------------- */
function derived(){
  const st = S.stats;
  const settled = st.wins + st.losses;
  const active  = S.bets.filter(b => b.status === 'active');
  return {
    settled, active,
    winRate: settled ? (st.wins/settled*100) : 0,
    atRisk: active.reduce((a,b) => a + b.stake, 0),
    toWin:  active.reduce((a,b) => a + b.toWin, 0),
    roi: st.wagered ? (st.profit/st.wagered*100) : 0
  };
}

/* ---------------- badges ---------------- */
function unlockedBadges(){ return BADGES.filter(b => { try { return !!b.test(S); } catch(e){ return false; } }); }
function checkBadges(){
  for (const b of unlockedBadges()){
    if (!S.seenBadges.includes(b.id)){
      S.seenBadges.push(b.id);
      setTimeout(() => toast('Badge unlocked ' + b.icon + ' ' + b.name, 'gold', 4000), 500);
    }
  }
}

/* ---------------- feed ---------------- */
function addFeed(p){
  S.feed.unshift(Object.assign({ id:uid(), t:now(), likes: p.me ? Math.floor(Math.random()*6) : Math.floor(Math.random()*30)+3, liked:false, kind:'post', amount:0 }, p));
  if (S.feed.length > 60) S.feed.length = 60;
  save();
}

/* ---------------- notifications ---------------- */
function notify(title, body){
  if (!S.notify) return;
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    if (!document.hidden) return;                         // already looking at it
    new Notification(title, { body, tag:'spankbet', icon:undefined });
  } catch(e){ /* not supported here */ }
}

async function askNotify(){
  if (typeof Notification === 'undefined') return toast("This browser can't do notifications.", 'bad');
  if (S.notify){ S.notify = false; save(); renderMain(); return toast('Alerts off', 'gold'); }
  try {
    const res = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    if (res === 'granted'){ S.notify = true; save(); renderMain(); toast("Alerts on — I'll ping you when a bet settles", 'good'); }
    else toast('Notifications blocked in your browser settings.', 'bad');
  } catch(e){ toast("Couldn't turn on alerts here.", 'bad'); }
}

/* ---------------- theme ---------------- */
const systemDark = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
const isDark = () => S.theme === 'dark' || (S.theme === 'system' && systemDark());

function applyTheme(){
  const dark = isDark();
  document.documentElement.classList.toggle('dark', dark);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
  const m = document.createElement('meta');
  m.name = 'theme-color';
  m.content = dark ? '#121212' : '#f8f9fb';
  document.head.appendChild(m);
}

function setTheme(t){
  S.theme = t; save(); applyTheme(); renderMain();
}

/* ---------------- install to home screen ---------------- */
const hosted = () => location.protocol === 'http:' || location.protocol === 'https:';

/* Hosted, the real manifest.webmanifest and its PNG icons sit next to this file — iOS needs
   both to install properly. Opened straight from disk there is nothing to link to, so an
   inline one keeps the browser happy without changing how the app behaves. */
function installManifest(){
  try {
    if (document.querySelector('link[rel="manifest"]')) return;
    const link = document.createElement('link');
    link.rel = 'manifest';
    if (hosted()){
      link.href = 'manifest.webmanifest';
    } else {
      const m = {
        name:'Spank Betting', short_name:'SpankBet', start_url:'.', scope:'./', display:'standalone',
        background_color:'#0b0d12', theme_color:'#19b25a', orientation:'portrait',
        description:'Social sports predictions played with virtual Spank Coins. No real money.',
        icons:[{ src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2322c55e'/><text x='50' y='72' font-size='62' font-family='system-ui' font-weight='800' fill='white' text-anchor='middle'>S</text></svg>",
                 sizes:'any', type:'image/svg+xml', purpose:'any' }]
      };
      link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m));
    }
    document.head.appendChild(link);
  } catch(e){ /* not installable here, no harm */ }
}

/* The service worker is what lets an installed iOS web app receive a push at all.
   It only exists in the hosted build; from disk the app simply runs without it. */
function registerSW(){
  if (!hosted() || !('serviceWorker' in navigator)) return;
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){ /* blocked */ }
}

const standalone = () => window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);

async function doInstall(){
  if (ui.installEvt){
    ui.installEvt.prompt();
    const res = await ui.installEvt.userChoice.catch(() => null);
    ui.installEvt = null;
    renderMain();
    if (res && res.outcome === 'accepted') toast('Installed — check your home screen', 'good');
    return;
  }
  openModal(`
    <h3 class="font-extrabold text-[19px]">Add to your home screen</h3>
    <p class="text-[13.5px] text-muted mt-2 leading-relaxed">
      <b class="text-fg">iPhone:</b> tap the Share button in Safari, then <b class="text-fg">Add to Home Screen</b>.<br><br>
      <b class="text-fg">Android:</b> tap the ⋮ menu in Chrome, then <b class="text-fg">Install app</b>.
    </p>
    <p class="text-[12px] text-muted mt-3">It opens fullscreen with no browser bar, and your bets and history stay put with no signal.</p>
    <button id="mCancel" class="btn w-full mt-4 bg-surface2 py-3 text-[14px]">Got it</button>`, () => {
    $('#mCancel').onclick = closeModal;
  });
}
