const TABS = [['home','Home','🏠'],['games','Games','📺'],['feed','Feed','💬'],['league','League','🏆'],['you','You','🙂']];

/* keeps --navh in step with the real tab bar, including the safe-area inset */
function measureNav(){
  const nav = document.querySelector('nav');
  if (!nav) return;
  const h = Math.round(nav.getBoundingClientRect().height);
  if (h > 0) document.documentElement.style.setProperty('--navh', h + 'px');
}

function renderTabs(){
  $('#tabbar').innerHTML = TABS.map(([id,label,icon]) => `
    <button data-tab="${id}" class="tap flex flex-col items-center gap-0.5 py-2 ${ui.tab===id?'text-brand':'text-muted'}">
      <span class="text-[20px] leading-none ${ui.tab===id?'scale-110':''} transition-transform">${icon}</span>
      <span class="text-[10px] font-bold tracking-wide">${label}</span>
    </button>`).join('');
  $('#tabbar').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  requestAnimationFrame(measureNav);
}

function go(tab){
  if (ui.tab === tab){ ui.scrollLock = now() + 800; window.scrollTo({ top:0, behavior:'smooth' }); return; }
  ui.tab = tab;
  ui.animate = true;
  renderTabs(); renderMain(); renderSlipBar();
  ui.animate = false;
  // a chat opens at the newest message, everything else at the top
  if (tab === 'feed') requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
  else window.scrollTo(0, 0);
}

function renderHeader(pop){
  $('#streakText').textContent = S.streak.count;
  $('#xpBar').style.width = levelPct() + '%';
  const t = $('#balanceText');
  t.textContent = fmt(S.balance);
  if (pop){ t.classList.remove('coin-pop'); void t.offsetWidth; t.classList.add('coin-pop'); }
}

function renderAll(){
  ui.animate = true;
  renderTabs(); renderHeader(true); renderMain(); renderSlipBar(); renderDemoBar();
  ui.animate = false;
}

/* A cheap fingerprint of what is on screen. The 1s tick only repaints when this
   changes, so scrolling is not fighting a full re-render every second. */
function viewSignature(){
  const p = [ui.tab, ui.gamesFilter, ui.feedFilter, S.balance, S.slip.legs.length,
             S.bets.length, S.feed.length, S.xp.total, S.streak.count, S.shop.owned.length,
             liveState.at, liveState.error, weekState.at, isBroke(),
             newsState.at, newsState.items.length, JSON.stringify(sync.reacts || {}).length,
             sync.connected, Object.keys(sync.players).length, roomPlayers().length,
             Object.keys(sync.chat).length, Object.keys(sync.bets).length];
  for (const b of S.bets) if (b.status === 'active') p.push(b.id, b.status);
  for (const g of LIVE) p.push(g.id, g.state, g.score.home, g.score.away, g.clockText);
  if (S.pick) p.push(S.pick.gameId, S.pick.side, S.pick.status);
  return p.join('|');
}
let lastSig = '';
let lastScrollAt = 0;
window.addEventListener('scroll', () => { lastScrollAt = now(); }, { passive:true });

function renderMain(){
  const m = $('#main');
  const scrollY = window.scrollY;
  const animate = ui.animate;
  m.innerHTML = '';
  const view = el('div', animate ? 'view' : '');
  view.innerHTML = ({ home:viewHome, games:viewGames, feed:viewFeed, league:viewLeague, you:viewYou }[ui.tab] || viewHome)();
  m.appendChild(view);
  wireMain();
  lastSig = viewSignature();
  if (!animate && scrollY > 0 && now() > (ui.scrollLock || 0)) window.scrollTo(0, scrollY);
}

/* ---------- pieces ---------- */
/* A logo that has loaded once renders solid straight away. Without this the fade
   replayed on every repaint, which is what read as flickering. */
const loadedLogos = new Set();
window.__logoOk = url => loadedLogos.add(url);

function teamBadge(t, big){
  const size = big ? 'h-11 w-11' : 'h-9 w-9';
  const seen = t.logo && loadedLogos.has(t.logo);
  return `<div class="crest ${size} shrink-0" style="background:${esc(t.color)}">
      <span class="crest-txt text-[11px] font-extrabold text-white">${esc(t.abbr)}</span>
      ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy" class="crest-img${seen?' ok instant':''}"
          onload="this.classList.add('ok');window.__logoOk(this.src)" onerror="this.remove()" />` : ''}
    </div>`;
}

function whenChip(g){
  if (gIsLive(g)) return `<span class="inline-flex items-center gap-1.5 text-[11px] font-extrabold text-lose">
      <span class="live-dot h-1.5 w-1.5 rounded-full bg-lose"></span>${esc(gClock(g))}</span>`;
  if (gIsFinal(g)) return `<span class="text-[11px] font-bold text-muted">Final</span>`;
  return `<span class="text-[11px] font-bold text-muted">${esc(gWhen(g))}</span>`;
}

function oddsButton(g, m, small){
  const sel = hasLeg(g.id, m.key);
  return `<button data-bet="${g.id}" data-key="${m.key}"
    class="btn ${sel?'btn-sel':'bg-surface2'} flex-1 min-w-0 ${small?'py-2':'py-2.5'} px-2">
      <div class="text-[12px] font-bold truncate ${sel?'':'text-fg'}">${esc(m.label)}</div>
      <div class="text-[13px] font-extrabold tabular-nums ${sel?'':(m.odds>0?'text-brand':'text-muted')}">${fmtAmerican(m.odds)}</div>
   </button>`;
}

/* the scoreboard card: two names, two buttons, nothing else until you ask for it */
/* One market cell. Empty when that market isn't offered for this game. */
function oddCell(g, m){
  if (!m) return `<div class="oddcell empty"><span class="text-[12px] text-muted">—</span></div>`;
  const sel = hasLeg(g.id, m.key);
  const note = m.type === 'spread' ? fmtLine(m.line)
             : m.type === 'total'  ? (m.side === 'over' ? 'O ' : 'U ') + m.line
             : '';
  return `<button data-bet="${g.id}" data-key="${m.key}" class="oddcell ${sel?'sel':''}">
      ${note ? `<span class="text-[11px] font-bold ${sel?'text-brand':'text-muted'} leading-none">${esc(note)}</span>` : ''}
      <span class="text-[13.5px] font-extrabold tabular-nums leading-tight ${sel?'text-brand':''}">${fmtAmerican(m.odds)}</span>
    </button>`;
}

/* DraftKings-style matchup row: teams down the left, a spread / moneyline / total
   grid on the right with each column aligned to its team. */
/* the AP poll number, the way a broadcast writes it: #2 Georgia */
const rankChip = t => (t && t.rank && t.rank <= 25)
  ? `<span class="text-[11px] font-extrabold text-gold mr-1">#${t.rank}</span>` : '';

function gameCard(g){
  const sc = gScore(g);
  const fin = gIsFinal(g);
  const showScore = gIsLive(g) || fin;

  const rows = marketRows(g);
  const grab = (group, side) => {
    const r = rows.find(x => x.group === group);
    return r ? r.row.find(m => m.side === side) : null;
  };
  const cols = [
    { head:'Spread',    away: grab('Spread','away'),      home: grab('Spread','home') },
    { head:'Moneyline', away: grab('Winner','away'),      home: grab('Winner','home') },
    { head:'Total',     away: grab('Total Points','over'), home: grab('Total Points','under') }
  ];

  const teamRow = (t, score, winner) => `
    <div class="flex items-center gap-2 h-[48px]">
      ${teamBadge(t)}
      <div class="min-w-0 flex-1">
        <div class="font-extrabold text-[14px] truncate ${winner?'text-brand':''}">
          ${rankChip(t)}${esc(t.name)}
        </div>
        ${t.rec ? `<div class="text-[10.5px] text-muted leading-tight">${esc(t.rec)}</div>` : ''}
      </div>
      ${showScore ? `<div class="font-extrabold tabular-nums text-[18px] pr-1 ${winner?'text-brand':''}">${score}</div>` : ''}
    </div>`;

  return `
  <section class="card p-3">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[10.5px] font-extrabold text-muted uppercase tracking-wider">
        ${leagueMeta(g.league).icon} ${esc(leagueMeta(g.league).name)}${g.mlSource === 'model' ? ' · est. line' : ''}
      </span>
      ${whenChip(g)}
    </div>

    ${fin ? `
      <button data-game="${g.id}" class="tap w-full text-left space-y-1">
        ${teamRow(g.away, sc.away, sc.away > sc.home)}
        ${teamRow(g.home, sc.home, sc.home > sc.away)}
      </button>
      <div class="mt-2 text-center text-[11.5px] text-muted font-bold">Final · betting closed</div>`
    : `
      <div class="flex gap-2">
        <button data-game="${g.id}" class="tap min-w-0 flex-1 text-left space-y-1">
          ${teamRow(g.away, sc.away, false)}
          ${teamRow(g.home, sc.home, false)}
        </button>
        <div class="shrink-0 w-[186px]">
          <div class="grid grid-cols-3 gap-1.5 mb-1">
            ${cols.map(c => `<div class="text-[9px] font-extrabold text-muted uppercase tracking-wide text-center">${c.head}</div>`).join('')}
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            ${cols.map(c => oddCell(g, c.away)).join('')}
          </div>
          <div class="grid grid-cols-3 gap-1.5 mt-1.5">
            ${cols.map(c => oddCell(g, c.home)).join('')}
          </div>
        </div>
      </div>`}
  </section>`;
}

function legLine(leg, showStatus){
  const tone = leg.status === 'won' ? 'text-win' : leg.status === 'lost' ? 'text-lose' : leg.status === 'push' ? 'text-muted' : '';
  const mark = leg.status === 'won' ? '✅' : leg.status === 'lost' ? '❌' : leg.status === 'push' ? '➖' : '•';
  return `<div class="flex items-start gap-2 text-[12.5px]">
      <span class="${tone} leading-5">${showStatus ? mark : '•'}</span>
      <div class="min-w-0 flex-1">
        <div class="font-bold truncate ${tone}">${esc(leg.label)} <span class="text-muted font-semibold">${fmtAmerican(leg.odds)}</span></div>
        <div class="text-[11px] text-muted truncate">${esc(leg.sub)} · ${esc(leg.matchup)}</div>
      </div>
    </div>`;
}

function betRow(b){
  const tone  = { active:'text-gold', won:'text-win', lost:'text-lose', push:'text-muted', cashed:'text-gold' }[b.status];
  const badge = { active:'PENDING', won:'WON', lost:'LOST', push:'PUSH', cashed:'CASHED' }[b.status];
  const edge  = { active:'border-gold/40', won:'border-win/50', lost:'border-lose/40', push:'border-line', cashed:'border-gold/40' }[b.status];
  const parlay = b.legs.length > 1;
  const title = parlay ? b.legs.length + '-leg parlay' : b.legs[0].label;
  const delta = b.status === 'won' ? '+'+fmt(b.payout)
              : b.status === 'lost' ? '−'+fmt(b.stake)
              : b.status === 'push' ? '±0'
              : b.status === 'cashed' ? '+'+fmt(b.cashValue)
              : fmt(b.stake);

  let sub = '', anyLive = false;
  if (b.status === 'active'){
    const parts = [];
    for (const l of b.legs){
      const g = gameById(l.gameId);
      if (!g){ parts.push('waiting on result'); continue; }
      if (gIsLive(g)){ anyLive = true; const s = gScore(g); parts.push(`${g.away.abbr} ${s.away}–${s.home} ${g.home.abbr} · ${gClock(g)}`); }
      else if (gIsPre(g)) parts.push(gWhen(g));
      else parts.push('settling…');
    }
    sub = `<span class="${anyLive ? 'text-lose font-bold' : 'text-muted'}">${esc(parts.slice(0,2).join('  ·  '))}</span>`;
  } else {
    sub = `<span class="text-muted">${timeAgo(b.settledAt || b.placedAt)}</span>`;
  }

  const graded = b.legs.some(l => l.status && l.status !== 'open');
  const cash = b.status === 'active' ? cashOutValue(b) : 0;

  return `
  <div class="card ${edge} p-3">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <span class="text-[12px]">${parlay ? '🎰' : leagueMeta(b.legs[0].league).icon}</span>
          <span class="font-extrabold text-[14px] truncate">${esc(title)}</span>
          <span class="text-[9.5px] font-extrabold tracking-wider ${tone}">${badge}</span>
        </div>
        <div class="text-[11.5px] text-muted mt-0.5">${fmtAmerican(b.odds)} · ${fmt(b.stake)} 🪙${b.status==='active' ? ' → '+fmt(b.payout) : ''}</div>
        <div class="text-[11.5px] mt-1">${sub}</div>
      </div>
      <div class="text-right shrink-0">
        <div class="font-extrabold tabular-nums ${tone} text-[16px]">${delta}</div>
      </div>
    </div>
    ${(parlay || b.status !== 'active') ? `<div class="mt-2.5 space-y-1.5 border-t-2 border-line pt-2.5">
        ${b.legs.map(l => legLine(l, b.status !== 'active' || graded)).join('')}</div>` : ''}
    ${(b.status === 'active' && cash > 0) ? `
      <button data-cash="${b.id}" class="btn w-full mt-2.5 bg-surface2 py-2 text-[12.5px] text-gold">
        Cash out ${fmt(cash)} 🪙 <span class="text-muted font-bold">${cash >= b.stake ? '+'+fmt(cash-b.stake) : '−'+fmt(b.stake-cash)}</span>
      </button>` : ''}
  </div>`;
}

function empty(icon, title, sub, cta){
  return `<div class="card p-7 text-center">
    <div class="text-4xl mb-2">${icon}</div>
    <div class="font-extrabold text-[15px]">${esc(title)}</div>

}

/* ---------- GAMES ---------- */
function viewGames(){
  const leagues = ['ALL', ...Object.keys(LIVE_LEAGUES)];
  const pool = allGames().filter(g => ui.gamesFilter === 'ALL' || g.league === ui.gamesFilter);

  /* Newest first, always: games that just tipped off sit at the very top, then the
     rest of today by kickoff, then the coming days, with finals last. */
  const live = pool.filter(gIsLive).sort((a,b) => b.startsAt - a.startsAt);
  const upcoming = pool.filter(gIsPre).sort((a,b) => a.startsAt - b.startsAt);
  const done = pool.filter(gIsFinal).sort((a,b) => b.startsAt - a.startsAt);

  const byDay = [];
  const bucket = (g, label) => {
    let grp = byDay.find(x => x.label === label);
    if (!grp){ grp = { label, games:[] }; byDay.push(grp); }
    grp.games.push(g);
  };
  for (const g of upcoming) bucket(g, gDayLabel(g.startsAt));
  for (const g of done) bucket(g, 'Final · ' + gDayLabel(g.startsAt));

  const status = liveState.loading && !LIVE.length ? 'Loading games…'
    : liveState.error ? 'Live feed unreachable — check your connection.'
    : weekState.loading ? 'Loading the rest of the week…'
    : LIVE.length + ' games · updated ' + timeAgo(liveState.at);

  return `
  <div class="space-y-3">
    <div class="flex items-center justify-between px-1">
      <h1 class="font-extrabold text-[22px]">Games</h1>
      <button id="helpBtn" class="tap text-[12px] font-extrabold text-brand">How betting works</button>
    </div>
    <p class="text-center text-[11.5px] text-muted">${esc(status)}</p>

    <div class="no-scrollbar -mx-4 px-4 flex gap-2 overflow-x-auto pb-1">
      ${leagues.map(l => `
        <button data-league="${l}" class="btn shrink-0 px-3.5 py-1.5 text-[12px] ${ui.gamesFilter===l ? 'btn-primary' : 'bg-surface2'}">
          ${l==='ALL' ? 'All' : leagueMeta(l).icon + ' ' + leagueMeta(l).name}
        </button>`).join('')}
    </div>

    ${live.length ? `
      <h2 class="font-extrabold text-[12px] text-lose uppercase tracking-wider px-1 pt-1">
        <span class="live-dot inline-block h-1.5 w-1.5 rounded-full bg-lose mr-1"></span>Live now
      </h2>
      <div class="space-y-2.5">${live.map(gameCard).join('')}</div>` : ''}

    ${byDay.map(grp => `
      <h2 class="font-extrabold text-[12px] text-muted uppercase tracking-wider px-1 pt-1">${esc(grp.label)}</h2>
      <div class="space-y-2.5">${grp.games.map(gameCard).join('')}</div>`).join('')}

    ${!pool.length ? empty('🌙','No games here',
        liveState.error ? 'Check your connection and try again.' : 'Nothing scheduled for this league right now.') : ''}

    <p class="text-center text-[11px] text-muted pt-1 pb-4">Real games and odds. Spank Coins are play money with no cash value.</p>
  </div>`;
}

/* ================================================================
   REACTIONS  —  hold a message, pick one, everyone sees it
================================================================= */
const REACTS = ['❤️','👍','👎','😂','‼️','❓'];

/* room reactions live at reacts/<messageId>/<uid>; a solo feed keeps its own */
function reactMap(m){
  if (inRoom()) return (sync.reacts && sync.reacts[m.id]) || {};
  const local = S.feed.find(x => x.id === m.id);
  return (local && local.reacts) || {};
}

/* one pill per emoji, with a count once more than one person picks it */
function reactPills(m){
  const map = reactMap(m);
  const me = inRoom() ? myUidQuiet() : 'me';
  const by = {};
  for (const [who, emoji] of Object.entries(map)){
    if (!emoji) continue;
    by[emoji] = by[emoji] || { emoji, count:0, mine:false };
    by[emoji].count++;
    if (who === me) by[emoji].mine = true;
  }
  return Object.values(by);
}

function toggleReact(msgId, emoji){
  const me = inRoom() ? myUid() : 'me';
  if (inRoom()){
    const had = ((sync.reacts || {})[msgId] || {})[me];
    const path = syncUrl() + '/rooms/' + encodeURIComponent(syncRoom()) +
                 '/reacts/' + encodeURIComponent(msgId) + '/' + me + '.json';
    sync.reacts = sync.reacts || {};
    sync.reacts[msgId] = Object.assign({}, sync.reacts[msgId]);
    if (had === emoji){ delete sync.reacts[msgId][me]; fetch(path, { method:'DELETE' }).catch(() => {}); }
    else { sync.reacts[msgId][me] = emoji; fetch(path, { method:'PUT', body: JSON.stringify(emoji) }).catch(() => {}); }
  } else {
    const local = S.feed.find(x => x.id === msgId);
    if (!local) return;
    local.reacts = Object.assign({}, local.reacts);
    if (local.reacts.me === emoji) delete local.reacts.me;
    else local.reacts.me = emoji;
    save();
  }
  renderMain();
}

/* the little row of faces, floated next to the message you held */
/* The chat repaints on a tick, so the bubble under the thumb can be swapped out
   between the press starting and the hold completing. A detached node measures as
   all zeros, which pinned the picker to the corner — so look the message up again
   at the last moment, and fall back to where the finger actually is. */
function openReactPicker(msgId, where){
  const root = $('#reactRoot');
  const live = document.querySelector('[data-msg="' + (window.CSS && CSS.escape ? CSS.escape(msgId) : msgId) + '"]');
  let r = live ? live.getBoundingClientRect() : null;
  if (!r || (!r.width && !r.height)){
    const x = (where && where.x) || window.innerWidth / 2;
    const y = (where && where.y) || window.innerHeight / 2;
    r = { left:x, right:x, top:y, bottom:y, width:0, height:0 };
  }
  const mine = reactPills({ id: msgId }).find(x => x.mine);

  root.innerHTML = `
    <div class="absolute inset-0"></div>
    <div id="reactBar" class="absolute rounded-full bg-surface border-2 border-line shadow-lg px-1.5 py-1 flex gap-0.5">
      ${REACTS.map(e => `<button data-react="${e}" class="tap h-10 w-10 rounded-full grid place-items-center text-[21px] ${
        mine && mine.emoji === e ? 'bg-brand/20' : ''}">${e}</button>`).join('')}
    </div>`;
  root.classList.remove('hidden');

  const bar = $('#reactBar');
  const w = bar.offsetWidth || 260, h = bar.offsetHeight || 46;
  let left = r.left + r.width / 2 - w / 2;
  left = clamp(left, 8, Math.max(8, window.innerWidth - w - 8));
  let top = r.top - h - 8;
  if (top < 76) top = r.bottom + 8;
  top = clamp(top, 76, Math.max(76, window.innerHeight - h - 12));
  bar.style.left = left + 'px';
  bar.style.top  = top + 'px';

  root.querySelector('.absolute').onclick = closeReactPicker;
  window.addEventListener('scroll', closeReactPicker, { once:true, passive:true });
  bar.querySelectorAll('[data-react]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    closeReactPicker();
    toggleReact(msgId, b.dataset.react);
  });
}
function closeReactPicker(){ const r = $('#reactRoot'); r.classList.add('hidden'); r.innerHTML = ''; }

/* hold to open it — and a right-click does the same on a desktop */
function wireHold(node, msgId){
  let timer = null, moved = false, at = null;

  const mark = e => {
    const t = (e.touches && e.touches[0]) || e;
    if (t && typeof t.clientX === 'number') at = { x:t.clientX, y:t.clientY };
  };
  const start = e => {
    mark(e); moved = false; clearTimeout(timer);
    const where = at;
    timer = setTimeout(() => {
      if (moved) return;
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch(err){} }
      openReactPicker(msgId, where);
    }, 450);
  };
  const stop = () => clearTimeout(timer);

  node.addEventListener('touchstart', start, { passive:true });
  node.addEventListener('touchmove', () => { moved = true; stop(); }, { passive:true });
  node.addEventListener('touchend', stop);
  node.addEventListener('touchcancel', stop);
  node.addEventListener('mousedown', start);
  node.addEventListener('mouseup', stop);
  node.addEventListener('mouseleave', stop);
  node.addEventListener('contextmenu', e => { e.preventDefault(); mark(e); stop(); openReactPicker(msgId, at); });
}

const miniStat = (icon, value, label) => `

const tinyStat = (label, value) => `

function sparkline(){
  const pts = S.history.slice(-40);
  if (pts.length < 2) return `<div class="h-24 grid place-items-center text-[12.5px] text-muted">Place a few bets to build your chart.</div>`;
  const vals = pts.map(p => p.balance);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 1;
  const W = 300, H = 90;
  const xy = vals.map((v,i) => [ (i/(vals.length-1))*W, H - ((v-min)/span)*(H-10) - 5 ]);
  const line = xy.map(([x,y],i) => (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)).join(' ');
  const up = vals[vals.length-1] >= vals[0];
  const c = up ? 'rgb(var(--win))' : 'rgb(var(--lose))';
  return `
  <svg viewBox="0 0 ${W} ${H}" class="w-full h-24" preserveAspectRatio="none">
    <path d="${line} L ${W} ${H} L 0 ${H} Z" fill="${c}" opacity=".13"/>
    <path d="${line}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${xy[xy.length-1][0].toFixed(1)}" cy="${xy[xy.length-1][1].toFixed(1)}" r="4" fill="${c}"/>
  </svg>
  <div class="flex justify-between text-[10px] text-muted mt-1">
    <span>low ${fmt(min)}</span><span>balance over time</span><span>high ${fmt(max)}</span>
  </div>`;
}

/* ---------- wiring ---------- */
function wireMain(){
  const m = $('#main');
  m.querySelectorAll('[data-bet]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleLeg(b.dataset.bet, b.dataset.key); });
  m.querySelectorAll('[data-game]').forEach(b => b.onclick = () => openGameSheet(b.dataset.game));
  m.querySelectorAll('[data-cash]').forEach(b => b.onclick = () => cashOut(b.dataset.cash));
  m.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => go(b.dataset.goto));
  m.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => makePick(b.dataset.pick));
  m.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => setTheme(b.dataset.theme));
  m.querySelectorAll('[data-league]').forEach(b => b.onclick = () => { ui.gamesFilter = b.dataset.league; renderMain(); });
  m.querySelectorAll('[data-like]').forEach(b => b.onclick = () => {
    const p = S.feed.find(x => x.id === b.dataset.like); if (!p) return;
    p.liked = !p.liked; p.likes += p.liked ? 1 : -1; save(); renderMain();
  });

  const byId = (id, fn) => { const n = $('#'+id); if (n) n.onclick = fn; };
  byId('helpBtn', helpSheet);
  byId('demoBtn', () => DEMO ? demoExit() : demoEnter());
  byId('helpBtn2', helpSheet);
  m.querySelectorAll('[data-prize]').forEach(b => b.onclick = () => buyPrize(b.dataset.prize));
  byId('editName', nameModal);
  byId('editAvatar', avatarModal);
  byId('brag', bragModal);
  m.querySelectorAll('[data-friends]').forEach(b => b.onclick = () => friendsModal());
  m.querySelectorAll('[data-chat]').forEach(b => b.onclick = () => switchChat(b.dataset.chat));
  m.querySelectorAll('[data-msg]').forEach(b => { if (b.dataset.msg) wireHold(b, b.dataset.msg); });
  m.querySelectorAll('[data-unreact]').forEach(b => b.onclick = () => {
    const [id, emoji] = b.dataset.unreact.split('|');
    toggleReact(id, emoji);
  });
  byId('notifyBtn', askNotify);
  byId('tourBtn', () => startOnboard(true));
  byId('installBtn', doInstall);

  // real games only publish a moneyline per event — pull it for what's on screen
  if (ui.tab === 'games' || ui.tab === 'home'){
    const ids = [...m.querySelectorAll('[data-game]')].map(n => n.dataset.game).slice(0, 6);
    for (const id of new Set(ids)){
      const g = gameById(id);
      if (g && g.src === 'live' && !g.mlReal) upgradeOdds(g);
    }
  }
}

function closeSheet(){
  const panel = $('#sheetPanel'), root = $('#sheetRoot');

    panel.classList.add('sheet-out');
    const bd = $('#sheetBackdrop'); if (bd) bd.style.opacity = '0';
    setTimeout(() => { root.classList.add('hidden'); root.innerHTML = ''; }, 240);

}

  const body = ui.sheet.kind === 'slip' ? slipSheetHTML()
             : ui.sheet.kind === 'help' ? helpSheetHTML()
             : gameSheetHTML(ui.sheet.gameId);
  if (body == null){ closeSheet(); return; }

  root.classList.remove('hidden');
  root.innerHTML = `
    <div id="sheetBackdrop" class="absolute inset-0 bg-black/50 transition-opacity duration-300"></div>
    <div id="sheetPanel" class="sheet-in absolute bottom-0 inset-x-0 mx-auto max-w-[520px] max-h-[88vh] overflow-y-auto no-scrollbar rounded-t-[24px] border-t-2 border-x-2 border-line bg-bg safe-b">

function wireSheet(){
  const root = $('#sheetRoot');
  root.querySelectorAll('[data-bet]').forEach(b => b.onclick = () => {
    toggleLeg(b.dataset.bet, b.dataset.key);
    if (ui.sheet && ui.sheet.kind === 'game') renderSheet();
  });
  root.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
    const [gameId, key] = b.dataset.drop.split('|');
    S.slip.legs = S.slip.legs.filter(l => !(l.gameId === gameId && l.key === key));
    save();
    if (!legCount()) closeSheet(); else renderSheet();
    renderAll();
  });
  root.querySelectorAll('[data-stake]').forEach(b => b.onclick = () => {
    const v = b.dataset.stake;
    S.slip.stake = v === 'max' ? Math.floor(S.balance) : clamp(Number(v), 0, Math.floor(S.balance));
    save(); renderSheet();
  });

  const byId = (id, fn) => { const n = $('#'+id); if (n) n.onclick = fn; };
  byId('addMore', () => { closeSheet(); go('games'); });
  byId('confirmBet', placeBet);

  const input = $('#stakeInput');
  if (input){
    input.oninput = () => {
      /* The field is what you are betting, so it must not read -50 or 1.5 while
         the slip quietly wagers 50 or 1. Put the number that will actually be
         staked back in the box. */
      const digits = input.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
      if (digits !== input.value) input.value = digits;
      const v = parseInt(digits, 10);
      S.slip.stake = Number.isFinite(v) ? v : 0;
      updateSlipNumbers();
    };
    input.onkeydown = e => {
      if (e.key !== 'Enter') return;
      input.blur();
      const v = Math.floor(S.slip.stake || 0);
      if (v >= MIN_BET && v <= S.balance) placeBet();
    };
  }
}

function updateSlipNumbers(){
  if (!ui.sheet || ui.sheet.kind !== 'slip') return;
  const mult = slipMult();
  const stake = clamp(Math.floor(S.slip.stake||0), 0, 1e9);
  const payout = cappedPayout(stake, mult);
  const bad = stake < MIN_BET || stake > S.balance;

  const pay = $('#slipPayout'); if (pay) pay.textContent = fmt(payout) + ' 🪙';
  const warn = $('#slipWarn');
  if (warn) warn.textContent = stake > S.balance ? 'Only ' + fmt(S.balance) + ' coins available.'
    : (stake && stake < MIN_BET) ? 'Minimum bet is ' + MIN_BET + '.' : '';
  const btn = $('#confirmBet');
  if (btn){
    btn.disabled = bad;
    btn.textContent = bad ? 'Enter a wager' : 'Place bet · ' + fmt(stake) + ' 🪙';
    btn.className = 'btn ' + (bad ? 'bg-surface2 text-muted' : 'btn-primary') + ' w-full mt-2 py-4 text-[16px]';
  }
}

/* patches the live line in an open game sheet instead of rebuilding under the user's finger */
function refreshSheetLive(){
  if (!ui.sheet || ui.sheet.kind !== 'game') return;
  const g = gameById(ui.sheet.gameId);
  if (!g) return closeSheet();
  const n = $('#sheetLive');
  if (!n) return;
  if (gIsFinal(g)){ renderSheet(); return; }
  const sc = gScore(g);
  n.innerHTML = gIsLive(g)
    ? `<span class="text-lose font-extrabold">${esc(g.away.abbr)} ${sc.away}–${sc.home} ${esc(g.home.abbr)} · ${esc(gClock(g))}</span>`
    : `<span class="text-muted font-bold">${esc(gWhen(g))}</span>`;
}

function wireCopy(){
  const btn = $('#fCopy'), field = $('#fLink');
  if (!btn || !field) return;
  btn.onclick = () => {
    field.select(); field.setSelectionRange(0, 9999);
    const done = () => toast('Link copied — send it to anyone', 'good');
    if (navigator.clipboard) navigator.clipboard.writeText(field.value).then(done, () => { document.execCommand('copy'); done(); });
    else { document.execCommand('copy'); done(); }
  };
}

          ${picks.map(a => `<button data-ob-av="${a}" class="btn aspect-square grid place-items-center text-[26px] ${ui.draftAvatar===a?'btn-sel':'bg-surface2'}">${a}</button>`).join('')}
        </div>
      </div>

      <div class="mt-5">
        <label class="text-[11px] uppercase tracking-wider text-muted font-extrabold">Username</label>
        <input id="obName" maxlength="18" value="${esc(ui.draftName)}" placeholder="Rookie" autocomplete="off"
          class="mt-2 w-full rounded-2xl bg-surface2 border-2 border-line px-4 py-3.5 font-extrabold text-[17px] outline-none focus:border-brand" />
      </div>

      <div class="mt-4">
        <label class="text-[11px] uppercase tracking-wider text-muted font-extrabold">Your real name</label>
        <input id="obReal" maxlength="24" value="${esc(ui.draftReal)}" placeholder="So people know who you are" autocomplete="off"
          class="mt-2 w-full rounded-2xl bg-surface2 border-2 border-line px-4 py-3.5 font-bold text-[15px] outline-none focus:border-brand" />
        <p class="text-[11.5px] text-muted mt-1.5">Shows under your username everywhere you turn up.</p>
      </div>

      <div class="flex-1"></div>
      <button id="obNext" ${obReady() ? '' : 'disabled'} class="btn w-full mt-7 py-4 text-[16px] ${obReady() ? 'btn-primary' : 'bg-surface2 text-muted'}">Continue</button>
      <p class="text-center text-[11px] text-muted mt-3">No signup, no email, no real money — ever.</p>
    </div>
  </div>`;
}

function onboardTourHTML(){
  const i = ui.onboard.step - 1;
  const t = TOUR[i];
  const last = i === TOUR.length - 1;
  return `
  <div class="absolute inset-0 bg-bg overflow-y-auto no-scrollbar">
    <div class="mx-auto max-w-[520px] min-h-full px-5 pt-5 pb-8 flex flex-col safe-t safe-b">
      <div class="flex items-center gap-2">
        ${TOUR.map((_,n) => `<div class="h-2 flex-1 rounded-full ${n <= i ? 'bg-brand' : 'bg-surface2'}"></div>`).join('')}
        <button id="obSkip" class="tap text-[12px] font-bold text-muted pl-2">Skip</button>
      </div>

      <div class="flex-1 flex flex-col justify-center py-8">
        <div class="text-center">
          <div class="text-[58px] leading-none">${t.icon}</div>

          <p class="text-[14.5px] text-muted mt-2 leading-relaxed px-2">${esc(t.body)}</p>
        </div>
        ${t.demo === 'bet' ? onboardDemo() : ''}
      </div>

      <button id="obNext" class="btn btn-primary w-full py-4 text-[16px]">
        ${last ? 'Start betting' : (t.demo === 'bet' && !ui.onboard.tapped ? 'Try it above' : 'Next')}
      </button>
    </div>
  </div>`;
}

/* a fake card you actually tap, so the first real one needs no explaining */

  const tapped = ui.onboard.tapped;
  return `
  <section class="card p-3.5 mt-7">
    <div class="flex items-center justify-between mb-2.5">
      <span class="text-[11px] font-extrabold text-muted uppercase tracking-wider">🏀 NBA</span>
      <span class="inline-flex items-center gap-1.5 text-[11px] font-extrabold text-lose">
        <span class="live-dot h-1.5 w-1.5 rounded-full bg-lose"></span>Q3 6:21</span>
    </div>
    <div class="space-y-2">
      <div class="flex items-center gap-2.5">
        <div class="crest h-9 w-9 shrink-0" style="background:#1d428a"><span class="crest-txt text-[11px] font-extrabold text-white">GSW</span></div>
        <div class="min-w-0 flex-1"><div class="font-extrabold text-[15px]">Warriors</div><div class="text-[11px] text-muted">8-5</div></div>
        <div class="font-extrabold tabular-nums text-[20px]">88</div>
      </div>
      <div class="flex items-center gap-2.5">
        <div class="crest h-9 w-9 shrink-0" style="background:#98002e"><span class="crest-txt text-[11px] font-extrabold text-white">MIA</span></div>
        <div class="min-w-0 flex-1"><div class="font-extrabold text-[15px]">Heat</div><div class="text-[11px] text-muted">6-6</div></div>
        <div class="font-extrabold tabular-nums text-[20px]">84</div>
      </div>
    </div>
    <div class="mt-3 flex gap-2">
      <button data-ob-demo="GSW" class="btn ${tapped==='GSW'?'btn-sel':'bg-surface2'} flex-1 py-2.5">
        <div class="text-[12px] font-bold">GSW</div><div class="text-[13px] font-extrabold tabular-nums">-160</div>
      </button>
      <button data-ob-demo="MIA" class="btn ${tapped==='MIA'?'btn-sel':'bg-surface2'} flex-1 py-2.5">
        <div class="text-[12px] font-bold">MIA</div><div class="text-[13px] font-extrabold tabular-nums text-brand">+140</div>
      </button>
    </div>
    <p class="text-center text-[11.5px] mt-2.5 ${tapped?'text-brand font-extrabold':'text-muted'}">
      ${tapped === 'MIA' ? 'Nice — +140 means 100 coins wins you 140.'
        : tapped === 'GSW' ? 'Nice — −160 means you risk 160 to win 100.'
        : 'Go on, tap one 👆'}

/* both names, or you do not get in — a board of usernames with nobody behind
   them is exactly what this app is not for */
const obReady = () => (ui.draftName || '').trim().length >= 2 && (ui.draftReal || '').trim().length >= 2;

function refreshObNext(){
  const b = $('#obNext');
  if (!b || !ui.onboard || ui.onboard.step !== 0) return;
  const ok = obReady();
  b.disabled = !ok;
  b.classList.toggle('btn-primary', ok);
  b.classList.toggle('bg-surface2', !ok);
  b.classList.toggle('text-muted', !ok);
}

function wireOnboard(){
  const root = $('#onboardRoot');

  const stash = () => {
    const n = $('#obName'), r = $('#obReal');
    if (n) ui.draftName = n.value;
    if (r) ui.draftReal = r.value;
  };
  root.querySelectorAll('[data-ob-av]').forEach(b => b.onclick = () => {
    stash();
    ui.draftAvatar = b.dataset.obAv;
    renderOnboard();
  });

  root.querySelectorAll('[data-ob-demo]').forEach(b => b.onclick = () => {
    ui.onboard.tapped = b.dataset.obDemo;
    renderOnboard();
  });

  const input = $('#obName');
  const realIn = $('#obReal');
  if (input) input.oninput = () => { ui.draftName = input.value; refreshObNext(); };
  if (realIn) realIn.oninput = () => { ui.draftReal = realIn.value; refreshObNext(); };
  refreshObNext();
  if (realIn) realIn.onkeydown = e => { if (e.key === 'Enter'){ realIn.blur(); next(); } };
  if (input) input.onkeydown = e => { if (e.key === 'Enter'){ input.blur(); if (realIn) realIn.focus(); } };

  function next(){
    if (ui.onboard.step === 0){
      stash();
      if (!obReady()){
        const missing = (ui.draftName || '').trim().length < 2 ? input : realIn;
        toast((ui.draftName || '').trim().length < 2 ? 'Pick a username first' : 'Add your real name too', 'bad');
        if (missing) missing.focus();
        refreshObNext();
        return;
      }
    }
    if (ui.onboard.step >= TOUR.length) finishOnboard();
    else onboardStep(ui.onboard.step + 1);
  }
  const nextBtn = $('#obNext'); if (nextBtn) nextBtn.onclick = next;
  const skip = $('#obSkip'); if (skip) skip.onclick = finishOnboard;
}

/* ---------------- toasts + confetti ---------------- */
function toast(msg, kind='good', ms=3000){
  const root = $('#toastRoot');
  const tone = kind === 'good' ? 'border-brand text-brand' : kind === 'bad' ? 'border-lose text-lose' : 'border-gold text-gold';
  const n = el('div', `toast-in pointer-events-auto rounded-2xl border-2 ${tone} bg-surface px-4 py-2.5 text-[13px] font-extrabold shadow-lg max-w-[92%] text-center`, esc(msg));
  root.appendChild(n);
  setTimeout(() => { n.classList.add('toast-out'); setTimeout(() => n.remove(), 280); }, ms);
  while (root.children.length > 3) root.firstChild.remove();
}

function confetti(){
  const colors = ['#22c55e','#f59e0b','#8b5cf6','#ef4444','#38bdf8'];
  for (let i=0;i<26;i++){
    const b = el('div','confetti-bit');
    b.style.left = (Math.random()*100) + 'vw';
    b.style.background = colors[i % colors.length];
    b.style.setProperty('--dx', (Math.random()*120-60)+'px');
    b.style.setProperty('--rot', (Math.random()*900-450)+'deg');
    b.style.animationDuration = (1.5 + Math.random()*1.3)+'s';
    b.style.animationDelay = (Math.random()*.25)+'s';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 3200);
  }
}

/* ---------------- loop ---------------- */
let tickN = 0;
function tick(){
  tickN++;
  const settled = settleBets();
  const picked = settlePick();
  const chatter = false;
  if (tickN % 30 === 0) dailyReset();
  const rotated = false;

  if (tickN % 5 === 0) refreshLive().then(changed => { if (changed) afterLive(); });
  if (tickN % 120 === 0) fillWeek();
  if (tickN % 20 === 0) settleStaleLive().then(changed => { if (changed) afterLive(); });

  const before = legCount();
  S.slip.legs = S.slip.legs.filter(l => { const g = gameById(l.gameId); return g && !gIsFinal(g); });
  const dropped = before !== legCount();
  if (dropped){
    save();
    toast(legCount() ? 'A leg went final and left your slip.' : 'Your slip cleared — those games are final.', 'bad');
    if (ui.sheet && ui.sheet.kind === 'slip' && !legCount()) closeSheet();
  }

  if (S.balance !== ui.lastBalance){ ui.lastBalance = S.balance; renderHeader(true); }

  const ae = document.activeElement;
  const typing = !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  const modalOpen = !$('#modalRoot').classList.contains('hidden');
  if (ui.onboard) return;                       // first-run flow owns the screen
  const scrolling = now() - lastScrollAt < 400;
  const changed = viewSignature() !== lastSig;
  if (!typing && !modalOpen && !scrolling && (changed || settled || picked || dropped)){
    renderMain(); renderSlipBar();
  }
  if (!typing) refreshSheetLive();
  if (settled || picked || chatter || rotated) save();
}

function afterLive(){
  const changed = settleBets();
  settlePick();
  const ae = document.activeElement;
  const typing = !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  if (!typing){ renderMain(); renderSlipBar(); }
  if (changed) renderHeader(true);
}

/* ---------------- boot ---------------- */
function boot(){
  S = load();
  ui.lastBalance = S.balance;
  applyTheme();
  installManifest();
  registerSW();

  if (window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (S.theme === 'system'){ applyTheme(); renderMain(); } };
    mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.installEvt = e; renderMain(); });

  checkStreakBreak();
  dailyReset();
  settleBets();
  S.slip.legs = S.slip.legs.filter(l => { const g = gameById(l.gameId); return g && !gIsFinal(g); });
  S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
  save();

  renderAll();
  renderDemoBar();
  measureNav();
  window.addEventListener('resize', measureNav);
  window.addEventListener('orientationchange', () => setTimeout(measureNav, 250));
  $('#balancePill').onclick = () => go('you');
  $('#streakChip').onclick = () => go('league');

  refreshLive(true).then(() => { ensurePick(); afterLive(); fillWeek(true); });
  settleStaleLive().then(changed => { if (changed) afterLive(); });
  loadConfig().then(() => {
    if (joinFromLink()) return;          // a link with a code in it wins
    if (syncOn()) syncConnect();
  });
  refreshNews(true).then(() => renderMain());

  /* Tapping a chat link while the app is already open only changes the hash —
     the page never reloads — so the link has to be read here too. */
  window.addEventListener('hashchange', () => { if (joinFromLink()) renderAll(); });

  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    checkStreakBreak();
    dailyReset();
    refreshLive(true).then(() => afterLive());
    settleStaleLive().then(changed => { if (changed) afterLive(); });
    refreshNews().then(() => renderMain());
    if (syncOn() && !sync.connected) syncConnect(); else syncHeartbeat();
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (ui.onboard) return;
    if (!$('#reactRoot').classList.contains('hidden')) closeReactPicker();
    else if (!$('#modalRoot').classList.contains('hidden')) closeModal();
    else if (ui.sheet) closeSheet();
  });

  if (!S.onboard.done) startOnboard(false);
  /* accounts made before real names were required get asked once per open */
  else if (!(S.profile.realName || '').trim()) setTimeout(nameModal, 900);
}

boot();
})();
</script>
