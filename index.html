  } catch(e){ return baseState(); }

  try {

    const fresh = freshState();

    p.v = 3;

    p.stats   = Object.assign(freshStats(), p.stats || {});

    p.bets    = (Array.isArray(p.bets) ? p.bets : []).map(migrateBet).filter(Boolean);
    delete p.sim; delete p.games;      // the simulated slate is gone
    p.feed    = Array.isArray(p.feed) ? p.feed : fresh.feed;
    p.history = (Array.isArray(p.history) && p.history.length) ? p.history : [{ t:now(), balance:p.balance }];
    p.slip    = (p.slip && Array.isArray(p.slip.legs)) ? p.slip : { legs:[], stake:100 };
    p.day     = typeof p.day === 'string' ? p.day : dayKey();
    p.shop    = (p.shop && Array.isArray(p.shop.owned)) ? p.shop : { owned: [] };
    p.streak  = Object.assign({ count:0, best:0, lastDay:null }, p.streak || {});
    p.xp      = Object.assign({ total:0, day:null, today:0, week:weekKey(), weekXp:0 }, p.xp || {});
    p.league  = Object.assign({ tier:0, week:weekKey(), bots:[] }, p.league || {});
    if (!Array.isArray(p.league.bots) || !p.league.bots.length) p.league.bots = seedLeagueBots(p.league.tier||0);
    p.liveCache  = (p.liveCache && typeof p.liveCache === 'object') ? p.liveCache : {};
    p.onboard    = (p.onboard && typeof p.onboard === 'object') ? p.onboard : { done:true };
    p.seenBadges = Array.isArray(p.seenBadges) ? p.seenBadges : [];
    delete p.board;
    return p;
  } catch(e){ return baseState(); }
}

/* ================================================================
   LIVE SPORTS  —  ESPN public feed, no key required
================================================================= */
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/';
let LIVE = [];                   // normalised real games, memory only
let liveState = { at:0, loading:false, error:null, tried:false, fails:0 };
let weekState = { at:0, loading:false, done:false };
const oddsInFlight = new Set();

async function getJSON(url, ms=9000){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

function normalizeEspn(lg, ev){
  const L = LIVE_LEAGUES[lg];
  const c = (ev.competitions || [])[0];
  if (!c) return null;
  const comp = c.competitors || [];
  const home = comp.find(x => x.homeAway === 'home');
  const away = comp.find(x => x.homeAway === 'away');
  if (!home || !away) return null;

  const team = t => ({
    name: t.team.shortDisplayName || t.team.name || t.team.displayName,
    abbr: t.team.abbreviation || (t.team.shortDisplayName||'').slice(0,3).toUpperCase(),
    color: t.team.color ? '#'+t.team.color : '#64748b',
    logo: t.team.logo || null,
    rec: ((t.records || [])[0] || {}).summary || ''
  });

  const st = c.status || {};
  const state = (st.type || {}).state || 'pre';
  const o = (c.odds || [])[0] || null;

  const g = {
    id: 'live:' + ev.id,
    src: 'live',
    eventId: String(ev.id),
    path: L.path,
    league: lg,
    home: team(home), away: team(away),
    startsAt: Date.parse(ev.date) || now(),
    state,                                        // pre | in | post
    period: st.period || 0,
    displayClock: st.displayClock || '',
    clockText: (st.type || {}).shortDetail || '',
    score: { home: Number(home.score) || 0, away: Number(away.score) || 0 },
    spread: null, total: null, ml: null, mlReal: false,
    half: null, first: null, method: null, props: [],
    updatedAt: now()
  };

  if (o){
    if (typeof o.spread === 'number' && Math.abs(o.spread) > 0){
      g.spread = { home:o.spread, away:-o.spread, odds:-110 };   // ESPN's spread is the home line
    }
    if (typeof o.overUnder === 'number') g.total = { line:o.overUnder, odds:-110 };
    const hm = (o.homeTeamOdds || {}).moneyLine, am = (o.awayTeamOdds || {}).moneyLine;
    if (typeof hm === 'number' && typeof am === 'number'){ g.ml = { home:hm, away:am }; g.mlReal = true; }
  }
  // no published moneyline: derive one from the real spread
  if (!g.ml){
    if (g.spread){
      const pHome = spreadToProb(g.spread.home, L.sigma);
      g.ml = { home: probToAmerican(pHome + .022), away: probToAmerican(1 - pHome + .022) };
    } else {
      g.ml = { home: -120, away: +100 };
    }
  }
  return g;
}

function dayStamp(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}

/* ESPN serves one day at a time — date ranges are rejected — so a week is a day per call.
   NFL is the exception: its default scoreboard already covers the whole week's slate. */
async function fetchLeagueDay(lg, stamp){
  const L = LIVE_LEAGUES[lg];
  const url = ESPN + L.path + '/scoreboard' + (stamp ? '?dates=' + stamp : '');
  const d = await getJSON(url);
  return (d.events || []).map(ev => normalizeEspn(lg, ev)).filter(Boolean);
}

function mergeGames(list){
  const byId = new Map(LIVE.map(g => [g.id, g]));
  for (const g of list){
    const old = byId.get(g.id);
    if (old && old.mlReal && !g.mlReal){ g.ml = old.ml; g.mlReal = true; }   // keep a real price we already fetched
    byId.set(g.id, g);
  }
  LIVE = [...byId.values()].sort((a,b) => a.startsAt - b.startsAt);
  for (const g of LIVE) if (betDependsOn(g.id)) S.liveCache[g.id] = slimGame(g);
}

/* today's slate, refreshed often — this is what has to stay current */
async function refreshLive(force){
  if (liveState.loading) return false;
  const anyLive = LIVE.some(g => g.state === 'in');
  const maxAge = liveState.fails ? Math.min(60000 * Math.pow(2, liveState.fails - 1), 300000)
                                 : (anyLive ? 25000 : 120000);
  if (!force && now() - liveState.at < maxAge) return false;

  liveState.loading = true;
  try {
    const today = dayStamp(0);
    const lists = await Promise.all(Object.keys(LIVE_LEAGUES).map(lg =>
      fetchLeagueDay(lg, lg === 'NFL' ? null : today).catch(() => null)));
    if (!lists.some(Boolean)) throw new Error('all leagues failed');
    mergeGames(lists.filter(Boolean).flat());
    liveState.error = null;
    liveState.fails = 0;
  } catch(e){
    liveState.error = e && e.message ? e.message : 'offline';
    liveState.fails = Math.min(liveState.fails + 1, 5);
  } finally {
    liveState.loading = false;
    liveState.at = now();
    liveState.tried = true;
  }
  return true;
}

/* the rest of the week, filled in behind today's slate so the board is usable immediately */
async function fillWeek(force){
  if (weekState.loading) return false;
  if (!force && now() - weekState.at < 10*60*1000) return false;
  weekState.loading = true;
  try {
    const days = [];
    for (let d = -WEEK_BACK; d <= WEEK_AHEAD; d++) if (d !== 0) days.push(dayStamp(d));
    const leagues = Object.keys(LIVE_LEAGUES).filter(lg => lg !== 'NFL');   // NFL's default already spans its week

    for (const stamp of days){
      const lists = await Promise.all(leagues.map(lg => fetchLeagueDay(lg, stamp).catch(() => null)));
      const got = lists.filter(Boolean).flat();
      if (got.length){ mergeGames(got); afterLive(); }
    }
    weekState.at = now();
    weekState.done = true;
  } catch(e){ /* partial weeks are fine — whatever arrived is on the board */ }
  finally { weekState.loading = false; }
  return true;
}

const slimGame = g => ({ id:g.id, src:'live', eventId:g.eventId, path:g.path, league:g.league,
  home:g.home, away:g.away, startsAt:g.startsAt, state:g.state, period:g.period,
  displayClock:g.displayClock, clockText:g.clockText, score:g.score,
  spread:g.spread, total:g.total, ml:g.ml, mlReal:g.mlReal,
  half:null, first:null, method:null, props:[], updatedAt:now() });

const betDependsOn = gameId => S.bets.some(b => b.status === 'active' && b.legs.some(l => l.gameId === gameId));

/* pulls a real sportsbook moneyline for one game (ESPN only publishes it per-event) */
async function upgradeOdds(g){
  if (!g || g.src !== 'live' || g.mlReal || oddsInFlight.has(g.id)) return;
  if (g.state === 'post') return;
  oddsInFlight.add(g.id);
  try {
    const d = await getJSON(ESPN + g.path + '/summary?event=' + g.eventId, 8000);
    const pc = (d.pickcenter || [])[0];
    const hm = pc && (pc.homeTeamOdds || {}).moneyLine;
    const am = pc && (pc.awayTeamOdds || {}).moneyLine;
    if (typeof hm === 'number' && typeof am === 'number'){
      g.ml = { home:hm, away:am };
      g.mlReal = true;
      if (pc.overUnder && !g.total) g.total = { line:pc.overUnder, odds:-110 };
      if (betDependsOn(g.id)) S.liveCache[g.id] = slimGame(g);
      renderMain();
    }
  } catch(e){ /* keep the derived line */ }
  finally { oddsInFlight.delete(g.id); }
}

/* a real game a ticket is riding on may have dropped off today's board — settle it by event id */
async function settleStaleLive(){
  const pending = new Set();
  for (const b of S.bets){
    if (b.status !== 'active') continue;
    for (const l of b.legs){
      if (l.src !== 'live' || (l.status && l.status !== 'open')) continue;
      if (LIVE.some(g => g.id === l.gameId)) continue;
      pending.add(l.gameId);
    }
  }
  if (!pending.size) return false;
  let changed = false;
  for (const id of [...pending].slice(0, 6)){
    const snap = S.liveCache[id];
    if (!snap || oddsInFlight.has('settle:'+id)) continue;
    oddsInFlight.add('settle:'+id);
    try {
      const d = await getJSON(ESPN + snap.path + '/summary?event=' + snap.eventId, 8000);
      const c = ((d.header || {}).competitions || [])[0];
      if (!c) continue;
      const st = ((c.status || {}).type || {});
      const comp = c.competitors || [];
      const h = comp.find(x => x.homeAway === 'home'), a = comp.find(x => x.homeAway === 'away');
      if (!h || !a) continue;
      snap.state = st.state || snap.state;
      snap.clockText = st.shortDetail || snap.clockText;
      snap.period = (c.status || {}).period || snap.period;
      snap.displayClock = (c.status || {}).displayClock || snap.displayClock;
      snap.score = { home:Number(h.score)||0, away:Number(a.score)||0 };
      S.liveCache[id] = snap;
      changed = true;
    } catch(e){ /* try again next pass */ }
    finally { oddsInFlight.delete('settle:'+id); }
  }
  if (changed) save();
  return changed;
}

/* every game the app knows about, real and simulated */
function allGames(){
  const out = LIVE.slice();
  const have = new Set(out.map(g => g.id));
  for (const id of Object.keys(S.liveCache)){
    if (!have.has(id) && betDependsOn(id)) out.push(S.liveCache[id]);
  }
  return out;
}
const gameById = id => allGames().find(g => g.id === id) || null;

/* ================================================================
   UNIFIED GAME VIEW  —  the rest of the app never asks which kind it is
================================================================= */
function gProgress(g){
  if (!g) return 0;
  if (g.state === 'pre') return 0;
  if (g.state === 'post') return 1;
  const L = leagueMeta(g.league);
  const per = clamp(g.period || 1, 1, L.periods);
  if (g.league === 'MLB') return clamp((per - .5) / 9, .02, .98);
  const parts = String(g.displayClock || '').split(':');
  const left = parts.length === 2 ? (Number(parts[0]) + Number(parts[1])/60) : L.periodMin/2;
  const within = L.periodMin ? clamp(1 - left/L.periodMin, 0, 1) : .5;
  return clamp(((per - 1) + within) / L.periods, .02, .98);
}
const gIsLive  = g => !!g && g.state === 'in';
const gIsFinal = g => !!g && g.state === 'post';
const gIsPre   = g => !!g && g.state === 'pre';
const gScore = g => g.score;
const gFinalScore = g => g.score;

const gClock = g => g.clockText || (g.state === 'post' ? 'Final' : '');

/* month and day, never a year */
function gDayLabel(t){
  const d = new Date(t), today = new Date();
  const tmr = new Date(today); tmr.setDate(tmr.getDate()+1);
  const yst = new Date(today); yst.setDate(yst.getDate()-1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === tmr.toDateString())   return 'Tomorrow';
  if (d.toDateString() === yst.toDateString())   return 'Yesterday';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function gWhen(g){
  if (gIsLive(g)) return gClock(g);
  if (gIsFinal(g)) return 'Final';
  const ms = g.startsAt - now();
  if (ms > 0 && ms < 60*60*1000) return countdown(ms);
  const day = gDayLabel(g.startsAt);
  return (day === 'Today' ? '' : day + ' ') + clockTime(g.startsAt);
}
const isToday = t => new Date(t).toDateString() === new Date().toDateString();

/* ---------------- markets ---------------- */
function marketRows(g){
  const rows = [];
  rows.push({ group:'Winner', row:[
    { key:'ml:away', type:'ml', side:'away', label:g.away.abbr, sub:'Moneyline', odds:g.ml.away },
    { key:'ml:home', type:'ml', side:'home', label:g.home.abbr, sub:'Moneyline', odds:g.ml.home }
  ]});
  if (g.spread) rows.push({ group:'Spread', row:[
    { key:'spread:away', type:'spread', side:'away', label:g.away.abbr+' '+fmtLine(g.spread.away), sub:'Spread', odds:g.spread.odds, line:g.spread.away },
    { key:'spread:home', type:'spread', side:'home', label:g.home.abbr+' '+fmtLine(g.spread.home), sub:'Spread', odds:g.spread.odds, line:g.spread.home }
  ]});
  if (g.total) rows.push({ group:'Total Points', row:[
    { key:'total:over',  type:'total', side:'over',  label:'Over '+g.total.line,  sub:'Total', odds:g.total.odds, line:g.total.line },
    { key:'total:under', type:'total', side:'under', label:'Under '+g.total.line, sub:'Total', odds:g.total.odds, line:g.total.line }
  ]});

  const out = [];
  for (const r of rows){
    const priced = priceRow(g, r.row);
    if (priced) out.push(Object.assign({}, r, { row: priced }));
  }
  return out;
}

/* Once a game is under way the opening price is stale: re-price from the live win
   probability, and pull a market off the board once it is effectively decided. */
const LIVE_VIG = .026;
function livePrice(g, m){
  const held = S.slip.legs.find(l => l.gameId === g.id && l.key === m.key);
  if (held) return held.odds;                 // a price in your slip never moves or vanishes
  if (!gIsLive(g)) return m.odds;
  const prob = legWinProb(m, g);
  if (prob >= .97 || prob <= .03) return null;
  return probToAmerican(prob + LIVE_VIG);
}
function priceRow(g, row){
  const inSlip = row.some(m => hasLeg(g.id, m.key));
  const out = [];
  for (const m of row){
    const odds = livePrice(g, m);
    if (odds === null && !inSlip) return null;      // closed, and nothing of yours rides on it
    out.push(Object.assign({}, m, { odds: odds === null ? m.odds : odds }));
  }
  return out;
}
function findMarket(g, key){
  for (const r of marketRows(g)){
    const hit = r.row.find(m => m.key === key);
    if (hit) return hit;
  }
  return null;
}
const winnerMarkets = g => (marketRows(g).find(r => r.group === 'Winner') || { row:[] }).row;

/* ---------------- bet slip ---------------- */
const legCount = () => S.slip.legs.length;
const hasLeg = (gameId, key) => S.slip.legs.some(l => l.gameId === gameId && l.key === key);
const slipMult = () => S.slip.legs.reduce((m, l) => m * americanToMult(l.odds), 1);

function toggleLeg(gameId, key){
  if (isBroke()) return toast("You're out for today — back at midnight.", 'bad');
  const g = gameById(gameId);
  if (!g) return;
  if (gIsFinal(g)) return toast('That game is already final.', 'bad');

  const legs = S.slip.legs;
  const at = legs.findIndex(l => l.gameId === gameId && l.key === key);
  if (at >= 0){ legs.splice(at, 1); save(); renderAll(); return; }
  if (legs.length >= MAX_LEGS) return toast('Max ' + MAX_LEGS + ' legs.', 'bad');

  const m = findMarket(g, key);
  if (!m) return;

  const sameGame = legs.findIndex(l => l.gameId === gameId);
  const replaced = sameGame >= 0;
  if (replaced) legs.splice(sameGame, 1);

  legs.push({
    gameId, key, src:g.src, league:g.league,
    matchup:g.away.abbr+' @ '+g.home.abbr, matchupFull:g.away.name+' vs '+g.home.name,
    type:m.type, side:m.side, line: m.line != null ? m.line : null, propId:m.propId || null,
    label:m.label, sub:m.sub, odds:m.odds, status:'open'
  });
  if (g.src === 'live') S.liveCache[g.id] = slimGame(g);
  save();
  if (replaced) toast('Swapped your pick on ' + g.away.abbr + ' @ ' + g.home.abbr, 'gold', 2000);
  renderAll();
}

function clearSlip(){ S.slip.legs = []; save(); closeSheet(); renderAll(); }

function placeBet(){
  const legs = S.slip.legs;
  if (!legs.length) return;

  for (const l of legs){
    const g = gameById(l.gameId);
    if (!g || gIsFinal(g)){
      S.slip.legs = legs.filter(x => x.gameId !== l.gameId);
      save(); renderAll(); if (legCount()) renderSheet(); else closeSheet();
      return toast('A leg went final and left your slip.', 'bad');
    }
  }

  const stake = Math.floor(S.slip.stake);
  if (!Number.isFinite(stake) || stake < MIN_BET) return toast('Minimum bet is ' + MIN_BET + ' coins.', 'bad');
  if (stake > S.balance) return toast("You don't have enough coins.", 'bad');

  const mult = slipMult();
  const bet = {
    id: uid(),
    legs: legs.map(l => Object.assign({}, l, { status:'open' })),
    stake, odds: multToAmerican(mult), mult,
    payout: Math.round(stake * mult), toWin: Math.round(stake * mult - stake),
    status:'active', placedAt:now(), settledAt:null, cashValue:null
  };

  for (const l of bet.legs){
    const g = gameById(l.gameId);
    if (g && g.src === 'live') S.liveCache[g.id] = slimGame(g);
  }

  S.balance -= stake;
  S.bets.unshift(bet);
  S.stats.bets++;
  S.stats.wagered += stake;
  S.stats.biggestStake = Math.max(S.stats.biggestStake, stake);

/* ---------------- grading ---------------- */
function gradeLeg(leg, g){
  const F = gFinalScore(g);
  if (leg.type === 'ml'){
    if (F.home === F.away) return 'push';
    return leg.side === (F.home > F.away ? 'home' : 'away') ? 'won' : 'lost';
  }
  if (leg.type === 'spread'){
    const mine  = leg.side === 'home' ? F.home : F.away;
    const other = leg.side === 'home' ? F.away : F.home;
    const adj = mine + leg.line;
    if (adj === other) return 'push';
    return adj > other ? 'won' : 'lost';
  }
  if (leg.type === 'total'){
    const tot = F.home + F.away;
    if (tot === leg.line) return 'push';
    return (leg.side === 'over' ? tot > leg.line : tot < leg.line) ? 'won' : 'lost';
  }
  return 'lost';
}

function settleBets(){
  let changed = false;

  for (const b of S.bets){
    if (b.status !== 'active') continue;
    let anyLost = false, allDone = true;

    for (const leg of b.legs){
      if (leg.status && leg.status !== 'open'){ if (leg.status === 'lost') anyLost = true; continue; }
      const g = gameById(leg.gameId);
      if (!g){
        if (leg.src === 'live'){ allDone = false; continue; }   // real game: wait for the result to arrive
        leg.status = 'push'; changed = true; continue;          // sim game gone: void the leg
      }
      if (!gIsFinal(g)){ allDone = false; continue; }
      leg.status = gradeLeg(leg, g);
      const fs = gFinalScore(g);
      leg.finalHome = fs.home; leg.finalAway = fs.away;
      if (leg.status === 'lost') anyLost = true;
      changed = true;
    }

    if (anyLost){
      b.status = 'lost'; b.settledAt = now();
      S.stats.losses++; S.stats.profit -= b.stake; S.stats.streak = 0;
      const dead = b.legs.find(l => l.status === 'lost');
      toast('Lost · ' + (b.legs.length > 1 ? 'parlay died on ' + dead.label : dead.label), 'bad', 3600);
      notify('Bet lost', (b.legs.length > 1 ? b.legs.length + '-leg parlay' : dead.label) + ' — ' + fmt(b.stake) + ' coins');
      changed = true;
    } else if (allDone){
      const live = b.legs.filter(l => l.status === 'won');
      b.settledAt = now();
      if (!live.length){
        b.status = 'push'; S.balance += b.stake; S.stats.pushes++;
        toast('Push · ' + fmt(b.stake) + ' 🪙 refunded', 'gold');
      } else {
        const mult = live.reduce((m, l) => m * americanToMult(l.odds), 1);
        const payout = Math.round(b.stake * mult);
        b.status = 'won'; b.payout = payout; b.toWin = payout - b.stake;
        S.balance += payout;
        S.stats.wins++; S.stats.returned += payout; S.stats.profit += b.toWin;
        S.stats.streak = Math.max(0, S.stats.streak) + 1;
        S.stats.bestStreak = Math.max(S.stats.bestStreak, S.stats.streak);
        S.stats.biggestWin = Math.max(S.stats.biggestWin, b.toWin);
        if (b.legs.some(l => l.odds >= 150)) S.stats.dogWin = true;
        if (b.legs.length >= 3) S.stats.parlayWins++;
        if (b.legs.some(l => l.type === 'prop')) S.stats.propWins++;
        if (b.legs.some(l => l.src === 'live')) S.stats.liveWins++;
        awardXp(XP.win, 'Bet won');
        toast('Winner! +' + fmt(payout) + ' 🪙', 'good', 4200);
        notify('You won ' + fmt(payout) + ' coins 🎉', b.legs.length > 1 ? b.legs.length + '-leg parlay cashed' : b.legs[0].label + ' cashed');
        confetti();
        if (b.toWin >= 400 || b.legs.length >= 3){
          addFeed({ user:S.profile.name, avatar:S.profile.avatar, me:true, kind:'win', amount:payout,
            text:'cashed ' + (b.legs.length > 1 ? 'a ' + b.legs.length + '-leg parlay' : b.legs[0].label) + ' for ' + fmt(payout) + ' coins.' });
        }
      }
      changed = true;
    }
    S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
  }

  if (changed){ pushHistory(); checkBadges(); save(); }
  return changed;
}

/* ---------------- live cash-out ---------------- */
function legWinProb(leg, g){
  if (!g) return 0;
  if (leg.status === 'won') return 1;
  if (leg.status === 'lost') return 0;

  const L = leagueMeta(g.league);
  const p = gProgress(g);
  const prior = impliedProb(leg.odds);
  if (p <= 0) return prior;
  if (gIsFinal(g)) return gradeLeg(leg, g) === 'lost' ? 0 : 1;

  const r = clamp(1 - p, 0, 1);
  const scale = Math.max(1, g.total ? g.total.line : L.base);
  const sigma = Math.max(.9, scale * .22 * Math.sqrt(r));
  const s = gScore(g);

  if (leg.type === 'ml' || leg.type === 'spread'){
    const mine  = leg.side === 'home' ? s.home : s.away;
    const other = leg.side === 'home' ? s.away : s.home;
    const edge  = mine - other + (leg.line || 0);
    return clamp(logistic(edge / (sigma * .62)), .01, .99);
  }
  if (leg.type === 'total'){
    const projected = s.home + s.away + scale * r;
    const edge = (projected - leg.line) * (leg.side === 'over' ? 1 : -1);
    return clamp(logistic(edge / (sigma * .62)), .01, .99);
  }
  return prior;
}

function cashOutValue(b){
  if (b.status !== 'active') return 0;
  let p = 1;
  for (const leg of b.legs){
    const g = gameById(leg.gameId);
    if (!g) return 0;                       // can't price what we can't see
    p *= legWinProb(leg, g);
  }
  return Math.max(0, Math.floor(b.payout * p * CASHOUT_MARGIN));
}

function cashOut(betId){
  const b = S.bets.find(x => x.id === betId);
  if (!b || b.status !== 'active') return;
  const value = cashOutValue(b);
  if (value < 1) return toast('This ticket is worth nothing right now.', 'bad');

  confirmModal('Cash out ' + fmt(value) + ' 🪙?',
    'Ends the bet now for ' + (value >= b.stake ? 'a ' + fmt(value - b.stake) + ' coin profit' : 'a ' + fmt(b.stake - value) + ' coin loss') +
    ', however it would have landed. The price keeps moving until you confirm.',
    'Cash out', () => {
      if (b.status !== 'active') return;
      const v = cashOutValue(b);
      b.status = 'cashed'; b.cashValue = v; b.settledAt = now();
      S.balance += v;
      S.stats.cashouts++; S.stats.returned += v; S.stats.profit += (v - b.stake);
      S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
      awardXp(XP.cashout, 'Cashed out');
      pushHistory(); checkBadges(); save();
      toast('Cashed out for ' + fmt(v) + ' 🪙', v >= b.stake ? 'good' : 'gold');
      renderAll();
    }, 'btn-primary');
}

function touchDay(){
  const today = dayKey();
  if (S.xp.day !== today){ S.xp.day = today; S.xp.today = 0; }
  if (S.xp.week !== weekKey()) rolloverWeek();

  if (S.streak.lastDay === today) return false;
  const gap = S.streak.lastDay ? daysBetween(S.streak.lastDay, today) : null;
  S.streak.count = (gap === 1) ? S.streak.count + 1 : 1;
  S.streak.best = Math.max(S.streak.best || 0, S.streak.count);
  S.streak.lastDay = today;
  if (S.streak.count > 1) setTimeout(() => toast(S.streak.count + ' day streak! 🔥', 'gold', 3500), 400);
  return true;
}

function awardXp(n, why){
  touchDay();
  S.xp.total += n;
  S.xp.today += n;
  S.xp.weekXp += n;
  const before = Math.floor((S.xp.total - n) / XP_PER_LEVEL);
  if (Math.floor(S.xp.total / XP_PER_LEVEL) > before){

  return n;
}

/* the streak only breaks when a day is actually missed, checked on open */
function checkStreakBreak(){
  const today = dayKey();
  if (!S.streak.lastDay || S.streak.lastDay === today) return;
  if (daysBetween(S.streak.lastDay, today) > 1 && S.streak.count > 0){
    const lost = S.streak.count;
    S.streak.count = 0;
    save();
    if (lost >= 2) setTimeout(() => toast('Your ' + lost + ' day streak ended. Start a new one today.', 'bad', 4000), 900);

function seedLeagueBots(tier){
  const pool = BOT_NAMES.slice().sort(() => Math.random()-.5).slice(0, 24);
  const pace = 12 + tier*9;
  return pool.map(([name, avatar]) => ({
    name, avatar,
    xp: Math.floor(Math.random() * pace * 2),
    rate: pace * (.5 + Math.random())            // xp per hour
  }));
}

function rolloverWeek(){
  const rows = leagueRows();
  const me = rows.findIndex(r => r.me);
  const top = me >= 0 && me < 5;
  const bottom = me >= 0 && me >= rows.length - 5;
  const oldTier = S.league.tier;

  if (top && S.league.tier < TIERS.length - 1) S.league.tier++;
  else if (bottom && S.league.tier > 0) S.league.tier--;

  S.league.week = weekKey();
  S.league.bots = seedLeagueBots(S.league.tier);
  S.xp.week = weekKey();
  S.xp.weekXp = 0;

  const t = TIERS[S.league.tier];
  setTimeout(() => {
    if (S.league.tier > oldTier){ toast('Promoted to ' + t.name + ' ' + t.icon, 'gold', 5000); confetti(); }
    else if (S.league.tier < oldTier) toast('Dropped to ' + t.name + ' ' + t.icon + ' — climb back this week', 'bad', 5000);
    else toast('New league week. ' + t.icon + ' ' + t.name, 'gold', 4000);
  }, 800);
  save();
}

function botXpNow(b){
  const hrs = Math.max(0, (now() - new Date(weekKey()+'T00:00:00').getTime()) / 3600000);
  return Math.round(b.xp + b.rate * hrs * (.6 + .8*Math.abs(Math.sin(hrs/7 + b.rate))));
}

function leagueRows(){
  const rows = S.league.bots.map(b => ({ name:b.name, avatar:b.avatar, me:false, xp: botXpNow(b) }));
  rows.push({ name:S.profile.name, realName:S.profile.realName, avatar:S.profile.avatar, me:true, xp:S.xp.weekXp });
  rows.sort((a,b) => b.xp - a.xp);
  return rows;
}

/* ---------------- Daily Pick: one tap, no coins at risk ---------------- */
/* the pick is always a game happening today */
function featuredGame(){
  const today = allGames().filter(g => isToday(g.startsAt) && !gIsFinal(g));
  const pre = today.filter(gIsPre).sort((a,b) => a.startsAt - b.startsAt);
  if (pre.length) return pre[0];
  const live = today.filter(gIsLive).sort((a,b) => a.startsAt - b.startsAt);
  return live[0] || null;
}

function ensurePick(){
  const today = dayKey();
  if (S.pick && S.pick.day === today){
    if (S.pick.side && S.pick.status === 'open') settlePick();
    return S.pick;
  }
  // wait for the live feed before choosing, so the pick is a real game when one exists
  if (!liveState.tried) return null;
  const g = featuredGame();
  if (!g) return null;
  S.pick = { day:today, gameId:g.id, side:null, status:'open',
             matchup:g.away.abbr + ' @ ' + g.home.abbr, src:g.src };
  if (g.src === 'live') S.liveCache[g.id] = slimGame(g);
  save();
  return S.pick;
}

function makePick(side){
  const p = S.pick;
  if (!p || p.side) return;
  const g = gameById(p.gameId);
  if (!g || gIsFinal(g)) return toast('That game already finished.', 'bad');
  p.side = side;
  S.stats.picks++;
  awardXp(XP.pick, 'Daily Pick');
  save();
  toast('Pick locked — ' + (side === 'home' ? g.home.name : g.away.name), 'good');
  renderAll();
}

function settlePick(){
  const p = S.pick;
  if (!p || !p.side || p.status !== 'open') return false;
  const g = gameById(p.gameId);
  if (!g || !gIsFinal(g)) return false;
  const F = gFinalScore(g);
  if (F.home === F.away){ p.status = 'push'; save(); return true; }
  const winner = F.home > F.away ? 'home' : 'away';
  if (p.side === winner){
    p.status = 'won';
    S.balance += 250;
    S.stats.pickWins++;
    awardXp(XP.pickWin, 'Daily Pick won');
    toast('Daily Pick hit! +250 🪙', 'good', 4000);
    notify('Daily Pick hit 🎯', 'You called ' + p.matchup + ' right. +250 coins');
    confetti();

    p.status = 'lost';
    toast('Daily Pick missed. Back tomorrow.', 'bad');
  }
  pushHistory(); checkBadges(); save();
  return true;
}

function msToMidnight(){
  const d = new Date();
  d.setHours(24, 0, 0, 0);

function dailyReset(){
  const today = dayKey();
  if (S.day === today) return false;
  const wasBroke = isBroke();

  if (S.balance < START_BALANCE && !hasActiveBets()){
    S.balance = START_BALANCE;
    S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
    pushHistory();
    if (wasBroke) setTimeout(() => toast('New day — ' + fmt(START_BALANCE) + ' 🪙 to play with', 'gold', 4500), 600);

/* ---------------- derived ---------------- */
function derived(){
  const st = S.stats;
  const settled = st.wins + st.losses;
  const active  = S.bets.filter(b => b.status === 'active');
  return {
    settled, active,
    winRate: settled ? (st.wins/settled*100) : 0,
    atRisk: active.reduce((a,b) => a + b.stake, 0),
    toWin:  active.reduce((a,b) => a + b.toWin, 0),
    roi: st.wagered ? (st.profit/st.wagered*100) : 0
  };
}

const hosted = () => location.protocol === 'http:' || location.protocol === 'https:';

/* Hosted, the real manifest.webmanifest and its PNG icons sit next to this file — iOS needs
   both to install properly. Opened straight from disk there is nothing to link to, so an
   inline one keeps the browser happy without changing how the app behaves. */
function installManifest(){
  try {
    if (document.querySelector('link[rel="manifest"]')) return;
    const link = document.createElement('link');
    link.rel = 'manifest';
    if (hosted()){
      link.href = 'manifest.webmanifest';
    } else {
      const m = {
        name:'Spank Betting', short_name:'SpankBet', start_url:'.', scope:'./', display:'standalone',
        background_color:'#0b0d12', theme_color:'#19b25a', orientation:'portrait',
        description:'Social sports predictions played with virtual Spank Coins. No real money.',
        icons:[{ src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2322c55e'/><text x='50' y='72' font-size='62' font-family='system-ui' font-weight='800' fill='white' text-anchor='middle'>S</text></svg>",
                 sizes:'any', type:'image/svg+xml', purpose:'any' }]
      };
      link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m));
    }
    document.head.appendChild(link);
  } catch(e){ /* not installable here, no harm */ }
}

/* The service worker is what lets an installed iOS web app receive a push at all.

    <button id="mCancel" class="btn w-full mt-4 bg-surface2 py-3 text-[14px]">Got it</button>`, () => {
    $('#mCancel').onclick = closeModal;
  });
}

/* ================================================================
   RENDERING
================================================================= */
const TABS = [['home','Home','🏠'],['games','Games','📺'],['feed','Feed','💬'],['league','League','🏆'],['you','You','🙂']];

function renderTabs(){
  $('#tabbar').innerHTML = TABS.map(([id,label,icon]) => `
    <button data-tab="${id}" class="tap flex flex-col items-center gap-0.5 py-2 ${ui.tab===id?'text-brand':'text-muted'}">
      <span class="text-[20px] leading-none ${ui.tab===id?'scale-110':''} transition-transform">${icon}</span>
      <span class="text-[10px] font-bold tracking-wide">${label}</span>
    </button>`).join('');
  $('#tabbar').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
}

function go(tab){
  if (ui.tab === tab){ ui.scrollLock = now() + 800; window.scrollTo({ top:0, behavior:'smooth' }); return; }
  ui.tab = tab;
  ui.animate = true;
  renderTabs(); renderMain(); renderSlipBar();
  ui.animate = false;
  window.scrollTo(0, 0);
}

function renderHeader(pop){
  $('#streakText').textContent = S.streak.count;
  $('#xpBar').style.width = levelPct() + '%';
  const t = $('#balanceText');
  t.textContent = fmt(S.balance);
  if (pop){ t.classList.remove('coin-pop'); void t.offsetWidth; t.classList.add('coin-pop'); }
}

function renderAll(){
  ui.animate = true;
  renderTabs(); renderHeader(true); renderMain(); renderSlipBar(); renderDemoBar();
  ui.animate = false;
}

/* A cheap fingerprint of what is on screen. The 1s tick only repaints when this
   changes, so scrolling is not fighting a full re-render every second. */
function viewSignature(){
  const p = [ui.tab, ui.gamesFilter, ui.feedFilter, S.balance, S.slip.legs.length,
             S.bets.length, S.feed.length, S.xp.total, S.streak.count, S.shop.owned.length,
             liveState.at, liveState.error, weekState.at, isBroke()];
  for (const b of S.bets) if (b.status === 'active') p.push(b.id, b.status);
  for (const g of LIVE) p.push(g.id, g.state, g.score.home, g.score.away, g.clockText);
  if (S.pick) p.push(S.pick.gameId, S.pick.side, S.pick.status);
  return p.join('|');
}
let lastSig = '';
let lastScrollAt = 0;
window.addEventListener('scroll', () => { lastScrollAt = now(); }, { passive:true });

function renderMain(){
  const m = $('#main');
  const scrollY = window.scrollY;
  const animate = ui.animate;
  m.innerHTML = '';
  const view = el('div', animate ? 'view' : '');
  view.innerHTML = ({ home:viewHome, games:viewGames, feed:viewFeed, league:viewLeague, you:viewYou }[ui.tab] || viewHome)();
  m.appendChild(view);
  wireMain();
  lastSig = viewSignature();
  if (!animate && scrollY > 0 && now() > (ui.scrollLock || 0)) window.scrollTo(0, scrollY);
}

/* ---------- pieces ---------- */
/* A logo that has loaded once renders solid straight away. Without this the fade
   replayed on every repaint, which is what read as flickering. */
const loadedLogos = new Set();
window.__logoOk = url => loadedLogos.add(url);

function teamBadge(t, big){
  const size = big ? 'h-11 w-11' : 'h-9 w-9';
  const seen = t.logo && loadedLogos.has(t.logo);
  return `<div class="crest ${size} shrink-0" style="background:${esc(t.color)}">
      <span class="crest-txt text-[11px] font-extrabold text-white">${esc(t.abbr)}</span>
      ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy" class="crest-img${seen?' ok instant':''}"
          onload="this.classList.add('ok');window.__logoOk(this.src)" onerror="this.remove()" />` : ''}
    </div>`;
}

function whenChip(g){
  if (gIsLive(g)) return `<span class="inline-flex items-center gap-1.5 text-[11px] font-extrabold text-lose">
      <span class="live-dot h-1.5 w-1.5 rounded-full bg-lose"></span>${esc(gClock(g))}</span>`;
  if (gIsFinal(g)) return `<span class="text-[11px] font-bold text-muted">Final</span>`;
  return `<span class="text-[11px] font-bold text-muted">${esc(gWhen(g))}</span>`;
}

function oddsButton(g, m, small){
  const sel = hasLeg(g.id, m.key);
  return `<button data-bet="${g.id}" data-key="${m.key}"
    class="btn ${sel?'btn-sel':'bg-surface2'} flex-1 min-w-0 ${small?'py-2':'py-2.5'} px-2">
      <div class="text-[12px] font-bold truncate ${sel?'':'text-fg'}">${esc(m.label)}</div>
      <div class="text-[13px] font-extrabold tabular-nums ${sel?'':(m.odds>0?'text-brand':'text-muted')}">${fmtAmerican(m.odds)}</div>
   </button>`;
}

/* the scoreboard card: two names, two buttons, nothing else until you ask for it */
function gameCard(g){
  const sc = gScore(g);
  const fin = gIsFinal(g);
  const win = winnerMarkets(g);
  const showScore = gIsLive(g) || fin;
  const row = (t, score, winner) => `
    <div class="flex items-center gap-2.5">
      ${teamBadge(t)}
      <div class="min-w-0 flex-1">
        <div class="font-extrabold text-[15px] truncate ${winner?'text-brand':''}">${esc(t.name)}</div>
        ${t.rec ? `<div class="text-[11px] text-muted">${esc(t.rec)}</div>` : ''}
      </div>
      ${showScore ? `<div class="font-extrabold tabular-nums text-[20px] ${winner?'text-brand':''}">${score}</div>` : ''}
    </div>`;

  return `
  <section class="card p-3.5">
    <div class="flex items-center justify-between mb-2.5">
      <span class="text-[11px] font-extrabold text-muted uppercase tracking-wider">
        ${leagueMeta(g.league).icon} ${esc(leagueMeta(g.league).name)}
      </span>
      ${whenChip(g)}
    </div>
    <button data-game="${g.id}" class="tap w-full text-left space-y-2">
      ${row(g.away, sc.away, fin && sc.away > sc.home)}
      ${row(g.home, sc.home, fin && sc.home > sc.away)}
    </button>
    ${fin ? `<div class="mt-3 text-center text-[12px] text-muted font-bold">Betting closed</div>`
          : `<div class="mt-3 flex gap-2">${win.map(m => oddsButton(g, m)).join('')}</div>
             <button data-game="${g.id}" class="tap mt-2 w-full text-[12px] font-bold text-muted py-1">More markets →</button>`}
  </section>`;
}

function legLine(leg, showStatus){
  const tone = leg.status === 'won' ? 'text-win' : leg.status === 'lost' ? 'text-lose' : leg.status === 'push' ? 'text-muted' : '';
  const mark = leg.status === 'won' ? '✅' : leg.status === 'lost' ? '❌' : leg.status === 'push' ? '➖' : '•';
  return `<div class="flex items-start gap-2 text-[12.5px]">
      <span class="${tone} leading-5">${showStatus ? mark : '•'}</span>
      <div class="min-w-0 flex-1">
        <div class="font-bold truncate ${tone}">${esc(leg.label)} <span class="text-muted font-semibold">${fmtAmerican(leg.odds)}</span></div>
        <div class="text-[11px] text-muted truncate">${esc(leg.sub)} · ${esc(leg.matchup)}</div>
      </div>
    </div>`;
}

function betRow(b){
  const tone  = { active:'text-gold', won:'text-win', lost:'text-lose', push:'text-muted', cashed:'text-gold' }[b.status];
  const badge = { active:'PENDING', won:'WON', lost:'LOST', push:'PUSH', cashed:'CASHED' }[b.status];
  const edge  = { active:'border-gold/40', won:'border-win/50', lost:'border-lose/40', push:'border-line', cashed:'border-gold/40' }[b.status];
  const parlay = b.legs.length > 1;
  const title = parlay ? b.legs.length + '-leg parlay' : b.legs[0].label;
  const delta = b.status === 'won' ? '+'+fmt(b.payout)
              : b.status === 'lost' ? '−'+fmt(b.stake)
              : b.status === 'push' ? '±0'
              : b.status === 'cashed' ? '+'+fmt(b.cashValue)
              : fmt(b.stake);

  let sub = '', anyLive = false;
  if (b.status === 'active'){
    const parts = [];
    for (const l of b.legs){
      const g = gameById(l.gameId);
      if (!g){ parts.push('waiting on result'); continue; }
      if (gIsLive(g)){ anyLive = true; const s = gScore(g); parts.push(`${g.away.abbr} ${s.away}–${s.home} ${g.home.abbr} · ${gClock(g)}`); }
      else if (gIsPre(g)) parts.push(gWhen(g));
      else parts.push('settling…');
    }
    sub = `<span class="${anyLive ? 'text-lose font-bold' : 'text-muted'}">${esc(parts.slice(0,2).join('  ·  '))}</span>`;
  } else {
    sub = `<span class="text-muted">${timeAgo(b.settledAt || b.placedAt)}</span>`;
  }

  const graded = b.legs.some(l => l.status && l.status !== 'open');
  const cash = b.status === 'active' ? cashOutValue(b) : 0;

  return `
  <div class="card ${edge} p-3">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <span class="text-[12px]">${parlay ? '🎰' : leagueMeta(b.legs[0].league).icon}</span>
          <span class="font-extrabold text-[14px] truncate">${esc(title)}</span>
          <span class="text-[9.5px] font-extrabold tracking-wider ${tone}">${badge}</span>
        </div>
        <div class="text-[11.5px] text-muted mt-0.5">${fmtAmerican(b.odds)} · ${fmt(b.stake)} 🪙${b.status==='active' ? ' → '+fmt(b.payout) : ''}</div>
        <div class="text-[11.5px] mt-1">${sub}</div>
      </div>
      <div class="text-right shrink-0">
        <div class="font-extrabold tabular-nums ${tone} text-[16px]">${delta}</div>
      </div>
    </div>
    ${(parlay || b.status !== 'active') ? `<div class="mt-2.5 space-y-1.5 border-t-2 border-line pt-2.5">
        ${b.legs.map(l => legLine(l, b.status !== 'active' || graded)).join('')}</div>` : ''}
    ${(b.status === 'active' && cash > 0) ? `
      <button data-cash="${b.id}" class="btn w-full mt-2.5 bg-surface2 py-2 text-[12.5px] text-gold">
        Cash out ${fmt(cash)} 🪙 <span class="text-muted font-bold">${cash >= b.stake ? '+'+fmt(cash-b.stake) : '−'+fmt(b.stake-cash)}</span>
      </button>` : ''}
  </div>`;
}

function empty(icon, title, sub, cta){
  return `<div class="card p-7 text-center">
    <div class="text-4xl mb-2">${icon}</div>
    <div class="font-extrabold text-[15px]">${esc(title)}</div>
    <div class="text-[13px] text-muted mt-1">${esc(sub)}</div>
    ${cta || ''}
  </div>`;
}

/* ---------- HOME ---------- */
function viewHome(){
  const d = derived();
  const p = ensurePick();
  const pickLoading = !p && !liveState.tried;

  return `
  <div class="space-y-4">
    ${pickLoading ? `<section class="card p-4">
        <div class="flex items-center gap-2"><span class="text-[17px]">🎯</span>
          <h2 class="font-extrabold text-[16px]">Daily Pick</h2></div>
        <p class="text-[12.5px] text-muted mt-1">Finding today's game…</p>
      </section>` : dailyPickCard(p)}

    ${isBroke() ? `
      <section class="card border-lose/50 p-5 text-center">
        <div class="text-[40px] leading-none">🔒</div>
        <h2 class="font-extrabold text-[17px] mt-2">You're out of coins</h2>
        <p class="text-[13px] text-muted mt-1.5 leading-snug">
          That's it for today. A fresh ${fmt(START_BALANCE)} lands at midnight.
        </p>
        <div class="mt-3 inline-block rounded-full bg-surface2 border-2 border-line px-4 py-2 font-extrabold tabular-nums">
          ${countdown(msToMidnight())}
        </div>
      </section>` : ''}

    ${d.active.length ? `
    <section>
      <div class="flex items-center justify-between mb-2 px-1">
        <h2 class="font-extrabold text-[16px]">Your bets</h2>
        <span class="text-[12px] text-muted tabular-nums">${fmt(d.atRisk)} 🪙 riding</span>
      </div>
      <div class="space-y-2">${d.active.map(betRow).join('')}</div>
    </section>` : ''}

    <button data-goto="games" class="btn btn-primary w-full py-3.5 text-[15px]">📺 Browse games</button>

    ${!d.active.length && !S.stats.bets ? `
      <p class="text-center text-[12px] text-muted px-6 leading-relaxed">
        Tap a team to add it to your slip. Everything here is play money — Spank Coins have no cash value.
      </p>` : ''}
  </div>`;
}

function dailyPickCard(p){
  if (!p) return '';
  const g = gameById(p.gameId);
  if (!g) return '';
  const done = p.side && p.status !== 'open';
  const tone = p.status === 'won' ? 'border-win/60' : p.status === 'lost' ? 'border-lose/50' : 'border-brand/50';

  if (!p.side){
    return `
    <section class="card ${tone} p-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-[17px]">🎯</span>
        <h2 class="font-extrabold text-[16px]">Daily Pick</h2>
        <span class="ml-auto text-[11px] font-bold text-muted">Free · +${XP.pick} XP</span>
      </div>
      <p class="text-[12.5px] text-muted mb-3">Who wins? One tap, no coins at risk.</p>
      <div class="flex gap-2">
        <button data-pick="away" class="btn bg-surface2 flex-1 py-3">
          <div class="flex justify-center mb-1.5">${teamBadge(g.away)}</div>
          <div class="text-[13px] font-extrabold truncate px-1">${esc(g.away.name)}</div>
        </button>
        <button data-pick="home" class="btn bg-surface2 flex-1 py-3">
          <div class="flex justify-center mb-1.5">${teamBadge(g.home)}</div>
          <div class="text-[13px] font-extrabold truncate px-1">${esc(g.home.name)}</div>
        </button>
      </div>
      <div class="text-center text-[11px] text-muted mt-2">${esc(gWhen(g))} · ${esc(leagueMeta(g.league).name)}</div>
    </section>`;
  }

  const picked = p.side === 'home' ? g.home : g.away;
  const sc = gScore(g);
  return `
  <section class="card ${tone} p-4">
    <div class="flex items-center gap-2">
      <span class="text-[17px]">${p.status === 'won' ? '🎉' : p.status === 'lost' ? '💔' : '🎯'}</span>
      <h2 class="font-extrabold text-[16px]">Daily Pick</h2>
      <span class="ml-auto text-[11px] font-extrabold ${p.status==='won'?'text-win':p.status==='lost'?'text-lose':'text-muted'}">
        ${p.status === 'won' ? 'NAILED IT +250 🪙' : p.status === 'lost' ? 'MISSED' : p.status === 'push' ? 'TIED' : 'LOCKED'}
      </span>
    </div>
    <div class="flex items-center gap-2.5 mt-2.5">
      ${teamBadge(picked, true)}
      <div class="min-w-0 flex-1">
        <div class="font-extrabold text-[15px] truncate">${esc(picked.name)}</div>
        <div class="text-[11.5px] text-muted truncate">${esc(g.away.abbr)} ${gIsPre(g)?'':sc.away} @ ${gIsPre(g)?'':sc.home} ${esc(g.home.abbr)} · ${esc(gWhen(g))}</div>
      </div>
    </div>
    ${done ? `<div class="text-[11.5px] text-muted mt-2.5">Next pick unlocks tomorrow — keep the streak alive.</div>` : ''}
  </section>`;
}

/* ---------- GAMES ---------- */
function viewGames(){
  const leagues = ['ALL', ...Object.keys(LIVE_LEAGUES)];
  const pool = allGames().filter(g => ui.gamesFilter === 'ALL' || g.league === ui.gamesFilter);

  const live = pool.filter(gIsLive).sort((a,b) => a.startsAt - b.startsAt);
  const rest = pool.filter(g => !gIsLive(g)).sort((a,b) => a.startsAt - b.startsAt);
  const byDay = [];
  for (const g of rest){
    const label = gDayLabel(g.startsAt);
    let grp = byDay.find(x => x.label === label);
    if (!grp){ grp = { label, games:[] }; byDay.push(grp); }
    grp.games.push(g);
  }

  const status = liveState.loading && !LIVE.length ? 'Loading games…'
    : liveState.error ? 'Live feed unreachable — check your connection.'
    : weekState.loading ? 'Loading the rest of the week…'
    : LIVE.length + ' games · updated ' + timeAgo(liveState.at);

  return `
  <div class="space-y-3">
    <div class="flex items-center justify-between px-1">
      <h1 class="font-extrabold text-[22px]">Games</h1>
      <button id="helpBtn" class="tap text-[12px] font-extrabold text-brand">How betting works</button>
    </div>
    <p class="text-center text-[11.5px] text-muted">${esc(status)}</p>

    <div class="no-scrollbar -mx-4 px-4 flex gap-2 overflow-x-auto pb-1">
      ${leagues.map(l => `
        <button data-league="${l}" class="btn shrink-0 px-3.5 py-1.5 text-[12px] ${ui.gamesFilter===l ? 'btn-primary' : 'bg-surface2'}">
          ${l==='ALL' ? 'All' : leagueMeta(l).icon + ' ' + leagueMeta(l).name}
        </button>`).join('')}
    </div>

    ${live.length ? `
      <h2 class="font-extrabold text-[12px] text-lose uppercase tracking-wider px-1 pt-1">Live now</h2>
      <div class="space-y-3">${live.map(gameCard).join('')}</div>` : ''}

    ${byDay.map(grp => `
      <h2 class="font-extrabold text-[12px] text-muted uppercase tracking-wider px-1 pt-1">${esc(grp.label)}</h2>
      <div class="space-y-3">${grp.games.map(gameCard).join('')}</div>`).join('')}

    ${!pool.length ? empty('🌙','No games here',
        liveState.error ? 'Check your connection and try again.' : 'Nothing scheduled for this league right now.') : ''}

    <p class="text-center text-[11px] text-muted pt-1 pb-4">Real games and odds. Spank Coins are play money with no cash value.</p>
  </div>`;
}

/* ---------- FEED ---------- */

/* ---------- LEAGUE ---------- */
function viewLeague(){
  const rows = leagueRows();
  const me = rows.findIndex(r => r.me);
  const tier = TIERS[S.league.tier];
  const next = TIERS[S.league.tier + 1];
  const endMs = new Date(weekKey()+'T00:00:00').getTime() + 7*86400000 - now();

  return `
  <div class="space-y-3">
    <section class="card p-5 text-center">
      <div class="text-[44px] leading-none">${tier.icon}</div>
      <h1 class="font-extrabold text-[20px] mt-1">${tier.name} League</h1>
      <p class="text-[12.5px] text-muted mt-1">
        Top 5 move up${next ? ' to ' + next.name : ''} · bottom 5 drop · ${countdown(endMs)} left
      </p>
      <div class="mt-3 inline-flex items-center gap-2 rounded-full bg-surface2 border-2 border-line px-4 py-2">
        <span class="text-[15px]">⚡️</span>
        <span class="font-extrabold tabular-nums">${fmt(S.xp.weekXp)} XP this week</span>
      </div>
      <p class="text-[11.5px] text-muted mt-2">Earn XP by betting, winning and making your Daily Pick.</p>
    </section>

    <section class="card overflow-hidden">
      ${rows.map((r,i) => {
        const zone = i < 5 ? 'border-l-4 border-l-win' : i >= rows.length-5 ? 'border-l-4 border-l-lose' : 'border-l-4 border-l-transparent';
        return `
        <div class="flex items-center gap-3 px-3.5 py-2.5 ${zone} ${r.me?'bg-brand/10':''} ${i?'border-t-2 border-t-line':''}">
          <div class="w-6 text-center font-extrabold tabular-nums text-[13px] ${i<5?'text-win':i>=rows.length-5?'text-lose':'text-muted'}">${i+1}</div>
          <div class="h-9 w-9 rounded-full bg-surface2 border-2 border-line grid place-items-center text-[17px]">${r.avatar}</div>
          <div class="min-w-0 flex-1">
            <div class="font-extrabold text-[13.5px] truncate ${r.me?'text-brand':''}">${esc(r.name)}</div>
            ${r.realName ? `<div class="text-[11px] text-muted truncate">${esc(r.realName)}</div>` : ''}
          </div>
          <div class="font-extrabold tabular-nums text-[14px]">${fmt(r.xp)}<span class="text-[10px] text-muted ml-1">XP</span></div>
        </div>`;

const miniStat = (icon, value, label) => `
  <div class="rounded-xl bg-surface2 border-2 border-line p-2">

const tinyStat = (label, value) => `

function sparkline(){
  const pts = S.history.slice(-40);
  if (pts.length < 2) return `<div class="h-24 grid place-items-center text-[12.5px] text-muted">Place a few bets to build your chart.</div>`;
  const vals = pts.map(p => p.balance);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 1;
  const W = 300, H = 90;
  const xy = vals.map((v,i) => [ (i/(vals.length-1))*W, H - ((v-min)/span)*(H-10) - 5 ]);
  const line = xy.map(([x,y],i) => (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)).join(' ');
  const up = vals[vals.length-1] >= vals[0];
  const c = up ? 'rgb(var(--win))' : 'rgb(var(--lose))';
  return `
  <svg viewBox="0 0 ${W} ${H}" class="w-full h-24" preserveAspectRatio="none">
    <path d="${line} L ${W} ${H} L 0 ${H} Z" fill="${c}" opacity=".13"/>
    <path d="${line}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${xy[xy.length-1][0].toFixed(1)}" cy="${xy[xy.length-1][1].toFixed(1)}" r="4" fill="${c}"/>
  </svg>
  <div class="flex justify-between text-[10px] text-muted mt-1">
    <span>low ${fmt(min)}</span><span>balance over time</span><span>high ${fmt(max)}</span>
  </div>`;
}

/* ---------- wiring ---------- */
function wireMain(){
  const m = $('#main');
  m.querySelectorAll('[data-bet]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleLeg(b.dataset.bet, b.dataset.key); });
  m.querySelectorAll('[data-game]').forEach(b => b.onclick = () => openGameSheet(b.dataset.game));
  m.querySelectorAll('[data-cash]').forEach(b => b.onclick = () => cashOut(b.dataset.cash));
  m.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => go(b.dataset.goto));
  m.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => makePick(b.dataset.pick));
  m.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => setTheme(b.dataset.theme));
  m.querySelectorAll('[data-league]').forEach(b => b.onclick = () => { ui.gamesFilter = b.dataset.league; renderMain(); });
  m.querySelectorAll('[data-feed]').forEach(b => b.onclick = () => { ui.feedFilter = b.dataset.feed; renderMain(); });
  m.querySelectorAll('[data-like]').forEach(b => b.onclick = () => {
    const p = S.feed.find(x => x.id === b.dataset.like); if (!p) return;
    p.liked = !p.liked; p.likes += p.liked ? 1 : -1; save(); renderMain();
  });

  const byId = (id, fn) => { const n = $('#'+id); if (n) n.onclick = fn; };
  byId('helpBtn', helpSheet);
  byId('demoBtn', () => DEMO ? demoExit() : demoEnter());
  byId('helpBtn2', helpSheet);
  m.querySelectorAll('[data-prize]').forEach(b => b.onclick = () => buyPrize(b.dataset.prize));
  byId('editName', nameModal);
  byId('editAvatar', avatarModal);
  byId('brag', bragModal);
  byId('notifyBtn', askNotify);
  byId('tourBtn', () => startOnboard(true));
  byId('installBtn', doInstall);

  // real games only publish a moneyline per event — pull it for what's on screen
  if (ui.tab === 'games' || ui.tab === 'home'){
    const ids = [...m.querySelectorAll('[data-game]')].map(n => n.dataset.game).slice(0, 6);
    for (const id of new Set(ids)){
      const g = gameById(id);
      if (g && g.src === 'live' && !g.mlReal) upgradeOdds(g);
    }
  }
}

function openSlipSheet(){ if (!legCount()) return; ui.sheet = { kind:'slip' }; renderSheet(); renderSlipBar(); }
function openGameSheet(gameId){ ui.sheet = { kind:'game', gameId }; renderSheet(); renderSlipBar(); }

function closeSheet(){
  const panel = $('#sheetPanel'), root = $('#sheetRoot');
  if (panel){
    panel.classList.add('sheet-out');
    const bd = $('#sheetBackdrop'); if (bd) bd.style.opacity = '0';
    setTimeout(() => { root.classList.add('hidden'); root.innerHTML = ''; }, 240);
  } else { root.classList.add('hidden'); root.innerHTML = ''; }
  ui.sheet = null;
  renderSlipBar();
}

function renderSheet(){
  const root = $('#sheetRoot');
  if (!ui.sheet){ root.classList.add('hidden'); root.innerHTML = ''; return; }
  const body = ui.sheet.kind === 'slip' ? slipSheetHTML()
             : ui.sheet.kind === 'help' ? helpSheetHTML()
             : gameSheetHTML(ui.sheet.gameId);
  if (body == null){ closeSheet(); return; }

  root.classList.remove('hidden');
  root.innerHTML = `
    <div id="sheetBackdrop" class="absolute inset-0 bg-black/50 transition-opacity duration-300"></div>
    <div id="sheetPanel" class="sheet-in absolute bottom-0 inset-x-0 mx-auto max-w-[520px] max-h-[88vh] overflow-y-auto no-scrollbar rounded-t-[24px] border-t-2 border-x-2 border-line bg-bg safe-b">

      ${body}
    </div>`;
  $('#sheetBackdrop').onclick = closeSheet;
  const c = $('#closeSheet'); if (c) c.onclick = closeSheet;
  wireSheet();
}

      </div>
      <div class="text-right">

    <div id="slipWarn" class="mt-2 text-[12px] text-lose font-bold text-center h-4">${
      stake > S.balance ? 'Only ' + fmt(S.balance) + ' coins available.'
      : (stake && stake < MIN_BET) ? 'Minimum bet is ' + MIN_BET + '.' : ''}</div>

    <button id="confirmBet" ${bad?'disabled':''} class="btn ${bad?'bg-surface2 text-muted':'btn-primary'} w-full mt-2 py-4 text-[16px]">
      ${bad ? 'Enter a wager' : 'Place bet · ' + fmt(stake) + ' 🪙'}

}

function wireSheet(){
  const root = $('#sheetRoot');
  root.querySelectorAll('[data-bet]').forEach(b => b.onclick = () => {
    toggleLeg(b.dataset.bet, b.dataset.key);
    if (ui.sheet && ui.sheet.kind === 'game') renderSheet();
  });
  root.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
    const [gameId, key] = b.dataset.drop.split('|');
    S.slip.legs = S.slip.legs.filter(l => !(l.gameId === gameId && l.key === key));
    save();
    if (!legCount()) closeSheet(); else renderSheet();
    renderAll();
  });
  root.querySelectorAll('[data-stake]').forEach(b => b.onclick = () => {
    const v = b.dataset.stake;
    S.slip.stake = v === 'max' ? Math.floor(S.balance) : clamp(Number(v), 0, Math.floor(S.balance));
    save(); renderSheet();
  });

  const byId = (id, fn) => { const n = $('#'+id); if (n) n.onclick = fn; };
  byId('addMore', () => { closeSheet(); go('games'); });
  byId('confirmBet', placeBet);

  const input = $('#stakeInput');
  if (input){
    input.oninput = () => {
      const v = parseInt(input.value.replace(/\D/g,''), 10);
      S.slip.stake = Number.isFinite(v) ? v : 0;
      updateSlipNumbers();
    };
    input.onkeydown = e => {
      if (e.key !== 'Enter') return;
      input.blur();
      const v = Math.floor(S.slip.stake || 0);
      if (v >= MIN_BET && v <= S.balance) placeBet();
    };
  }
}

function updateSlipNumbers(){
  if (!ui.sheet || ui.sheet.kind !== 'slip') return;
  const mult = slipMult();
  const stake = clamp(Math.floor(S.slip.stake||0), 0, 1e9);
  const payout = Math.round(stake * mult);
  const bad = stake < MIN_BET || stake > S.balance;

  const pay = $('#slipPayout'); if (pay) pay.textContent = fmt(payout) + ' 🪙';
  const warn = $('#slipWarn');
  if (warn) warn.textContent = stake > S.balance ? 'Only ' + fmt(S.balance) + ' coins available.'
    : (stake && stake < MIN_BET) ? 'Minimum bet is ' + MIN_BET + '.' : '';
  const btn = $('#confirmBet');
  if (btn){
    btn.disabled = bad;
    btn.textContent = bad ? 'Enter a wager' : 'Place bet · ' + fmt(stake) + ' 🪙';
    btn.className = 'btn ' + (bad ? 'bg-surface2 text-muted' : 'btn-primary') + ' w-full mt-2 py-4 text-[16px]';
  }
}

/* patches the live line in an open game sheet instead of rebuilding under the user's finger */
function refreshSheetLive(){
  if (!ui.sheet || ui.sheet.kind !== 'game') return;
  const g = gameById(ui.sheet.gameId);
  if (!g) return closeSheet();
  const n = $('#sheetLive');
  if (!n) return;
  if (gIsFinal(g)){ renderSheet(); return; }
  const sc = gScore(g);
  n.innerHTML = gIsLive(g)
    ? `<span class="text-lose font-extrabold">${esc(g.away.abbr)} ${sc.away}–${sc.home} ${esc(g.home.abbr)} · ${esc(gClock(g))}</span>`
    : `<span class="text-muted font-bold">${esc(gWhen(g))}</span>`;
}

function startOnboard(replay){
  ui.onboard = { step: replay ? 1 : 0, replay: !!replay, tapped:false };
  ui.draftName = replay ? S.profile.name : '';
  ui.draftReal = replay ? (S.profile.realName || '') : '';
  ui.draftAvatar = S.profile.avatar;
  renderOnboard();
}

function finishOnboard(){
  const name = (ui.draftName || '').trim().slice(0,18);
  const real = (ui.draftReal || '').trim().slice(0,24);
  if (!ui.onboard || !ui.onboard.replay){
    if (name) S.profile.name = name;
    S.profile.realName = real;
    if (ui.draftAvatar) S.profile.avatar = ui.draftAvatar;
    touchDay();                       // finishing the tour starts your streak at day 1
  }
  S.onboard = { done:true };
  ui.onboard = null;
  save();
  $('#onboardRoot').classList.add('hidden');
  $('#onboardRoot').innerHTML = '';
  renderAll();
  toast('You’re in. ' + fmt(S.balance) + ' 🪙 to play with 🎉', 'gold', 4000);
  confetti();
}

function onboardStep(n){
  if (!ui.onboard) return;
  ui.onboard.step = n;
  ui.onboard.tapped = false;
  renderOnboard();
}

function renderOnboard(){
  const root = $('#onboardRoot');
  if (!ui.onboard){ root.classList.add('hidden'); root.innerHTML = ''; return; }
  root.classList.remove('hidden');
  root.innerHTML = ui.onboard.step === 0 ? onboardProfileHTML() : onboardTourHTML();
  wireOnboard();
}

function wireOnboard(){
  const root = $('#onboardRoot');

  const stash = () => {
    const n = $('#obName'), r = $('#obReal');
    if (n) ui.draftName = n.value;
    if (r) ui.draftReal = r.value;
  };
  root.querySelectorAll('[data-ob-av]').forEach(b => b.onclick = () => {
    stash();
    ui.draftAvatar = b.dataset.obAv;
    renderOnboard();
  });

  root.querySelectorAll('[data-ob-demo]').forEach(b => b.onclick = () => {
    ui.onboard.tapped = b.dataset.obDemo;
    renderOnboard();
  });

  const input = $('#obName');
  const realIn = $('#obReal');
  if (input) input.oninput = () => { ui.draftName = input.value; };
  if (realIn) realIn.oninput = () => { ui.draftReal = realIn.value; };
  if (realIn) realIn.onkeydown = e => { if (e.key === 'Enter'){ realIn.blur(); next(); } };
  if (input) input.onkeydown = e => { if (e.key === 'Enter'){ input.blur(); if (realIn) realIn.focus(); } };

  function next(){
    if (ui.onboard.step === 0) stash();
    if (ui.onboard.step >= TOUR.length) finishOnboard();
    else onboardStep(ui.onboard.step + 1);
  }
  const nextBtn = $('#obNext'); if (nextBtn) nextBtn.onclick = next;
  const skip = $('#obSkip'); if (skip) skip.onclick = finishOnboard;
}

/* ---------------- toasts + confetti ---------------- */
function toast(msg, kind='good', ms=3000){
  const root = $('#toastRoot');
  const tone = kind === 'good' ? 'border-brand text-brand' : kind === 'bad' ? 'border-lose text-lose' : 'border-gold text-gold';
  const n = el('div', `toast-in pointer-events-auto rounded-2xl border-2 ${tone} bg-surface px-4 py-2.5 text-[13px] font-extrabold shadow-lg max-w-[92%] text-center`, esc(msg));
  root.appendChild(n);
  setTimeout(() => { n.classList.add('toast-out'); setTimeout(() => n.remove(), 280); }, ms);
  while (root.children.length > 3) root.firstChild.remove();
}

function confetti(){
  const colors = ['#22c55e','#f59e0b','#8b5cf6','#ef4444','#38bdf8'];
  for (let i=0;i<26;i++){
    const b = el('div','confetti-bit');
    b.style.left = (Math.random()*100) + 'vw';
    b.style.background = colors[i % colors.length];
    b.style.setProperty('--dx', (Math.random()*120-60)+'px');
    b.style.setProperty('--rot', (Math.random()*900-450)+'deg');
    b.style.animationDuration = (1.5 + Math.random()*1.3)+'s';
    b.style.animationDelay = (Math.random()*.25)+'s';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 3200);
  }
}

/* ---------------- loop ---------------- */
let tickN = 0;
function tick(){
  tickN++;
  const settled = settleBets();
  const picked = settlePick();
  const chatter = botChatter();
  if (tickN % 30 === 0) dailyReset();
  const rotated = false;

  if (tickN % 5 === 0) refreshLive().then(changed => { if (changed) afterLive(); });
  if (tickN % 120 === 0) fillWeek();
  if (tickN % 20 === 0) settleStaleLive().then(changed => { if (changed) afterLive(); });

  const before = legCount();
  S.slip.legs = S.slip.legs.filter(l => { const g = gameById(l.gameId); return g && !gIsFinal(g); });
  const dropped = before !== legCount();
  if (dropped){
    save();
    toast(legCount() ? 'A leg went final and left your slip.' : 'Your slip cleared — those games are final.', 'bad');
    if (ui.sheet && ui.sheet.kind === 'slip' && !legCount()) closeSheet();
  }

  if (S.balance !== ui.lastBalance){ ui.lastBalance = S.balance; renderHeader(true); }

  const ae = document.activeElement;
  const typing = !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  const modalOpen = !$('#modalRoot').classList.contains('hidden');
  if (ui.onboard) return;                       // first-run flow owns the screen
  const scrolling = now() - lastScrollAt < 400;
  const changed = viewSignature() !== lastSig;
  if (!typing && !modalOpen && !scrolling && (changed || settled || picked || dropped)){
    renderMain(); renderSlipBar();
  }
  if (!typing) refreshSheetLive();
  if (settled || picked || chatter || rotated) save();
}

function afterLive(){
  const changed = settleBets();
  settlePick();
  const ae = document.activeElement;
  const typing = !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  if (!typing){ renderMain(); renderSlipBar(); }
  if (changed) renderHeader(true);
}

/* ---------------- boot ---------------- */
function boot(){
  S = load();
  ui.lastBalance = S.balance;
  applyTheme();
  installManifest();
  registerSW();

  if (window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (S.theme === 'system'){ applyTheme(); renderMain(); } };
    mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.installEvt = e; renderMain(); });

  checkStreakBreak();
  dailyReset();
  settleBets();
  S.slip.legs = S.slip.legs.filter(l => { const g = gameById(l.gameId); return g && !gIsFinal(g); });
  S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
  save();

  renderAll();
  renderDemoBar();
  $('#balancePill').onclick = () => go('you');
  $('#streakChip').onclick = () => go('league');

  refreshLive(true).then(() => { ensurePick(); afterLive(); fillWeek(true); });
  settleStaleLive().then(changed => { if (changed) afterLive(); });

  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    checkStreakBreak();
    dailyReset();
    refreshLive(true).then(() => afterLive());
    settleStaleLive().then(changed => { if (changed) afterLive(); });
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (ui.onboard) return;
    if (!$('#modalRoot').classList.contains('hidden')) closeModal();
    else if (ui.sheet) closeSheet();
  });

  if (!S.onboard.done) startOnboard(false);
}

boot();
})();
