  const m = Math.floor(ms/60000), s = Math.floor(ms%60000/1000);
  if (m >= 60) return Math.floor(m/60)+'h '+(m%60)+'m';
  if (m >= 1)  return m+'m '+String(s).padStart(2,'0')+'s';
  return s+'s';
}

/* odds helpers */
const americanToMult = a => a > 0 ? 1 + a/100 : 1 + 100/Math.abs(a);
const impliedProb    = a => a > 0 ? 100/(a+100) : Math.abs(a)/(Math.abs(a)+100);
const fmtAmerican    = a => (a > 0 ? '+' : '') + Math.round(a);
function probToAmerican(p){
  p = clamp(p, .04, .96);
  return p >= .5 ? -Math.round((p/(1-p))*100/5)*5 : Math.round(((1-p)/p)*100/5)*5;
}
const multToAmerican = m => m >= 2 ? Math.round((m-1)*100) : -Math.round(100/(m-1));
const fmtLine = n => (n > 0 ? '+' : '') + (Math.round(n*2)/2);
const logistic = x => 1/(1+Math.exp(-x));

/* ---------------- state ---------------- */
let S = null;
let ui = { tab:'home', sheet:null, feedFilter:'all', gamesFilter:'ALL', lastBalance:0, animate:false, scrollLock:0 };

function freshStats(){
  return { bets:0, wins:0, losses:0, pushes:0, cashouts:0, wagered:0, returned:0, profit:0,
           streak:0, bestStreak:0, biggestWin:0, biggestStake:0, dogWin:false, bailouts:0,
           parlayWins:0, propWins:0, peakBalance:START_BALANCE };
}

function freshState(){
  const s = {
    v: 2,
    profile: { name:'Rookie', avatar:'🦍', joined: now() },
    balance: START_BALANCE,
    bets: [],
    games: [],
    feed: [],
    board: seedBoard(),
    history: [{ t: now(), balance: START_BALANCE }],
    stats: freshStats(),
    slip: { legs: [], stake: 100 },
    lastBonus: 0,
    lastFeedPush: now(),
    seenBadges: []
  };
  s.games = makeSlate();
  s.feed  = seedFeed();
  return s;
}

function load(){
  try {
    const raw = localStorage.getItem(LS_KEY) || localStorage.getItem(LS_KEY_LEGACY);
    if (!raw) return freshState();
    const p = JSON.parse(raw);
    if (!p || typeof p.balance !== 'number') return freshState();

    p.v = 2;
    p.stats   = Object.assign(freshStats(), p.stats || {});
    p.profile = Object.assign({ name:'Rookie', avatar:'🦍', joined:now() }, p.profile || {});
    p.bets    = (Array.isArray(p.bets) ? p.bets : []).map(migrateBet).filter(Boolean);
    p.games   = (Array.isArray(p.games) && p.games.length) ? p.games.map(migrateGame) : makeSlate();
    p.feed    = Array.isArray(p.feed) ? p.feed : seedFeed();
    p.board   = (Array.isArray(p.board) && p.board.length) ? p.board : seedBoard();
    p.history = (Array.isArray(p.history) && p.history.length) ? p.history : [{ t:now(), balance:p.balance }];
    p.slip    = (p.slip && Array.isArray(p.slip.legs)) ? p.slip : { legs:[], stake:100 };
    p.seenBadges = Array.isArray(p.seenBadges) ? p.seenBadges : [];
    return p;
  } catch(e){ return freshState(); }
}

/* v1 tickets were single-market — wrap each as a one-leg bet */
function migrateBet(b){
  if (!b || typeof b !== 'object') return null;
  if (Array.isArray(b.legs)) return b;
  return {
    id: b.id || uid(),
    legs: [{
      gameId:b.gameId, league:b.league, matchup:b.matchup, matchupFull:b.matchupFull,
      key:(b.type||'ml')+':'+(b.side||'home'), type:b.type, side:b.side,
      line: b.line != null ? b.line : null, propId:null, label:b.label, sub:b.sub, odds:b.odds,
      status: b.status === 'active' ? 'open' : b.status,
      finalHome:b.finalHome, finalAway:b.finalAway
    }],
    stake:b.stake, odds:b.odds, mult:americanToMult(b.odds),
    toWin:b.toWin, payout:b.payout,
    status:b.status, placedAt:b.placedAt, settledAt:b.settledAt, cashValue:null
  };
}
/* v1 games had no half lines, props, first-score or method markets */
function migrateGame(g){
  if (!g || typeof g !== 'object') return g;
  if (g.half === undefined)   g.half = null;
  if (g.props === undefined)  g.props = [];
  if (g.method === undefined) g.method = null;
  if (g.first === undefined)  g.first = null;
  return g;
}

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); localStorage.removeItem(LS_KEY_LEGACY); }
    catch(e){ /* storage blocked or full — the app still runs in memory */ }
  }, 120);
}

function pushHistory(){
  const h = S.history, last = h[h.length-1];
  if (!last || last.balance !== S.balance) h.push({ t: now(), balance: S.balance });
  if (h.length > 80) S.history = h.slice(-80);
}

/* ---------------- game generation ---------------- */
function recStr(){ return (3 + Math.floor(Math.random()*12)) + '-' + (1 + Math.floor(Math.random()*11)); }
const playerName = () => pick(FIRST_NAMES) + ' ' + pick(LAST_NAMES);

function makeGame(league, homeT, awayT, startsAt){
  const L = LEAGUES[league];
  const pHome = clamp(.5 + (Math.random()*.44 - .22) + .03, .22, .82);
  const vig = .026;

  const g = {
    id: uid(), league, startsAt, pHome,
    home: { name:homeT[0], abbr:homeT[1], color:homeT[2], rec:recStr() },
    away: { name:awayT[0], abbr:awayT[1], color:awayT[2], rec:recStr() },
    ml: { home: probToAmerican(pHome + vig), away: probToAmerican(1 - pHome + vig) },
    spread:null, total:null, half:null, first:null, method:null, props:[],
    events: [], settled:false
  };

  if (league !== 'UFC'){
    const raw = (pHome - .5) * L.spread * 2;
    let line = Math.round(raw*2)/2;
    if (line === 0) line = raw >= 0 ? .5 : -.5;          // pick'em keeps the hook on the ML favorite
    g.spread = { home:-line, away:line, odds:-110 };

    const wide = league === 'NBA' || league === 'NFL';
    const tot = wide ? Math.round(L.base + (Math.random()*14-7))
                     : Math.round((L.base + (Math.random()*2-1))*2)/2;
    g.total = { line: tot, odds:-110 };

    const pFirst = pHome*.5 + .25;                       // first score is close to a coin flip
    g.first = { home: probToAmerican(pFirst + vig), away: probToAmerican(1-pFirst + vig) };

    const h = L.half;
    let hLine = Math.round(-g.spread.home * h.t * 2)/2;
    if (hLine === 0) hLine = g.spread.home <= 0 ? .5 : -.5;
    const hTot = wide ? Math.round(tot * h.t) : Math.round(tot * h.t * 2)/2;
    g.half = { label:h.label, t:h.t, spread:{ home:-hLine, away:hLine, odds:-110 }, total:{ line:hTot, odds:-110 } };
  } else {
    g.method = { finish: probToAmerican(.55 + vig), decision: probToAmerican(.45 + vig) };
  }

  g.events = makeTimeline(league, pHome, g.total ? g.total.line : L.base);
  g.props  = makeProps(g);
  return g;
}

function makeTimeline(league, pHome, totalLine){
  const ev = [];
  if (league === 'UFC'){
    const finish = Math.random() < .55;
    ev.push({ t: finish ? .18 + Math.random()*.7 : 1, side: Math.random() < pHome ? 'home' : 'away', pts:1 });
    return ev;
  }
  const target = Math.max(1, Math.round(totalLine + (Math.random()*totalLine*.34 - totalLine*.17)));
  const unit   = league === 'NBA' ? 2.4 : league === 'NFL' ? 5.6 : 1;
  const count  = Math.max(1, Math.round(target/unit));
  for (let i=0;i<count;i++){
    const side = Math.random() < (pHome*.55 + .225) ? 'home' : 'away';
    let pts = 1;
    if (league === 'NBA') pts = Math.random() < .3 ? 3 : Math.random() < .2 ? 1 : 2;
    if (league === 'NFL') pts = Math.random() < .68 ? 7 : 3;
    ev.push({ t: Math.random()*.985, side, pts });
  }
  ev.sort((a,b) => a.t - b.t);
  return ev;
}

/* a player's night is a sampled share of their team's scoring plays */
function makeProps(g){
  const L = LEAGUES[g.league];
  if (!L.prop) return [];
  const out = [];
  const shareBand = g.league === 'NBA' ? [.13,.11] : [.22,.2];   // NBA has far more scoring plays to share
  for (const team of ['away','home']){
    const share = shareBand[0] + Math.random()*shareBand[1];
    const evs = [];
    for (const e of g.events){
      if (e.side !== team || Math.random() > share) continue;
      const v = g.league === 'NBA' ? e.pts : g.league === 'NFL' ? (e.pts === 7 ? 1 : 0) : 1;
      if (v > 0) evs.push({ t:e.t, v });
    }
    const final = evs.reduce((a,c) => a + c.v, 0);
    const line  = Math.max(0, Math.floor(final + (Math.random()*2.4 - 1.2))) + .5;   // .5 hook — props never push
    out.push({ id:uid(), name:playerName(), team, stat:L.prop, line, over:-115, under:-105, events:evs });
  }
  return out;
}

function newMatchup(league, startsAt){
  const pool = TEAMS[league].slice();
  const a = pool.splice(Math.floor(Math.random()*pool.length),1)[0];
  const b = pool.splice(Math.floor(Math.random()*pool.length),1)[0];
  return makeGame(league, a, b, startsAt);
}

function makeSlate(){
  const t = now();
  const plan = [
    ['NBA', -SIM_MS*.55], ['NFL', -SIM_MS*.28], ['NHL', -SIM_MS*.12],
    ['NBA',  20*1000],    ['NFL',  70*1000],    ['SOCCER', 150*1000],
    ['MLB',  240*1000],   ['UFC',  330*1000],   ['NBA',    430*1000],
    ['NFL',  540*1000],   ['SOCCER', 660*1000], ['NHL',    800*1000],
    ['MLB',  960*1000],   ['UFC',  1150*1000]
  ];
  return plan.map(([league, offset]) => newMatchup(league, t + offset));
}

/* ---------------- live game math ---------------- */
function progressOf(g){
  const dt = now() - g.startsAt;
  return dt <= 0 ? 0 : clamp(dt / SIM_MS, 0, 1);
}
const isLive  = g => { const p = progressOf(g); return p > 0 && p < 1; };
const isFinal = g => progressOf(g) >= 1;
const isPre   = g => progressOf(g) <= 0;

function scoreAt(g, t){
  let home = 0, away = 0;
  for (const e of g.events){ if (e.t <= t) (e.side === 'home' ? (home += e.pts) : (away += e.pts)); }
  return { home, away };
}
const scoreOf    = g => scoreAt(g, progressOf(g));
const finalScore = g => scoreAt(g, 1);

function propStatAt(prop, t){
  let v = 0;
  for (const e of prop.events){ if (e.t <= t) v += e.v; }
  return v;
}

function clockLabel(g){
  const L = LEAGUES[g.league];
  const p = progressOf(g);
  if (p <= 0) return null;
  if (p >= 1) return 'FINAL';
  const per = clamp(Math.floor(p * L.periods) + 1, 1, L.periods);
  const within = p * L.periods - (per - 1);

  if (g.league === 'MLB')    return (within < .5 ? 'TOP ' : 'BOT ') + per;
  if (g.league === 'SOCCER') return (Math.floor(p * 90) + 1) + "'";
  const left = L.periodMin * (1 - within);
  const mmss = Math.floor(left) + ':' + String(Math.floor((left%1)*60)).padStart(2,'0');
  if (g.league === 'UFC') return 'R' + per + ' · ' + mmss;
  return (g.league === 'NHL' ? ['1st','2nd','3rd'][per-1] : 'Q'+per) + ' · ' + mmss;
}

/* ---------------- markets ---------------- */
/* a market is {key,type,side,label,sub,odds,line,propId} — `key` identifies a leg within a game */
function marketRows(g){
  const rows = [];
  rows.push({ group:'Moneyline', row:[
    { key:'ml:away', type:'ml', side:'away', label:g.away.abbr+' ML', sub:'Moneyline', odds:g.ml.away },
    { key:'ml:home', type:'ml', side:'home', label:g.home.abbr+' ML', sub:'Moneyline', odds:g.ml.home }
  ]});
  if (g.spread) rows.push({ group:'Spread', row:[
    { key:'spread:away', type:'spread', side:'away', label:g.away.abbr+' '+fmtLine(g.spread.away), sub:'Spread', odds:g.spread.odds, line:g.spread.away },
    { key:'spread:home', type:'spread', side:'home', label:g.home.abbr+' '+fmtLine(g.spread.home), sub:'Spread', odds:g.spread.odds, line:g.spread.home }
  ]});
  if (g.total) rows.push({ group:'Total Points', row:[
    { key:'total:over',  type:'total', side:'over',  label:'Over '+g.total.line,  sub:'Total', odds:g.total.odds, line:g.total.line },
    { key:'total:under', type:'total', side:'under', label:'Under '+g.total.line, sub:'Total', odds:g.total.odds, line:g.total.line }
  ]});
  if (g.method) rows.push({ group:'Method of Victory', row:[
    { key:'method:finish',   type:'method', side:'finish',   label:'Finish',   sub:'Method', odds:g.method.finish },
    { key:'method:decision', type:'method', side:'decision', label:'Decision', sub:'Method', odds:g.method.decision }
  ]});
  if (g.first) rows.push({ group:'First Team to Score', row:[
    { key:'first:away', type:'first', side:'away', label:g.away.abbr, sub:'First score', odds:g.first.away },
    { key:'first:home', type:'first', side:'home', label:g.home.abbr, sub:'First score', odds:g.first.home }
  ]});
  if (g.half){
    const h = g.half;
    rows.push({ group:h.label + ' Spread & Total', row:[
      { key:'spread_h:away', type:'spread_h', side:'away', label:g.away.abbr+' '+fmtLine(h.spread.away), sub:h.label+' spread', odds:h.spread.odds, line:h.spread.away },
      { key:'spread_h:home', type:'spread_h', side:'home', label:g.home.abbr+' '+fmtLine(h.spread.home), sub:h.label+' spread', odds:h.spread.odds, line:h.spread.home }
    ]});
    rows.push({ group:h.label + ' Spread & Total', row:[
      { key:'total_h:over',  type:'total_h', side:'over',  label:'Over '+h.total.line,  sub:h.label+' total', odds:h.total.odds, line:h.total.line },
      { key:'total_h:under', type:'total_h', side:'under', label:'Under '+h.total.line, sub:h.label+' total', odds:h.total.odds, line:h.total.line }
    ]});
  }
  for (const pr of (g.props || [])){
    rows.push({ group:'Player Props', heading: pr.name+' · '+pr.stat+' '+pr.line, row:[
      { key:'prop:over:'+pr.id,  type:'prop', side:'over',  propId:pr.id, line:pr.line, odds:pr.over,
        label:'Over '+pr.line,  sub:pr.name+' '+pr.stat },
      { key:'prop:under:'+pr.id, type:'prop', side:'under', propId:pr.id, line:pr.line, odds:pr.under,
        label:'Under '+pr.line, sub:pr.name+' '+pr.stat }
    ]});
  }

  // live re-pricing; a row whose either side has closed comes off the board
  const out = [];
  for (const r of rows){
    const priced = priceRow(g, r.row);
    if (priced) out.push(Object.assign({}, r, { row: priced }));
  }
  return out;
}

/* the two-to-six buttons shown on a scoreboard card */
function quickMarkets(g){
  const want = ['Moneyline','Spread','Total Points','Method of Victory'];
  return marketRows(g).filter(r => want.includes(r.group)).flatMap(r => r.row);
}

/* grouped markets for the game detail sheet */
function marketGroups(g){
  const groups = [];
  for (const r of marketRows(g)){
    let grp = groups.find(x => x.title === r.group);
    if (!grp){ grp = { title:r.group, rows:[] }; groups.push(grp); }
    if (r.heading) grp.rows.push({ heading:r.heading });
    grp.rows.push(r.row);
  }
  return groups;
}

/* Once a game is live the opening price is stale — re-price from the live win probability,
   and pull a market off the board entirely once it is effectively decided. */
const LIVE_VIG = .026;
function livePrice(g, m){
  if (!isLive(g)) return m.odds;
  const prob = legWinProb(m, g);
  if (prob >= .97 || prob <= .03) return null;      // decided (or close enough) — no longer offered
  return probToAmerican(prob + LIVE_VIG);
}
/* prices a two-sided market; returns null if either side has closed */
function priceRow(g, row){
  const out = [];
  for (const m of row){
    const odds = livePrice(g, m);
    if (odds === null) return null;
    out.push(Object.assign({}, m, { odds }));
  }
  return out;
}

function findMarket(g, key){
  for (const r of marketRows(g)){
    const hit = r.row.find(m => m.key === key);
    if (hit) return hit;
  }
  return null;
}

/* ---------------- bet slip ---------------- */
const legCount = () => S.slip.legs.length;
const hasLeg = (gameId, key) => S.slip.legs.some(l => l.gameId === gameId && l.key === key);
const slipMult = () => S.slip.legs.reduce((m, l) => m * americanToMult(l.odds), 1);

function toggleLeg(gameId, key){
  const g = S.games.find(x => x.id === gameId);
  if (!g) return;
  if (isFinal(g)) return toast('That game is already final.', 'bad');

  const legs = S.slip.legs;
  const at = legs.findIndex(l => l.gameId === gameId && l.key === key);
  if (at >= 0){ legs.splice(at, 1); save(); renderAll(); return; }
  if (legs.length >= MAX_LEGS) return toast('Max ' + MAX_LEGS + ' legs on a parlay.', 'bad');

  const m = findMarket(g, key);
  if (!m) return;

  // one leg per game — a second pick from the same game replaces the first
  const sameGame = legs.findIndex(l => l.gameId === gameId);
  const replaced = sameGame >= 0;
  if (replaced) legs.splice(sameGame, 1);

  legs.push({
    gameId, key, league:g.league,
    matchup:g.away.abbr+' @ '+g.home.abbr, matchupFull:g.away.name+' @ '+g.home.name,
    type:m.type, side:m.side, line: m.line != null ? m.line : null, propId:m.propId || null,
    label:m.label, sub:m.sub, odds:m.odds, status:'open'
  });
  save();
  if (replaced) toast('Swapped your pick on ' + g.away.abbr + ' @ ' + g.home.abbr, 'gold', 2200);
  renderAll();
}

function clearSlip(){ S.slip.legs = []; save(); closeSheet(); renderAll(); }

function placeBet(){
  const legs = S.slip.legs;
  if (!legs.length) return;

  for (const l of legs){
    const g = S.games.find(x => x.id === l.gameId);
    if (!g || isFinal(g)){
      S.slip.legs = legs.filter(x => x.gameId !== l.gameId);
      save(); renderAll(); if (legCount()) renderSheet(); else closeSheet();
      return toast('A leg went final and was removed from your slip.', 'bad');
    }
  }

  const stake = Math.floor(S.slip.stake);
  if (!Number.isFinite(stake) || stake < MIN_BET) return toast('Minimum bet is ' + MIN_BET + ' coins.', 'bad');
  if (stake > S.balance) return toast("You don't have enough coins.", 'bad');

  const mult = slipMult();
  const bet = {
    id: uid(),
    legs: legs.map(l => Object.assign({}, l, { status:'open' })),
    stake,
    odds: multToAmerican(mult),
    mult,
    payout: Math.round(stake * mult),
    toWin: Math.round(stake * mult - stake),
    status:'active', placedAt:now(), settledAt:null, cashValue:null
  };

  S.balance -= stake;
  S.bets.unshift(bet);
  S.stats.bets++;
  S.stats.wagered += stake;
  S.stats.biggestStake = Math.max(S.stats.biggestStake, stake);
  S.slip = { legs: [], stake: clamp(Math.floor(S.balance/10), MIN_BET, 100) };
  pushHistory(); checkBadges(); save();

  closeSheet();
  const what = bet.legs.length > 1 ? bet.legs.length + '-leg parlay' : bet.legs[0].label;
  toast('Bet placed · ' + fmt(stake) + ' 🪙 on ' + what, 'good');
  if (stake >= 750 || bet.legs.length >= 4){
    addFeed({ user:S.profile.name, avatar:S.profile.avatar, me:true, kind:'bet',
      text:'just put ' + fmt(stake) + ' coins on ' +
        (bet.legs.length > 1 ? 'a ' + bet.legs.length + '-leg parlay at ' + fmtAmerican(bet.odds)
                             : bet.legs[0].label + ' (' + bet.legs[0].matchup + ')') + '. Pray for them.' });
  }
  renderAll();
}

/* ---------------- grading ---------------- */
function gradeLeg(leg, g){
  if (leg.type === 'ml'){
    const sc = finalScore(g);
    if (sc.home === sc.away) return 'push';
    return leg.side === (sc.home > sc.away ? 'home' : 'away') ? 'won' : 'lost';
  }
  if (leg.type === 'spread' || leg.type === 'spread_h'){
    const s = scoreAt(g, leg.type === 'spread_h' ? (g.half ? g.half.t : .5) : 1);
    const mine  = leg.side === 'home' ? s.home : s.away;
    const other = leg.side === 'home' ? s.away : s.home;
    const adj = mine + leg.line;
    if (adj === other) return 'push';
    return adj > other ? 'won' : 'lost';
  }
  if (leg.type === 'total' || leg.type === 'total_h'){
    const s = scoreAt(g, leg.type === 'total_h' ? (g.half ? g.half.t : .5) : 1);
    const tot = s.home + s.away;
    if (tot === leg.line) return 'push';
    return (leg.side === 'over' ? tot > leg.line : tot < leg.line) ? 'won' : 'lost';
  }
  if (leg.type === 'first'){
    if (!g.events.length) return 'push';
    return g.events[0].side === leg.side ? 'won' : 'lost';
  }
  if (leg.type === 'method'){
    const finished = !!(g.events.length && g.events[0].t < 1);
    return (leg.side === 'finish') === finished ? 'won' : 'lost';
  }
  if (leg.type === 'prop'){
    const pr = (g.props || []).find(p => p.id === leg.propId);
    if (!pr) return 'push';
    const v = propStatAt(pr, 1);
    if (v === leg.line) return 'push';
    return (leg.side === 'over' ? v > leg.line : v < leg.line) ? 'won' : 'lost';
  }
  return 'lost';
}

function settleBets(){
  let changed = false;

  for (const b of S.bets){
    if (b.status !== 'active') continue;

    let anyLost = false, allDone = true;

    for (const leg of b.legs){
      if (leg.status && leg.status !== 'open'){ if (leg.status === 'lost') anyLost = true; continue; }
      const g = S.games.find(x => x.id === leg.gameId);
      if (!g){ leg.status = 'push'; changed = true; continue; }   // game fell off the board — void that leg
      if (!isFinal(g)){ allDone = false; continue; }
      leg.status = gradeLeg(leg, g);
      const fs = finalScore(g);
      leg.finalHome = fs.home; leg.finalAway = fs.away;
      if (leg.status === 'lost') anyLost = true;
      changed = true;
    }

    if (anyLost){
      b.status = 'lost';
      b.settledAt = now();
      S.stats.losses++;
      S.stats.profit -= b.stake;
      S.stats.streak = 0;
      const dead = b.legs.find(l => l.status === 'lost');
      toast('Lost · ' + (b.legs.length > 1 ? b.legs.length + '-leg parlay died on ' + dead.label : dead.label) + ' (−' + fmt(b.stake) + ' 🪙)', 'bad', 3600);
      changed = true;
    } else if (allDone){
      const live = b.legs.filter(l => l.status === 'won');
      b.settledAt = now();
      if (!live.length){
        b.status = 'push';
        S.balance += b.stake;
        S.stats.pushes++;
        toast('Push · ' + fmt(b.stake) + ' 🪙 refunded', 'gold');
      } else {
        const mult = live.reduce((m, l) => m * americanToMult(l.odds), 1);   // pushed legs drop out of the parlay
        const payout = Math.round(b.stake * mult);
        b.status = 'won';
        b.payout = payout;
        b.toWin = payout - b.stake;
        S.balance += payout;
        S.stats.wins++;
        S.stats.returned += payout;
        S.stats.profit += b.toWin;
        S.stats.streak = Math.max(0, S.stats.streak) + 1;
        S.stats.bestStreak = Math.max(S.stats.bestStreak, S.stats.streak);
        S.stats.biggestWin = Math.max(S.stats.biggestWin, b.toWin);
        if (b.legs.some(l => l.odds >= 150)) S.stats.dogWin = true;
        if (b.legs.length >= 3) S.stats.parlayWins++;
        if (b.legs.some(l => l.type === 'prop')) S.stats.propWins++;
        toast('WINNER! +' + fmt(payout) + ' 🪙 · ' + (b.legs.length > 1 ? b.legs.length + '-leg parlay' : b.legs[0].label), 'good', 4200);
        confetti();
        if (b.toWin >= 400 || b.legs.length >= 3){
          addFeed({ user:S.profile.name, avatar:S.profile.avatar, me:true, kind:'win', amount:payout,
            text:'cashed ' + (b.legs.length > 1 ? 'a ' + b.legs.length + '-leg parlay' : b.legs[0].label) +
                 ' for ' + fmt(payout) + ' coins. ' + (b.odds > 0 ? 'Dog money.' : 'Chalk is chalk.') });
        }
      }
      changed = true;
    }
    S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
  }

  if (changed){ pushHistory(); checkBadges(); save(); }
  return changed;
}

/* ---------------- live cash-out ---------------- */
/* A rough live win probability per leg. Deliberately simple — it's an estimate, and labelled as one. */
function legWinProb(leg, g){
  if (!g) return 0;
  if (leg.status === 'won') return 1;
  if (leg.status === 'lost') return 0;

  const L = LEAGUES[g.league];
  const p = progressOf(g);
  const prior = impliedProb(leg.odds);
  if (p <= 0) return prior;
  if (isFinal(g)) return gradeLeg(leg, g) === 'lost' ? 0 : 1;

  const endT = (leg.type === 'spread_h' || leg.type === 'total_h') ? (g.half ? g.half.t : .5) : 1;
  if (p >= endT) return gradeLeg(leg, g) === 'lost' ? 0 : 1;     // half/period markets settle early
  const r = clamp((endT - p) / endT, 0, 1);                      // share of this market's window still to come
  const scale = Math.max(1, (g.total ? g.total.line : L.base)) * endT;
  const sigma = Math.max(.9, scale * .22 * Math.sqrt(r));
  const s = scoreAt(g, p);

  if (g.league === 'UFC' && leg.type === 'ml'){
    const decided = g.events.length && g.events[0].t <= p;
    return decided ? (g.events[0].side === leg.side ? 1 : 0) : prior;
  }
  if (leg.type === 'ml' || leg.type === 'spread' || leg.type === 'spread_h'){
    const mine  = leg.side === 'home' ? s.home : s.away;
    const other = leg.side === 'home' ? s.away : s.home;
    const edge  = mine - other + (leg.line || 0);
    return clamp(logistic(edge / (sigma * .62)), .01, .99);
  }
  if (leg.type === 'total' || leg.type === 'total_h'){
    const projected = s.home + s.away + scale * r;
    const edge = (projected - leg.line) * (leg.side === 'over' ? 1 : -1);
    return clamp(logistic(edge / (sigma * .62)), .01, .99);
  }
  if (leg.type === 'first'){
    return (g.events.length && g.events[0].t <= p) ? (g.events[0].side === leg.side ? 1 : 0) : prior;
  }
  if (leg.type === 'method'){
    const pFinish = clamp(.55 * r + .04, .02, .95);              // the longer it runs, the likelier the final bell
    return leg.side === 'finish' ? pFinish : 1 - pFinish;
  }
  if (leg.type === 'prop'){
    const pr = (g.props || []).find(x => x.id === leg.propId);
    if (!pr) return prior;
    const projected = propStatAt(pr, p) + (leg.line + .5) * r;
    const edge = (projected - leg.line) * (leg.side === 'over' ? 1 : -1);
    return clamp(logistic(edge / Math.max(.6, (leg.line + 1) * .5 * Math.sqrt(r))), .01, .99);
  }
  return prior;
}

function cashOutValue(b){
  if (b.status !== 'active') return 0;
  let p = 1;
  for (const leg of b.legs) p *= legWinProb(leg, S.games.find(g => g.id === leg.gameId));
  return Math.max(0, Math.floor(b.payout * p * CASHOUT_MARGIN));
}

function cashOut(betId){
  const b = S.bets.find(x => x.id === betId);
  if (!b || b.status !== 'active') return;
  const value = cashOutValue(b);
  if (value < 1) return toast('This ticket is worth nothing right now.', 'bad');

  confirmModal('Cash out for ' + fmt(value) + ' 🪙?',
    'You risked ' + fmt(b.stake) + ' and this ticket is still live for ' + fmt(b.payout) + '. Taking it now ends the bet — ' +
    (value >= b.stake ? 'a ' + fmt(value - b.stake) + ' coin profit' : 'a ' + fmt(b.stake - value) + ' coin loss') +
    ', however it would have landed. The price is live and keeps moving with the game until you confirm.',
    'Cash out', () => {
      if (b.status !== 'active') return;
      const v = cashOutValue(b);                 // re-price at the moment of confirmation
      b.status = 'cashed';
      b.cashValue = v;
      b.settledAt = now();
      S.balance += v;
      S.stats.cashouts++;
      S.stats.returned += v;
      S.stats.profit += (v - b.stake);
      S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
      pushHistory(); checkBadges(); save();
      toast('Cashed out for ' + fmt(v) + ' 🪙', v >= b.stake ? 'good' : 'gold');
      renderAll();
    }, 'bg-gold text-ink-900');
}

/* ---------------- balance ---------------- */
const bonusReady  = () => S.balance <= 0 || (now() - S.lastBonus) > BONUS_COOLDOWN;
const bonusLeftMs = () => BONUS_COOLDOWN - (now() - S.lastBonus);

function claimBonus(){
  if (!bonusReady()) return toast('Next bonus in ' + countdown(bonusLeftMs()), 'bad');
  const broke = S.balance <= 0;
  const amt = broke ? DAILY_BONUS + 250 : DAILY_BONUS;
  S.balance += amt;
  S.lastBonus = now();
  if (broke) S.stats.bailouts++;
  S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
  pushHistory(); checkBadges(); save();
  toast('+' + fmt(amt) + ' 🪙 ' + (broke ? 'bailout' : 'daily bonus') + ' claimed!', 'good');
  confetti();
  renderAll();
}

function hardReset(){
  confirmModal('Reset everything?',
    'Wipes your balance, bets, history and stats back to a fresh ' + fmt(START_BALANCE) + ' coin account. This cannot be undone.',
    'Reset account', () => {
      S = freshState();
      ui.lastBalance = S.balance;
      save(); renderAll();
      toast('Fresh account · ' + fmt(START_BALANCE) + ' 🪙', 'good');
    });
}

/* ---------------- derived ---------------- */
function derived(){
  const st = S.stats;
  const settled = st.wins + st.losses;
  const active  = S.bets.filter(b => b.status === 'active');
  return {
    settled, active,
    winRate: settled ? (st.wins/settled*100) : 0,
    atRisk: active.reduce((a,b) => a + b.stake, 0),
    toWin:  active.reduce((a,b) => a + b.toWin, 0),
    roi: st.wagered ? (st.profit/st.wagered*100) : 0
  };
}

/* ---------------- badges ---------------- */
function unlockedBadges(){ return BADGES.filter(b => { try { return !!b.test(S); } catch(e){ return false; } }); }
function checkBadges(){
  for (const b of unlockedBadges()){
    if (!S.seenBadges.includes(b.id)){
      S.seenBadges.push(b.id);
      setTimeout(() => toast('Badge unlocked ' + b.icon + ' ' + b.name, 'gold', 4000), 500);
    }
  }
}

function addFeed(p){
  S.feed.unshift(Object.assign({ id:uid(), t:now(), likes: p.me ? Math.floor(Math.random()*6) : Math.floor(Math.random()*30)+3, liked:false, kind:'post', amount:0 }, p));

}

function botChatter(){
  if (now() - S.lastFeedPush < 22000) return false;
  S.lastFeedPush = now();
  const [name, av] = pick(BOT_NAMES);
  const g = pick(S.games);
  const amt = (1 + Math.floor(Math.random()*24)) * 100;

function boardRows(){
  const t = now()/1000;
  const rows = S.board.map(b => ({
    name:b.name, avatar:b.avatar, me:false,
    coins: Math.max(200, Math.round(b.coins + Math.sin(t/37 + b.drift)*b.coins*0.05)),
    w:b.w, l:b.l
  }));
  const st = S.stats;
  rows.push({ name:S.profile.name, avatar:S.profile.avatar, me:true, coins:Math.round(S.balance + derived().atRisk), w:st.wins, l:st.losses });
  rows.sort((a,b) => b.coins - a.coins);
  return rows;
}

================================================================= */
const TABS = [['home','Home','🏠'],['games','Games','📺'],['feed','Feed','💬'],['ranks','Ranks','🏆'],['profile','Profile','👤']];

function renderTabs(){
  const bar = $('#tabbar');
  bar.innerHTML = TABS.map(([id,label,icon]) => `
    <button data-tab="${id}" class="press flex flex-col items-center gap-1 py-2.5 ${ui.tab===id?'tab-active':'text-slate-500'}">
      <span class="tab-ico text-[19px] leading-none">${icon}</span>
      <span class="text-[10px] font-semibold tracking-wide">${label}</span>
    </button>`).join('');
  bar.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
}

function go(tab){
  // a smooth scroll would be fought by the next refresh tick restoring the old offset,
  // so tab changes jump to the top and only a re-tap of the active tab animates
  if (ui.tab === tab){ ui.scrollLock = now() + 800; window.scrollTo({ top:0, behavior:'smooth' }); return; }
  ui.tab = tab;
  ui.animate = true;
  renderTabs(); renderMain(); renderSlipBar();
  ui.animate = false;
  window.scrollTo(0, 0);
}

function renderBalance(pop){
  const t = $('#balanceText');
  t.textContent = fmt(S.balance);
  if (pop){ t.classList.remove('coin-pop'); void t.offsetWidth; t.classList.add('coin-pop'); }
}

function renderAll(){
  ui.animate = true;
  renderTabs(); renderBalance(true); renderMain(); renderSlipBar();
  ui.animate = false;
}

function renderMain(){
  const m = $('#main');
  const scrollY = window.scrollY;
  const animate = ui.animate;
  m.innerHTML = '';
  const view = el('div', animate ? 'view' : '');
  view.innerHTML = ({ home:viewHome, games:viewGames, feed:viewFeed, ranks:viewRanks, profile:viewProfile }[ui.tab] || viewHome)();
  if (!animate) view.querySelectorAll('.stagger').forEach(n => n.classList.remove('stagger'));
  m.appendChild(view);
  wireMain();
  if (!animate && scrollY > 0 && now() > (ui.scrollLock || 0)) window.scrollTo(0, scrollY);
}

function sparkline(){
  const pts = S.history.slice(-40);
  if (pts.length < 2) return `<div class="h-28 grid place-items-center text-[12px] text-slate-600">Place a few bets to build your chart.</div>`;
  const vals = pts.map(p => p.balance);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 1;
  const W = 300, H = 96;
  const xy = vals.map((v,i) => [ (i/(vals.length-1))*W, H - ((v-min)/span)*(H-10) - 5 ]);
  const line = xy.map(([x,y],i) => (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)).join(' ');
  const up = vals[vals.length-1] >= vals[0];
  const c = up ? '#22e584' : '#ff5470';
  return `
  <svg viewBox="0 0 ${W} ${H}" class="w-full h-28" preserveAspectRatio="none">
    <defs><linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c}" stop-opacity=".35"/><stop offset="100%" stop-color="${c}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${line} L ${W} ${H} L 0 ${H} Z" fill="url(#sparkFill)"/>
    <path d="${line}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${xy[xy.length-1][0].toFixed(1)}" cy="${xy[xy.length-1][1].toFixed(1)}" r="4" fill="${c}"/>
  </svg>
  <div class="flex justify-between text-[10px] text-slate-600 mt-1">
    <span>low ${fmt(min)}</span><span class="text-slate-500">balance over time</span><span>high ${fmt(max)}</span>
  </div>`;
}

/* ---------- wiring ---------- */
function wireMain(){
  const m = $('#main');
  m.querySelectorAll('[data-bet]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleLeg(b.dataset.bet, b.dataset.key); });
  m.querySelectorAll('[data-game]').forEach(b => b.onclick = () => openGameSheet(b.dataset.game));
  m.querySelectorAll('[data-cash]').forEach(b => b.onclick = () => cashOut(b.dataset.cash));
  m.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => go(b.dataset.goto));
  m.querySelectorAll('[data-league]').forEach(b => b.onclick = () => { ui.gamesFilter = b.dataset.league; renderMain(); });
  m.querySelectorAll('[data-feed]').forEach(b => b.onclick = () => { ui.feedFilter = b.dataset.feed; renderMain(); });
  m.querySelectorAll('[data-like]').forEach(b => b.onclick = () => {
    const p = S.feed.find(x => x.id === b.dataset.like); if (!p) return;
    p.liked = !p.liked; p.likes += p.liked ? 1 : -1; save(); renderMain();
  });

  const bonus  = $('#bonusBtn');  if (bonus)  bonus.onclick  = claimBonus;
  const bonus2 = $('#claimBtn2'); if (bonus2) bonus2.onclick = claimBonus;
  const reset  = $('#resetBtn');  if (reset)  reset.onclick  = hardReset;
  const en = $('#editName');      if (en) en.onclick = nameModal;
  const ea = $('#editAvatar');    if (ea) ea.onclick = avatarModal;
  const brag = $('#brag');        if (brag) brag.onclick = bragModal;
}

function wireSheet(){
  const root = $('#sheetRoot');

  root.querySelectorAll('[data-bet]').forEach(b => b.onclick = () => {
    toggleLeg(b.dataset.bet, b.dataset.key);
    if (ui.sheet && ui.sheet.kind === 'game') renderSheet();
  });
  root.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
    const [gameId, key] = b.dataset.drop.split('|');
    S.slip.legs = S.slip.legs.filter(l => !(l.gameId === gameId && l.key === key));
    save();
    if (!legCount()) closeSheet(); else renderSheet();
    renderAll();
  });

  const more    = $('#addMore');    if (more)    more.onclick    = () => { closeSheet(); go('games'); };
  const confirm = $('#confirmBet'); if (confirm) confirm.onclick = placeBet;
  const clear   = $('#clearStake'); if (clear)   clear.onclick   = () => { S.slip.stake = 0; renderSheet(); const i = $('#stakeInput'); if (i) i.focus(); };

  root.querySelectorAll('[data-stake]').forEach(b => b.onclick = () => {
    const v = b.dataset.stake;
    S.slip.stake = v === 'max' ? Math.floor(S.balance)
                               : clamp(Math.floor(S.slip.stake||0) + Number(v), 0, Math.floor(S.balance));
    save(); renderSheet();
  });

  const input = $('#stakeInput');
  if (input){
    input.oninput = () => {
      const v = parseInt(input.value.replace(/\D/g,''), 10);
      S.slip.stake = Number.isFinite(v) ? v : 0;
      updateSlipNumbers();
    };
    input.onkeydown = e => {
      if (e.key !== 'Enter') return;
      input.blur();
      const v = Math.floor(S.slip.stake || 0);
      if (v >= MIN_BET && v <= S.balance) placeBet();
    };
  }
}

/* keeps the payout math live while typing, without rebuilding the sheet */
function updateSlipNumbers(){
  if (!ui.sheet || ui.sheet.kind !== 'slip') return;
  const mult = slipMult();
  const stake = clamp(Math.floor(S.slip.stake||0), 0, 1e9);
  const payout = Math.round(stake * mult);
  const bad = stake < MIN_BET || stake > S.balance;

  const set = (id, txt) => { const n = document.getElementById(id); if (n) n.textContent = txt; };
  set('slipRisk',   fmt(stake) + ' 🪙');
  set('slipToWin',  '+' + fmt(Math.max(0, payout - stake)) + ' 🪙');
  set('slipPayout', fmt(payout) + ' 🪙');

  const warn = $('#slipWarn');
  if (warn) warn.textContent = stake > S.balance ? 'Not enough coins — you have ' + fmt(S.balance) + '.'
    : (stake && stake < MIN_BET) ? 'Minimum bet is ' + MIN_BET + ' coins.' : '';

  const btn = $('#confirmBet');
  if (btn){
    btn.disabled = bad;
    btn.textContent = bad ? 'Enter a valid wager' : 'Place bet · ' + fmt(stake) + ' 🪙';
    btn.className = 'press mt-3 w-full rounded-2xl py-4 font-black text-[15px] ' + (bad
      ? 'bg-ink-600 text-slate-500 border border-white/10'
      : 'bg-gradient-to-r from-neon to-emerald-500 text-ink-900 shadow-xl shadow-neon/25');
  }
}

/* patches the live line inside an open game sheet instead of rebuilding it under the user's finger */
function refreshSheetLive(){
  if (!ui.sheet || ui.sheet.kind !== 'game') return;
  const g = S.games.find(x => x.id === ui.sheet.gameId);
  if (!g) return closeSheet();
  const n = $('#sheetLive');
  if (!n) return;
  if (isFinal(g)){ renderSheet(); return; }          // markets close — rebuild once
  const sc = scoreOf(g);
  n.innerHTML = isLive(g)
    ? `<span class="text-flame font-semibold">LIVE ${esc(g.away.abbr)} ${sc.away}–${sc.home} ${esc(g.home.abbr)} · ${clockLabel(g)}</span>`
    : `<span class="text-slate-500">Starts in ${countdown(g.startsAt-now())}</span>`;
}

/* ---------------- toasts + confetti ---------------- */
function toast(msg, kind='good', ms=3000){
  const root = $('#toastRoot');

             : kind === 'bad'  ? 'border-flame/40 bg-flame/10 text-flame'
             : 'border-gold/40 bg-gold/10 text-gold';
  const n = el('div', `toast-in pointer-events-auto glass rounded-2xl border ${tone} px-4 py-3 text-[13px] font-bold shadow-2xl max-w-[92%] text-center`, esc(msg));
  root.appendChild(n);
  setTimeout(() => { n.classList.add('toast-out'); setTimeout(() => n.remove(), 300); }, ms);

function confetti(){
  const colors = ['#22e584','#ffc83d','#8b5cf6','#ff5470','#ffffff'];
  for (let i=0;i<26;i++){
    const b = el('div','confetti-bit');
    b.style.left = (Math.random()*100) + 'vw';
    b.style.background = colors[i % colors.length];
    b.style.setProperty('--dx', (Math.random()*120-60)+'px');
    b.style.setProperty('--rot', (Math.random()*900-450)+'deg');
    b.style.animationDuration = (1.5 + Math.random()*1.3)+'s';
    b.style.animationDelay = (Math.random()*.25)+'s';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 3200);
  }
}

/* ---------------- slate rotation ---------------- */
function refreshSlate(){
  const open = S.games.filter(g => !isFinal(g));
  if (open.length >= 6) return false;

  // hold on to any game a live ticket still depends on
  const needed = new Set();
  for (const b of S.bets) if (b.status === 'active') for (const l of b.legs) needed.add(l.gameId);
  const keep = S.games.filter(g => !isFinal(g) || needed.has(g.id));

  const base = now();
  const leagues = Object.keys(LEAGUES);
  const fresh = [];
  for (let i=0;i<8;i++){
    const league = leagues[Math.floor(Math.random()*leagues.length)];
    fresh.push(newMatchup(league, base + (i === 0 ? -SIM_MS*.2 : i*45*1000 + Math.random()*20000)));
  }
  S.games = [...keep, ...fresh].slice(0, 22);
  save();
  return true;
}

/* ---------------- loop ---------------- */
let tickN = 0;
function tick(){
  tickN++;
  const settled = settleBets();
  const chatter = botChatter();
  const rotated = tickN % 5 === 0 ? refreshSlate() : false;

  // a leg whose game goes final before the bet is placed can't ride along
  const before = legCount();
  S.slip.legs = S.slip.legs.filter(l => { const g = S.games.find(x => x.id === l.gameId); return g && !isFinal(g); });
  const dropped = before !== legCount();
  if (dropped){
    save();
    toast(legCount() ? 'A leg went final and left your slip.' : 'Your slip cleared — those games are final.', 'bad');
    if (ui.sheet && ui.sheet.kind === 'slip' && !legCount()) closeSheet();
  }

  if (S.balance !== ui.lastBalance){ ui.lastBalance = S.balance; renderBalance(true); }

  const ae = document.activeElement;
  const typing = !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  const modalOpen = !$('#modalRoot').classList.contains('hidden');

  const hot = ui.tab === 'home' || ui.tab === 'games';
  if (!typing && !modalOpen && (hot || tickN % 5 === 0 || settled || chatter || rotated || dropped)){
    renderMain();
    renderSlipBar();
  }
  if (!typing) refreshSheetLive();
  if (settled || chatter || rotated) save();
}

/* ---------------- boot ---------------- */
function boot(){
  S = load();
  ui.lastBalance = S.balance;

  settleBets();        // catch up on anything that finished while the tab was closed
  refreshSlate();
  S.slip.legs = S.slip.legs.filter(l => { const g = S.games.find(x => x.id === l.gameId); return g && !isFinal(g); });
  S.stats.peakBalance = Math.max(S.stats.peakBalance, S.balance);
  save();

  renderAll();
  $('#balancePill').onclick = () => go('profile');

  setInterval(tick, 1000);

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#modalRoot').classList.contains('hidden')) closeModal();
    else if (ui.sheet) closeSheet();
  });

  if (S.stats.bets === 0){
    setTimeout(() => toast('Welcome. ' + fmt(S.balance) + ' 🪙 on the house — go find a winner.', 'gold', 4500), 600);
  }
}

boot();
})();
</script>
</body>
</html>
